<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Front Cover — Mastering Modern CSS Architecture</title>
  <style>
    @page {
      size: letter;
      margin: 0;
      padding: 0;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <img class="cover-img" src="book cover/01.jpeg" alt="Front Cover — Mastering Modern CSS Architecture">
</body>
</html>
