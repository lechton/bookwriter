<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox Textbook Figures</title>
    
    <!-- External Fonts ONLY -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            font-family: 'Inter', sans-serif;
            color: #334155;
            display: flex;
            justify-content: center;
            padding: 80px 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Enforce a rigid structure for technical print fidelity */
        .textbook-page {
            width: 100%;
            max-width: 760px; /* Optimal reading/diagram width */
            min-width: 640px; /* Prevents mathematical calc() from collapsing */
            display: flex;
            flex-direction: column;
            gap: 90px;
        }

        figure {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        figcaption {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #64748B;
            text-align: center;
            line-height: 1.5;
        }

        /* 
         * FIGURE 4.2 STYLES
         * The foundational coordinate system
         */
        .fig-4-2-container {
            background-color: #F8F9FA;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            padding: 40px;
            position: relative;
            display: flex;
            justify-content: space-between;
        }

        .fig-4-2-item {
            width: 45%;
            height: 160px;
            background-color: #ffffff;
            border: 2px solid #CBD5E1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            color: #94A3B8;
            font-size: 15px;
            /* Ensure it sits above the SVG axes if needed, though they shouldn't overlap */
            z-index: 10; 
        }

        .fig-4-2-svg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .axis-label-main {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            fill: #F43F5E;
        }

        .axis-label-cross {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            fill: #3B82F6;
        }

        /* 
         * FIGURE 4.3 STYLES
         * Free space injection (space-between)
         */
        .fig-4-3-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .fig-4-3-label {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 15px;
            color: #8B5CF6;
            padding-left: 4px;
        }

        .fig-4-3-container {
            background-color: #F3E8FF;
            border: 2px solid #D8B4FE;
            border-radius: 8px;
            padding: 32px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fig-4-3-item {
            width: 120px;
            height: 80px;
            background-color: #FCB871;
            border: 2px solid #E59746;
            border-radius: 6px;
            z-index: 10; /* Keep above the dashed lines */
        }

        /* 
         * Mathematically perfect gap wrappers.
         * Padding is 32px. Item is 120px. 
         * Left edge of left gap = 32 + 120 = 152px.
         * Center of container = 50%. 
         * Center item takes 60px on each side of center.
         * Width of gap = (50% - 60px) - 152px = 50% - 212px.
         */
        .injected-space-left {
            position: absolute;
            top: 0;
            left: 152px;
            height: 100%;
            width: calc(50% - 212px);
            pointer-events: none;
        }

        .injected-space-right {
            position: absolute;
            top: 0;
            right: 152px;
            height: 100%;
            width: calc(50% - 212px);
            pointer-events: none;
        }

    </style>
</head>
<body>

    <main class="textbook-page">

        <figure>
            <div class="fig-4-2-container">
                <!-- Flex Items -->
                <div class="fig-4-2-item">flex item</div>
                <div class="fig-4-2-item">flex item</div>
                
                <!-- Precise SVG Overlay for Axes -->
                <svg class="fig-4-2-svg-overlay">
                    <defs>
                        <!-- Red Arrowhead -->
                        <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1 L 9 5 L 0 9 z" fill="#F43F5E" />
                        </marker>
                        <!-- Blue Arrowhead -->
                        <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 1 L 9 5 L 0 9 z" fill="#3B82F6" />
                        </marker>
                    </defs>

                    <!-- Main Axis (Red) -->
                    <!-- 2% to 98% keeps the line slightly padded inside the container box -->
                    <line x1="2%" y1="50%" x2="98%" y2="50%" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrow-red)" />
                    <!-- Label sits just above the line, anchored to the right end -->
                    <text x="97%" y="46%" text-anchor="end" class="axis-label-main">main axis</text>

                    <!-- Cross Axis (Blue) -->
                    <!-- 50% X aligns exactly in the mathematically calculated dead-center gap -->
                    <line x1="50%" y1="4%" x2="50%" y2="96%" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow-blue)" />
                    <!-- Label sits just right of the line, anchored near the bottom -->
                    <text x="51.5%" y="94%" text-anchor="start" class="axis-label-cross">cross axis</text>
                </svg>
            </div>
            <figcaption>Fig 4.2: The foundational coordinate system inside a flex row container.</figcaption>
        </figure>


        <figure>
            <div class="fig-4-3-wrapper">
                <div class="fig-4-3-label">space-between</div>
                <div class="fig-4-3-container">
                    <!-- Three Flex Items -->
                    <div class="fig-4-3-item"></div>
                    <div class="fig-4-3-item"></div>
                    <div class="fig-4-3-item"></div>

                    <!-- Left Gap Visualization (Mathematically locked to exact gap coordinates) -->
                    <div class="injected-space-left">
                        <svg width="100%" height="100%">
                            <!-- 50% Y precisely centers it vertically -->
                            <line x1="0" y1="50%" x2="100%" y2="50%" stroke="#A855F7" stroke-width="2" stroke-dasharray="6, 4" />
                            <circle cx="50%" cy="50%" r="4.5" fill="#A855F7" />
                        </svg>
                    </div>

                    <!-- Right Gap Visualization (Mathematically locked to exact gap coordinates) -->
                    <div class="injected-space-right">
                        <svg width="100%" height="100%">
                            <line x1="0" y1="50%" x2="100%" y2="50%" stroke="#A855F7" stroke-width="2" stroke-dasharray="6, 4" />
                            <circle cx="50%" cy="50%" r="4.5" fill="#A855F7" />
                        </svg>
                    </div>
                </div>
            </div>
            <figcaption>Fig 4.3: Free space is mathematically divided and injected exclusively between the elements.</figcaption>
        </figure>

    </main>

</body>
</html>
