<style>
  .fig-anchor-grid {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0f172a;
    box-sizing: border-box;
    page-break-inside: avoid;
    break-inside: avoid;
  }

  .fig-anchor-grid .header-pill {
    text-align: center;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.01em;
    white-space: nowrap;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    color: #1d4ed8;
    margin-bottom: 12px;
  }

  .fig-anchor-grid .main-card {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .fig-anchor-grid .canvas-stage {
    background: #f8fafc;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 220px;
    position: relative;
  }

  .fig-anchor-grid .virtual-grid {
    display: grid;
    grid-template-columns: 140px 140px 140px;
    grid-template-rows: 50px 60px 50px;
    gap: 8px;
    background: #ffffff;
    border: 1.5px dashed #94a3b8;
    border-radius: 8px;
    padding: 10px;
    position: relative;
  }

  .fig-anchor-grid .grid-cell {
    border: 1px dashed #cbd5e1;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #64748b;
    background: #f8fafc;
  }

  .fig-anchor-grid .cell-center-anchor {
    background: #eff6ff;
    border: 2px solid #3b82f6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .fig-anchor-grid .btn-anchor {
    background: #2563eb;
    color: #ffffff;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    border: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .fig-anchor-grid .cell-active-target {
    background: #ecfdf5;
    border: 2px solid #10b981;
    color: #065f46;
    font-weight: 700;
  }

  .fig-anchor-grid .active-tooltip {
    background: #065f46;
    color: #ffffff;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 10.5px;
    font-weight: 600;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .fig-anchor-grid .card-footer {
    padding: 12px 16px;
    background: #ffffff;
    border-top: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .fig-anchor-grid .footer-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #0f172a;
    font-weight: 600;
  }

  .fig-anchor-grid .footer-status {
    font-size: 11px;
    color: #059669;
    font-weight: 600;
  }
</style>

<div class="fig-anchor-grid">
  <div class="header-pill">
    THE 3×3 ANCHOR GRID: DECLARATIVE DOCKING VIA POSITION-AREA
  </div>

  <div class="main-card">
    <div class="canvas-stage">
      <div class="virtual-grid">
        <!-- Row 1: Top cells -->
        <div class="grid-cell">top left</div>
        <div class="grid-cell">top center</div>
        <div class="grid-cell">top right</div>

        <!-- Row 2: Center cells -->
        <div class="grid-cell">left</div>
        <div class="grid-cell cell-center-anchor">
          <button class="btn-anchor">--info-btn</button>
        </div>
        <div class="grid-cell">right</div>

        <!-- Row 3: Bottom cells -->
        <div class="grid-cell">bottom left</div>
        <div class="grid-cell cell-active-target">
          <div class="active-tooltip">position-area: bottom center</div>
        </div>
        <div class="grid-cell">bottom right</div>
      </div>
    </div>

    <div class="card-footer">
      <div class="footer-code">position-area: bottom center; margin-top: 8px;</div>
      <div class="footer-status">✓ Zero-Transform Centering Across Viewport</div>
    </div>
  </div>
</div>
