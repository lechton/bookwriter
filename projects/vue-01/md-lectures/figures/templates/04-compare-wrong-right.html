<div class="component-explorer vce-theme">
  <style>

    .component-explorer.vce-theme {
      margin: 1.5rem auto;

    }
    .vce-theme .vce-bar {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: linear-gradient(to bottom, #ffffff, #edf1f5);
      border-bottom: 1px solid #aeb8c5;
    }
    .vce-theme .vce-dots {
      display: flex;
      gap: 7px;

    .vce-theme .vce-dots i {

      height: 11px;

    .vce-theme .vce-dots i:nth-child(1) { background: #ef6259; border: 1px solid #d94d46; }

    .vce-theme .vce-title {

      text-align: center;
      color: #475569;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      user-select: none;
      padding-right: 48px;
    }
    .vce-theme .vce-window {
      display: flex;
      min-height: 290px;
      background: #ffffff;
    }
    /* Left Sidebar: File Tree */
    .vce-theme .vce-sidebar {

    .vce-theme .vce-tree,

      padding: 0;

    .vce-theme .vce-tree ul {

    .vce-theme .vce-tree li {
      position: relative;
      margin: 0;
      padding: 2px 0;
    }
    .vce-theme .vce-tree li::before,
    .vce-theme .vce-tree li::after {
      position: absolute;
      left: -0.62rem;
      content: "";
    }
    .vce-theme .vce-tree li::before {
      top: 0.95rem;
      width: 0.62rem;
      border-top: 1px solid #cbd5e1;
    }
    .vce-theme .vce-tree li::after {
      top: 0;
      width: 0;
      height: 100%;
      border-left: 1px solid #cbd5e1;
    }
    .vce-theme .vce-sidebar > .vce-tree > li::before,
    .vce-theme .vce-sidebar > .vce-tree > li::after {
      display: none;
    }
    .vce-theme .vce-tree li:last-child::after {
      height: 0.95rem;
    }
    .vce-theme .vce-tree-label {

      align-items: center;
      gap: 0.45rem;
      padding: 0.28rem 0.38rem;
      border-radius: 5px;

      white-space: nowrap;
      user-select: none;
      font-size: 0.8rem;
