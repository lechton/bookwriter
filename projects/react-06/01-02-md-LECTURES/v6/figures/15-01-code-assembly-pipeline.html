<div class="pipeline-card-figure assembly-steps-figure">
  <style>
    .assembly-steps-figure {

      border: 1px solid rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
      margin-bottom: 10px;
    }
    .assembly-steps-figure .step-card:last-child {
      margin-bottom: 0;
    }
    .assembly-steps-figure .card-edge {
      width: 9px;
      flex-shrink: 0;
    }
    .assembly-steps-figure .card-main {
      display: flex;
      flex-direction: row;
      flex: 1;
      align-items: stretch;
    }
    .assembly-steps-figure .step-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      min-width: 76px;
      box-sizing: border-box;
    }
    .assembly-steps-figure .step-text {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #1f2937;
      line-height: 1;
      margin-bottom: 2px;
    }
    .assembly-steps-figure .step-num {
      font-size: 1.85rem;
      font-weight: 800;
      color: #111827;
      line-height: 1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .assembly-steps-figure .card-divider-wrap {

      align-items: center;

    .assembly-steps-figure .card-content {

      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
    }
    .assembly-steps-figure .card-title {

      font-weight: 700;
      color: #111827;

      border-radius: 4px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(15, 23, 42, 0.12);
      color: #0f172a;

    .assembly-steps-figure .step-1 .card-edge { background: #2563eb; }

          <span class="component-tag">&lt;src/App.jsx&gt;</span>

        </div>
      </div>
    </div>

          <span class="component-tag">&lt;src/components/LikeLabel.jsx&gt;</span>
        </div>
      </div>
    </div>
