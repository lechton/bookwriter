interface:
  display_name: "Map Principles"
  short_description: "Discover, route, and select lesson principles"
  default_prompt: "Use $map-principles to build or audit a lesson principle map: confirm that bank row {nn} in questions/questions.md and the syllabus card carry the same topic tag and question, then run map-blind Discovery over the syllabus card, the react.dev pages for its topic, and senior engineering knowledge, then run Selection to route ownership through the whole syllabus, apply the importance and atomicity tests, fill the candidate ledger, and number the surviving principles last."
