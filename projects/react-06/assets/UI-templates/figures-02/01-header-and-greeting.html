<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flat Template 01: Header & Greeting Suite</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #e2e8f0;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Canonical Textbook Component Explorer Frame */
  .component-explorer {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #aeb8c5;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.07), 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  .component-explorer-bar {
    display: flex;
    align-items: center;
    padding: 11px 14px;
    background: linear-gradient(to bottom, #ffffff, #edf1f5);
    border-bottom: 1px solid #aeb8c5;
  }
  .component-explorer-dots {
    display: flex;
    gap: 8px;
    margin-right: 0;
  }
  .component-explorer-dots i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }
  .component-explorer-dots i:nth-child(1) { background: #ef6259; border: 1px solid #d94d46; }
  .component-explorer-dots i:nth-child(2) { background: #f3b62f; border: 1px solid #d79c1f; }
  .component-explorer-dots i:nth-child(3) { background: #55bd55; border: 1px solid #3da543; }
  .component-explorer-title {
    flex: 1;
    padding-right: 56px;
    text-align: center;
    color: #475569;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    user-select: none;
  }
  .component-explorer-window {
    display: flex;
  }
  .component-explorer-stage {
    display: flex;
    flex: 1;
    min-width: 0;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: #f1f5f9;
  }
  .component-explorer-canvas {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }

  /* Canonical Textbook Node Proportions & Flat Coloring */
  .component-explorer-node {
    position: relative;
    margin-top: 1rem;
    padding: 2.15rem 1rem 1.15rem;
    border: 2px dashed #94a3b8;
    border-radius: 9px;
    background: #fff;
    box-shadow: 0 4px 8px -4px rgba(15, 23, 42, 0.12);
  }
  .component-explorer-node .component-explorer-node {
    padding: 2.05rem 0.85rem 1rem;
  }
  .component-explorer-node .component-explorer-node .component-explorer-node {
    padding: 1.95rem 0.75rem 0.9rem;
  }
  .component-explorer-node:first-child {
    margin-top: 0;
  }
  .component-explorer-label {
    position: absolute;
    top: -2px;
    left: -2px;
    display: flex;
    align-items: baseline;
    max-width: calc(100% + 4px);
    padding: 0.34rem 0.7rem;
    border-radius: 9px 0 9px 0;
    color: #fff;
    font-family: "IBM Plex Mono", "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .component-explorer-props {
    margin-left: 0.45rem;
    color: inherit;
    font-weight: 400;
    font-style: italic;
    opacity: 0.9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Semantic Kinds */
  .component-kind-shell { border-color: #475569; background: #f8fafc; }
  .component-kind-shell > .component-explorer-label { background: #475569; }
  .component-kind-header { border-color: #7c3aed; background: #faf5ff; }
  .component-kind-header > .component-explorer-label { background: #7c3aed; }
  .component-kind-profile { border-color: #0284c7; background: #f0f9ff; }
  .component-kind-profile > .component-explorer-label { background: #0284c7; }
  .component-kind-badge { border-color: #d97706; background: #fffbeb; }
  .component-kind-badge > .component-explorer-label { background: #d97706; }

  .component-explorer-children {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  /* Flat UI Surface & Descriptors */
  .flat-elem {
    position: relative;
    display: flex;
    align-items: center;
    margin: 0.35rem 0 0.15rem;
  }
  .flat-elem::before {
    content: attr(data-elem);
    position: absolute;
    top: -9px;
    right: 8px;
    display: inline-flex;
    align-items: center;
    padding: 1px 6px;
    font-family: "IBM Plex Mono", "JetBrains Mono", monospace;
    font-size: 0.63rem;
    font-weight: 700;
    color: #334155;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    z-index: 2;
  }

  .surface-render {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    width: 100%;
    padding: 0.25rem 0;
  }

  /* Flat UI Badge */
  .surface-ui-badge {
    display: inline-flex;
    align-items: center;
    padding: 0.42rem 1.15rem;
    border-radius: 9999px;
    background: #e0f2fe;
    border: 1.5px solid #bae6fd;
    color: #0369a1;
    font-size: 0.80rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>

<section class="component-explorer component-explorer-no-sidebar" aria-label="national-times - Rendered UI Canvas">
  <div class="component-explorer-bar">
    <div class="component-explorer-dots"><i></i><i></i><i></i></div>
    <span class="component-explorer-title">national-times - Rendered UI Canvas</span>
  </div>
  <div class="component-explorer-window">
    <div class="component-explorer-stage">
      <div class="component-explorer-canvas">

        <!-- PARENT COMPONENT: App -->
        <div class="component-explorer-node component-kind-shell">
          <div class="component-explorer-label"><span>App</span></div>

          <div class="component-explorer-children">

            <!-- CHILD COMPONENT: SiteHeader -->
            <div class="component-explorer-node component-kind-header">
              <div class="component-explorer-label"><span>SiteHeader</span></div>

              <div class="component-explorer-children">

                <!-- GRANDCHILD 1: ReaderGreeting -->
                <div class="component-explorer-node component-kind-profile">
                  <div class="component-explorer-label">
                    <span>ReaderGreeting</span>
                    <span class="component-explorer-props">readerName="Elena Rostova"</span>
                  </div>
                  
                  <div class="flat-elem" data-elem="[badge: capsule]">
                    <div class="surface-render">
                      <span class="surface-ui-badge">Welcome back, Elena Rostova</span>
                    </div>
                  </div>
                </div>

                <!-- GRANDCHILD 2: SubscriberBadge -->
                <div class="component-explorer-node component-kind-badge">
                  <div class="component-explorer-label">
                    <span>SubscriberBadge</span>
                    <span class="component-explorer-props">readerName="Elena Rostova" tier="Premium"</span>
                  </div>

                  <div class="flat-elem" data-elem="[badge: capsule]">
                    <div class="surface-render">
                      <span class="surface-ui-badge">Premium</span>
                      <span class="surface-ui-badge">Elena Rostova</span>
                    </div>
                  </div>
                </div>

              </div>
            </div><!-- /SiteHeader -->

          </div>
        </div><!-- /App -->

      </div>
    </div>
  </div>
</section>

</body>
</html>
