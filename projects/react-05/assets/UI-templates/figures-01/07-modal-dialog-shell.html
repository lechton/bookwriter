<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Template 07: Modal Dialog Shell</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f8fafc;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .component-explorer {
    width: 100%;
    max-width: 640px;
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.04);
  }
  .explorer-bar {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    background: linear-gradient(to bottom, #ffffff, #f1f5f9);
    border-bottom: 1.5px solid #cbd5e1;
  }
  .explorer-dots { display: flex; gap: 6px; }
  .explorer-dots i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .explorer-dots i:nth-child(1) { background: #ef4444; }
  .explorer-dots i:nth-child(2) { background: #f59e0b; }
  .explorer-dots i:nth-child(3) { background: #10b981; }
  .explorer-title {
    flex: 1;
    text-align: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    font-weight: 700;
    color: #475569;
    padding-right: 36px;
  }
  .explorer-stage {
    padding: 24px;
    background: #e2e8f0; /* dimmed backdrop */
  }

  /* Component Node Container */
  .component-node {
    position: relative;
    padding: 28px 18px 18px;
    border: 2px dashed #e11d48;
    border-radius: 9px;
    background: #ffffff;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
  }
  .component-label {
    position: absolute;
    top: -2px;
    left: -2px;
    display: flex;
    align-items: baseline;
    padding: 4px 10px;
    background: #e11d48;
    color: #ffffff;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.76rem;
    font-weight: 700;
    border-top-left-radius: 7px;
    border-bottom-right-radius: 7px;
    line-height: 1;
  }
  .component-props {
    margin-left: 6px;
    font-weight: 400;
    font-style: italic;
    opacity: 0.9;
    font-size: 0.72rem;
  }

  /* Inspector Element Wrappers */
  .ui-elem {
    position: relative;
    margin: 12px 0 6px;
    padding: 10px 12px;
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 7px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
  }
  .ui-elem:first-child { margin-top: 4px; }
  .ui-elem::before {
    content: attr(data-elem);
    position: absolute;
    top: -10px;
    right: 12px;
    display: inline-flex;
    align-items: center;
    padding: 1px 7px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.65rem;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: 0.02em;
    color: #ffffff;
    background: #9f1239;
    border: 1px solid #881337;
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    z-index: 2;
  }

  /* Header Row */
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title {
    font-size: 0.94rem;
    font-weight: 700;
    color: #0f172a;
  }
  .btn-close {
    background: none;
    border: none;
    font-size: 1.1rem;
    color: #64748b;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }

  /* Body Content */
  .modal-body-text {
    font-size: 0.82rem;
    line-height: 1.45;
    color: #475569;
    margin-bottom: 8px;
  }
  .confirm-input-wrap {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .confirm-label {
    font-size: 0.70rem;
    font-weight: 700;
    color: #e11d48;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .confirm-input {
    padding: 6px 10px;
    border: 1.5px solid #fca5a5;
    border-radius: 5px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.80rem;
    color: #991b1b;
    background: #fff5f5;
  }

  /* Footer Controls */
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .btn-cancel {
    padding: 6px 12px;
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 600;
    color: #475569;
    cursor: pointer;
  }
  .btn-danger {
    padding: 6px 14px;
    background: #e11d48;
    border: 1px solid #be123c;
    border-radius: 6px;
    font-size: 0.78rem;
    font-weight: 700;
    color: #ffffff;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(225, 29, 72, 0.25);
  }
</style>
</head>
<body>

<div class="component-explorer">
  <div class="explorer-bar">
    <div class="explorer-dots"><i></i><i></i><i></i></div>
    <div class="explorer-title">ConfirmModal.jsx — Component Explorer</div>
  </div>
  <div class="explorer-stage">
    <div class="component-node">
      <div class="component-label">
        &lt;ConfirmModal&gt;
        <span class="component-props">isOpen={true} type="danger"</span>
      </div>

      <!-- 1. Header with Close Button -->
      <div class="ui-elem" data-elem="[header.modal-header]">
        <div class="modal-head">
          <span class="modal-title">Retract Published Dispatch</span>
          <button class="btn-close" type="button" aria-label="Close">✕</button>
        </div>
      </div>

      <!-- 2. Body Slot with Warning & Confirmation Input -->
      <div class="ui-elem" data-elem="[slot: body]">
        <p class="modal-body-text">Retracting this article will remove it immediately from all live news tickers and syndication partners. This action cannot be undone.</p>
        <div class="confirm-input-wrap">
          <span class="confirm-label">Type RETRACT to confirm</span>
          <div class="confirm-input">RETRACT|</div>
        </div>
      </div>

      <!-- 3. Footer Action Controls -->
      <div class="ui-elem" data-elem="[footer.modal-footer]">
        <div class="modal-actions">
          <button class="btn-cancel" type="button">Cancel</button>
          <button class="btn-danger" type="button">Confirm Retraction</button>
        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
