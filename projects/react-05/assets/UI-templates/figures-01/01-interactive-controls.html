<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Template 01: Interactive Controls</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f8fafc;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .component-explorer {
    width: 100%;
    max-width: 640px;
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.04);
  }
  .explorer-bar {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    background: linear-gradient(to bottom, #ffffff, #f1f5f9);
    border-bottom: 1.5px solid #cbd5e1;
  }
  .explorer-dots { display: flex; gap: 6px; }
  .explorer-dots i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .explorer-dots i:nth-child(1) { background: #ef4444; }
  .explorer-dots i:nth-child(2) { background: #f59e0b; }
  .explorer-dots i:nth-child(3) { background: #10b981; }
  .explorer-title {
    flex: 1;
    text-align: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    font-weight: 700;
    color: #475569;
    padding-right: 36px;
  }
  .explorer-stage {
    padding: 24px;
    background: #f8fafc;
  }

  /* Component Node Container */
  .component-node {
    position: relative;
    padding: 28px 18px 18px;
    border: 2px dashed #0284c7;
    border-radius: 9px;
    background: #ffffff;
    box-shadow: 0 4px 10px rgba(15, 23, 42, 0.05);
  }
  .component-label {
    position: absolute;
    top: -2px;
    left: -2px;
    display: flex;
    align-items: baseline;
    padding: 4px 10px;
    background: #0284c7;
    color: #ffffff;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.76rem;
    font-weight: 700;
    border-top-left-radius: 7px;
    border-bottom-right-radius: 7px;
    line-height: 1;
  }
  .component-props {
    margin-left: 6px;
    font-weight: 400;
    font-style: italic;
    opacity: 0.9;
    font-size: 0.72rem;
  }

  /* Inspector Element Wrappers */
  .ui-elem {
    position: relative;
    margin: 14px 0 6px;
    padding: 12px 14px;
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 7px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
  }
  .ui-elem:first-child { margin-top: 6px; }
  .ui-elem::before {
    content: attr(data-elem);
    position: absolute;
    top: -10px;
    right: 12px;
    display: inline-flex;
    align-items: center;
    padding: 1px 7px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.65rem;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: 0.02em;
    color: #ffffff;
    background: #1e293b;
    border: 1px solid #0f172a;
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    z-index: 2;
  }

  /* Specific Controls */
  .btn-group {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: #0284c7;
    color: #ffffff;
    font-size: 0.82rem;
    font-weight: 600;
    border: 1px solid #0369a1;
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(2, 132, 199, 0.25);
    cursor: pointer;
  }
  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: #ffffff;
    color: #334155;
    font-size: 0.82rem;
    font-weight: 600;
    border: 1.5px solid #cbd5e1;
    border-radius: 6px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    cursor: pointer;
  }
  .btn-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    color: #475569;
    cursor: pointer;
  }

  .input-control {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .input-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #64748b;
  }
  .input-field-wrapper {
    display: flex;
    align-items: center;
    padding: 6px 10px;
    background: #f8fafc;
    border: 1.5px solid #cbd5e1;
    border-radius: 6px;
    gap: 8px;
  }
  .input-icon {
    width: 14px;
    height: 14px;
    color: #94a3b8;
    flex-shrink: 0;
  }
  .input-placeholder {
    font-size: 0.82rem;
    color: #64748b;
    font-style: italic;
  }

  .select-wrapper {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 12px;
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 6px;
    font-size: 0.82rem;
    color: #1e293b;
    font-weight: 500;
  }

  .switch-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .switch-label {
    font-size: 0.82rem;
    font-weight: 600;
    color: #1e293b;
  }
  .switch-track {
    position: relative;
    width: 38px;
    height: 20px;
    background: #0284c7;
    border-radius: 9999px;
  }
  .switch-thumb {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    background: #ffffff;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>

<div class="component-explorer">
  <div class="explorer-bar">
    <div class="explorer-dots"><i></i><i></i><i></i></div>
    <div class="explorer-title">ControlPanel.jsx — Component Explorer</div>
  </div>
  <div class="explorer-stage">
    <div class="component-node">
      <div class="component-label">
        &lt;ControlPanel&gt;
        <span class="component-props">mode="editorial"</span>
      </div>

      <!-- 1. Text Input -->
      <div class="ui-elem" data-elem="[input: text]">
        <div class="input-control">
          <span class="input-label">Filter Wire</span>
          <div class="input-field-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span class="input-placeholder">Search breaking headlines, tags, or authors...</span>
          </div>
        </div>
      </div>

      <!-- 2. Select Dropdown -->
      <div class="ui-elem" data-elem="[select]">
        <div class="select-wrapper">
          <span>Desk: Investigative Journalism</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>

      <!-- 3. Toggle Switch -->
      <div class="ui-elem" data-elem="[switch]">
        <div class="switch-row">
          <span class="switch-label">Live Dispatch Alerts</span>
          <div class="switch-track"><div class="switch-thumb"></div></div>
        </div>
      </div>

      <!-- 4. Action Buttons -->
      <div class="ui-elem" data-elem="[button]">
        <div class="btn-group">
          <button class="btn-primary" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            Publish Story
          </button>
          <button class="btn-secondary" type="button">Save Draft</button>
          <button class="btn-icon" type="button" aria-label="Bookmark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
