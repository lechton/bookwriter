<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flat Template 04: Interactive Form & Controlled Inputs Suite</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #e2e8f0;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Canonical Textbook Component Explorer Frame */
  .component-explorer {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #aeb8c5;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.07), 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  .component-explorer-bar {
    display: flex;
    align-items: center;
    padding: 11px 14px;
    background: linear-gradient(to bottom, #ffffff, #edf1f5);
    border-bottom: 1px solid #aeb8c5;
  }
  .component-explorer-dots {
    display: flex;
    gap: 8px;
    margin-right: 0;
  }
  .component-explorer-dots i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
  }
  .component-explorer-dots i:nth-child(1) { background: #ef6259; border: 1px solid #d94d46; }
  .component-explorer-dots i:nth-child(2) { background: #f3b62f; border: 1px solid #d79c1f; }
  .component-explorer-dots i:nth-child(3) { background: #55bd55; border: 1px solid #3da543; }
  .component-explorer-title {
    flex: 1;
    padding-right: 56px;
    text-align: center;
    color: #475569;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    user-select: none;
  }
  .component-explorer-window {
    display: flex;
  }
  .component-explorer-stage {
    display: flex;
    flex: 1;
    min-width: 0;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: #f1f5f9;
  }
  .component-explorer-canvas {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }

  /* Canonical Textbook Node Proportions & Flat Coloring */
  .component-explorer-node {
    position: relative;
    margin-top: 1rem;
    padding: 2.15rem 1rem 1.15rem;
    border: 2px dashed #94a3b8;
    border-radius: 9px;
    background: #fff;
    box-shadow: 0 4px 8px -4px rgba(15, 23, 42, 0.12);
  }
  .component-explorer-node .component-explorer-node {
    padding: 2.05rem 0.85rem 1rem;
  }
  .component-explorer-node:first-child {
    margin-top: 0;
  }
  .component-explorer-label {
    position: absolute;
    top: -2px;
    left: -2px;
    display: flex;
    align-items: baseline;
    max-width: calc(100% + 4px);
    padding: 0.34rem 0.7rem;
    border-radius: 9px 0 9px 0;
    color: #fff;
    font-family: "IBM Plex Mono", "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .component-explorer-props {
    margin-left: 0.45rem;
    color: inherit;
    font-weight: 400;
    font-style: italic;
    opacity: 0.9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Semantic Kinds */
  .component-kind-shell { border-color: #475569; background: #f8fafc; }
  .component-kind-shell > .component-explorer-label { background: #475569; }
  .component-kind-form { border-color: #0891b2; background: #ecfeff; }
  .component-kind-form > .component-explorer-label { background: #0891b2; }
  .component-kind-card { border-color: #2563eb; background: #eff6ff; }
  .component-kind-card > .component-explorer-label { background: #2563eb; }

  .component-explorer-children {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  /* Descriptors */
  .flat-elem {
    position: relative;
    margin: 0.35rem 0 0.15rem;
  }
  .flat-elem::before {
    content: attr(data-elem);
    position: absolute;
    top: -9px;
    right: 8px;
    display: inline-flex;
    align-items: center;
    padding: 1px 6px;
    font-family: "IBM Plex Mono", "JetBrains Mono", monospace;
    font-size: 0.63rem;
    font-weight: 700;
    color: #334155;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    z-index: 2;
  }

  /* Flat UI Elements */
  .surface-ui-input {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 0.5rem 0.85rem;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background: #ffffff;
    box-sizing: border-box;
  }
  .surface-ui-input-placeholder {
    font-size: 0.78rem;
    color: #64748b;
    font-style: italic;
  }
  .btn-cluster {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 0.2rem 0;
  }
  .surface-ui-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.42rem 1.1rem;
    border: none;
    border-radius: 6px;
    background: #0891b2;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
  }
  .surface-ui-btn-outline {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.42rem 1.1rem;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background: #ffffff;
    color: #334155;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
  }
  .surface-render {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    width: 100%;
    padding: 0.25rem 0;
  }
  .surface-ui-badge {
    display: inline-flex;
    align-items: center;
    padding: 0.35rem 0.9rem;
    border-radius: 9999px;
    background: #e0f2fe;
    border: 1.5px solid #bae6fd;
    color: #0369a1;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>

<section class="component-explorer component-explorer-no-sidebar" aria-label="FeedbackDesk - Rendered UI Canvas">
  <div class="component-explorer-bar">
    <div class="component-explorer-dots"><i></i><i></i><i></i></div>
    <span class="component-explorer-title">FeedbackDesk - Rendered UI Canvas</span>
  </div>
  <div class="component-explorer-window">
    <div class="component-explorer-stage">
      <div class="component-explorer-canvas">

        <!-- PARENT COMPONENT: App -->
        <div class="component-explorer-node component-kind-shell">
          <div class="component-explorer-label"><span>App</span></div>

          <div class="component-explorer-children">

            <!-- CHILD COMPONENT 1: FeedbackDesk -->
            <div class="component-explorer-node component-kind-form">
              <div class="component-explorer-label">
                <span>FeedbackDesk</span>
                <span class="component-explorer-props">storyId="904" isSubscriber={true}</span>
              </div>

              <!-- Input Box -->
              <div class="flat-elem" data-elem="[input: text]">
                <div class="surface-ui-input">
                  <span class="surface-ui-input-placeholder">Add your verified subscriber perspective to this report...</span>
                </div>
              </div>

              <!-- Button Cluster -->
              <div class="flat-elem" data-elem="[button]">
                <div class="btn-cluster">
                  <button class="surface-ui-btn" type="button">Post Commentary</button>
                  <button class="surface-ui-btn-outline" type="button">Save to Dossier</button>
                </div>
              </div>

            </div><!-- /FeedbackDesk -->

            <!-- CHILD COMPONENT 2: ThreadMetrics -->
            <div class="component-explorer-node component-kind-card">
              <div class="component-explorer-label">
                <span>ThreadMetrics</span>
                <span class="component-explorer-props">desk="public-transit"</span>
              </div>

              <div class="flat-elem" data-elem="[div.stats]">
                <div class="surface-render">
                  <span class="surface-ui-badge">84 Comments</span>
                  <span class="surface-ui-badge">3.2k Reads</span>
                  <span class="surface-ui-badge">412 Dispatches Shared</span>
                </div>
              </div>
            </div><!-- /ThreadMetrics -->

          </div>
        </div><!-- /App -->

      </div>
    </div>
  </div>
</section>

</body>
</html>
