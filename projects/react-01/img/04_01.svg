<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 730" width="800" height="730">
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="shadow-island" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0E7490" flood-opacity="0.12" />
    </filter>
    <filter id="shadow-pill" x="-6%" y="-10%" width="112%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <!-- Arrowheads -->
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0E7490" />
    </marker>
    <marker id="arrow-down-teal" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1.5 0 L 5 8 L 8.5 0 z" fill="#0E7490" />
    </marker>
  </defs>

  <style>
    text { text-rendering: geometricPrecision; }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="730" fill="#FFFFFF" />

  <!-- Top Title Area -->
  <g transform="translate(24, 16)">
    <rect width="100" height="22" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="1" />
    <text x="50" y="15.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#334155">ARCHITECTURE</text>
    <text x="114" y="17.5" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0F172A">The Entry Bridge: Host Document Sandbox vs. React Runtime</text>
    <text x="114" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B">Why React mounts to a designated container (&lt;div id="root"&gt;), never directly to document.body</text>
  </g>

  <!-- ==================== ZONE A: HOST BROWSER DOCUMENT (LEFT) ==================== -->
  <g transform="translate(24, 62)" filter="url(#shadow-card)">
    <!-- Main Window Frame -->
    <rect width="364" height="442" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    
    <!-- Top Browser Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 30 L 0 30 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <circle cx="16" cy="15" r="4" fill="#EF4444" />
    <circle cx="28" cy="15" r="4" fill="#F59E0B" />
    <circle cx="40" cy="15" r="4" fill="#10B981" />
    <rect x="56" y="7" width="230" height="16" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="64" y="19" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#64748B">national-times.com/news/104</text>
    <text x="296" y="19" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">HTML</text>

    <!-- document.body Warning Container -->
    <rect x="12" y="38" width="340" height="46" rx="6" fill="#FEF2F2" stroke="#F87171" stroke-width="1" />
    <text x="22" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#DC2626">❌ NEVER: createRoot(document.body)</text>
    <text x="22" y="72" font-family="system-ui, sans-serif" font-size="9.5" fill="#7F1D1D">Overwrites browser extension overlays, tag managers &amp; analytics.</text>

    <!-- Legacy Server Header -->
    <rect x="12" y="90" width="340" height="28" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="22" y="108" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#475569">PHP CMS HEADER: The National Times (Server Rendered)</text>

    <!-- Legacy Article Intro -->
    <rect x="12" y="124" width="340" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <text x="22" y="140" font-family="'SF Mono', Menlo, monospace" font-size="10" fill="#64748B">&lt;article&gt; Server Article Content: Severe weather alerts...</text>

    <!-- THE DESIGNATED CONTAINER: <div id="root"> (Sandbox Island) -->
    <g transform="translate(12, 154)" filter="url(#shadow-island)">
      <rect width="340" height="194" rx="8" fill="#FEF9C3" stroke="#0E7490" stroke-width="2" />
      
      <!-- Container Top Header -->
      <path d="M 0 8 Q 0 0 8 0 L 332 0 Q 340 0 340 8 L 340 26 L 0 26 Z" fill="#0E7490" />
      <text x="12" y="18" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF">SANDBOX ISLAND: &lt;div id="root"&gt;</text>
      <text x="210" y="18" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="700" fill="#CCFBF1">DOM CONTAINER</text>

      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#854D0E">React owns 100% of this subtree • Wipes container on initial render</text>

      <!-- Mounted AlertBanner Widget -->
      <rect x="12" y="52" width="316" height="42" rx="5" fill="#FFFFFF" stroke="#0E7490" stroke-width="1" />
      <rect x="20" y="60" width="76" height="16" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8" />
      <text x="25" y="72" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#DC2626">BREAKING NEWS</text>
      <text x="104" y="72" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#0F172A">Storm Warning: Coastal Districts</text>
      <text x="20" y="87" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B">Active high-wind advisory across coastal regions</text>

      <!-- Mounted DistrictCounter Widget -->
      <rect x="12" y="100" width="316" height="38" rx="5" fill="#FFFFFF" stroke="#0E7490" stroke-width="1" />
      <text x="20" y="117" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0F172A">Affected districts: 3</text>
      <text x="20" y="131" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#059669">● Response status: Active</text>
      <text x="210" y="125" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="700" fill="#0E7490">&lt;DistrictCounter /&gt;</text>

      <!-- Isolation Guarantee Banner -->
      <rect x="12" y="146" width="316" height="36" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-width="1" />
      <text x="20" y="162" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#065F46">✔ ZERO POLLUTION BOUNDARY</text>
      <text x="20" y="175" font-family="system-ui, sans-serif" font-size="9.5" fill="#047857">Surrounding host page, styles &amp; global scripts remain 100% untouched</text>
    </g>

    <!-- Legacy Server Footer -->
    <rect x="12" y="356" width="340" height="26" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <text x="22" y="373" font-family="system-ui, sans-serif" font-size="10" fill="#475569">&lt;footer&gt; Server Footer: © The National Times (Untouched)&lt;/footer&gt;</text>

    <!-- Teardown Instruction -->
    <rect x="12" y="388" width="340" height="44" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
    <text x="22" y="405" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#0F172A">Explicit Teardown: root.unmount()</text>
    <text x="22" y="422" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B">Destroys tree, frees listeners &amp; restores container when removing widget.</text>
  </g>

  <!-- ==================== ZONE B: REACT RUNTIME & ENTRY BRIDGE (RIGHT) ==================== -->
  
  <!-- Card 1: Entry Point Code (src/main.jsx) -->
  <g transform="translate(412, 62)" filter="url(#shadow-card)">
    <rect width="364" height="212" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#475569">ENTRY POINT: src/main.jsx</text>

    <!-- Code Content -->
    <text x="14" y="48" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748B">import { createRoot } from 'react-dom/client';</text>
    <text x="14" y="66" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#64748B">import App from './App.jsx';</text>

    <!-- Step 1: Locate container -->
    <text x="14" y="88" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0E7490">① LOCATE PHYSICAL CONTAINER IN DOM</text>
    <g transform="translate(10, 94)">
      <rect width="344" height="24" rx="4" fill="#FEF9C3" stroke="#FDE047" stroke-width="1" />
      <text x="10" y="16.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#0F172A">const domNode = document.getElementById('root');</text>
    </g>

    <!-- Step 2: Initialize Concurrent Root -->
    <text x="14" y="134" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0E7490">② INITIALIZE CONCURRENT FIBER ROOT</text>
    <g transform="translate(10, 140)">
      <rect width="344" height="24" rx="4" fill="#FEF9C3" stroke="#FDE047" stroke-width="1" />
      <text x="10" y="16.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#0F172A">const root = createRoot(domNode);</text>
    </g>

    <!-- Step 3: Render Tree -->
    <text x="14" y="180" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0E7490">③ EVALUATE AND MOUNT COMPONENT TREE</text>
    <g transform="translate(10, 186)">
      <rect width="344" height="24" rx="4" fill="#FEF9C3" stroke="#FDE047" stroke-width="1" />
      <text x="10" y="16.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" font-weight="700" fill="#0F172A">root.render(&lt;App /&gt;);</text>
    </g>
  </g>

  <!-- Downward Connector Arrow from main.jsx to Virtual Tree -->
  <line x1="594" y1="274" x2="594" y2="296" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-down-teal)" />

  <!-- Card 2: Virtual Component Tree -->
  <g transform="translate(412, 302)" filter="url(#shadow-card)">
    <rect width="364" height="202" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F0FDFA" stroke="#0E7490" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#0E7490">IN-MEMORY VIRTUAL COMPONENT TREE</text>

    <!-- App Node -->
    <rect x="117" y="40" width="130" height="32" rx="6" fill="#0E7490" stroke="#0F172A" stroke-width="1.2" />
    <text x="182" y="60.5" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="12" font-weight="800" fill="#FFFFFF">&lt;App /&gt;</text>

    <!-- Branch Lines -->
    <path d="M 182 72 L 182 86 L 82 86 L 82 100" stroke="#0E7490" stroke-width="1.5" fill="none" />
    <path d="M 182 86 L 282 86 L 282 100" stroke="#0E7490" stroke-width="1.5" fill="none" />

    <!-- Child 1: AlertBanner -->
    <g transform="translate(10, 100)">
      <rect width="150" height="52" rx="6" fill="#F8FAFC" stroke="#0E7490" stroke-width="1.2" />
      <text x="75" y="22" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#0F172A">&lt;AlertBanner /&gt;</text>
      <text x="75" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B">severity="urgent"</text>
    </g>

    <!-- Child 2: DistrictCounter -->
    <g transform="translate(204, 100)">
      <rect width="150" height="52" rx="6" fill="#F8FAFC" stroke="#0E7490" stroke-width="1.2" />
      <text x="75" y="22" text-anchor="middle" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#0F172A">&lt;DistrictCounter /&gt;</text>
      <text x="75" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B">count={3}</text>
    </g>

    <!-- Tree Meta Footer -->
    <text x="182" y="178" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0E7490">Evaluated in memory • Dispatches minimal DOM mutations</text>
  </g>

  <!-- ==================== THE BRIDGE: ARTERIAL CONDUIT ==================== -->
  <!-- Arched bridge connecting In-Memory Virtual Tree to <div id="root"> on Left -->
  <path d="M 412 360 C 390 360 380 310 358 310" stroke="#0E7490" stroke-width="3" fill="none" marker-end="url(#arrow-teal)" />
  
  <!-- Bridge Pill Badge -->
  <g transform="translate(385, 335)" filter="url(#shadow-pill)">
    <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#0E7490" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="0" y="4.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF">MOUNT ➔</text>
  </g>

  <!-- ==================== ZONE C: THREE ARCHITECTURAL TAKEAWAYS ==================== -->
  <!-- Card 1: Sandbox Boundary -->
  <g transform="translate(24, 524)" filter="url(#shadow-card)">
    <rect width="240" height="186" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 232 0 Q 240 0 240 8 L 240 28 L 0 28 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0F172A">1. SANDBOX BOUNDARY</text>
    
    <text x="12" y="48" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0E7490">TARGETED MOUNTING:</text>
    <text x="12" y="63" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">React operates strictly inside &lt;div id="root"&gt;.</text>
    <text x="12" y="76" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Surrounding host HTML is untouched.</text>

    <text x="12" y="98" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#DC2626">NEVER DOCUMENT.BODY:</text>
    <text x="12" y="113" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Mounting to &lt;body&gt; destroys extension tags,</text>
    <text x="12" y="126" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">analytics, and breaks reconciliation.</text>

    <text x="12" y="148" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#059669">MULTI-ROOT READY:</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">A CMS page can host several isolated roots.</text>
  </g>

  <!-- Card 2: Two-Step Concurrent Lifecycle -->
  <g transform="translate(280, 524)" filter="url(#shadow-card)">
    <rect width="240" height="186" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 232 0 Q 240 0 240 8 L 240 28 L 0 28 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0F172A">2. TWO-STEP CONCURRENCY</text>
    
    <text x="12" y="48" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0E7490">createRoot(domNode):</text>
    <text x="12" y="63" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Builds in-memory concurrent root container.</text>
    <text x="12" y="76" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Enables background rendering &amp; transitions.</text>

    <text x="12" y="98" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0E7490">root.render(&lt;App /&gt;):</text>
    <text x="12" y="113" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Evaluates JSX, builds DOM &amp; updates.</text>
    <text x="12" y="126" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Subsequent calls perform diff reconciliation.</text>

    <text x="12" y="148" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#DC2626">REMOVED IN REACT 19:</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Legacy synchronous ReactDOM.render is dead.</text>
  </g>

  <!-- Card 3: Teardown & Hydration -->
  <g transform="translate(536, 524)" filter="url(#shadow-card)">
    <rect width="240" height="186" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 232 0 Q 240 0 240 8 L 240 28 L 0 28 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0F172A">3. TEARDOWN &amp; HYDRATION</text>
    
    <text x="12" y="48" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0E7490">root.unmount():</text>
    <text x="12" y="63" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Fires component cleanup, detaches listeners,</text>
    <text x="12" y="76" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">and empties DOM to prevent memory leaks.</text>

    <text x="12" y="98" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#854D0E">SSR VS CLIENT:</text>
    <text x="12" y="113" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">createRoot wipes existing HTML inside node.</text>
    <text x="12" y="126" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">For server HTML, use hydrateRoot instead.</text>

    <text x="12" y="148" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#059669">PACKAGING:</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Import createRoot from react-dom/client.</text>
  </g>
</svg>
