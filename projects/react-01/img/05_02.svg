<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 730" width="800" height="730">
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="shadow-pill" x="-6%" y="-10%" width="112%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <!-- Arrowheads -->
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0E7490" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
  </defs>

  <style>
    text { text-rendering: geometricPrecision; }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="730" fill="#FFFFFF" />

  <!-- Top Title Area -->
  <g transform="translate(24, 16)">
    <rect width="136" height="22" rx="4" fill="#F1F5F9" stroke="#64748B" stroke-width="1" />
    <text x="68" y="15.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#334155">COMPILER X-RAY</text>
    <text x="148" y="17.5" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#0F172A">The Compiler X-Ray: JSX Abstraction vs. JavaScript Reality</text>
    <text x="148" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B">Why the Rules of JSX exist: Every tag compiles to a JavaScript function returning an object</text>
  </g>

  <!-- Center Transpiler Lens Divider -->
  <line x1="392" y1="62" x2="392" y2="512" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Transpiler Lens Pill Badges -->
  <g transform="translate(392, 170)" filter="url(#shadow-pill)">
    <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#0F172A" />
    <text x="0" y="4.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">SWC / Babel ➔</text>
  </g>

  <g transform="translate(392, 320)" filter="url(#shadow-pill)">
    <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#0E7490" />
    <text x="0" y="4.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">TRANSPILE ➔</text>
  </g>

  <g transform="translate(392, 450)" filter="url(#shadow-pill)">
    <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#0F172A" />
    <text x="0" y="4.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">PROPS OBJ ➔</text>
  </g>

  <!-- ==================== SECTION 1: THE SINGLE ROOT RULE ==================== -->

  <!-- Top Column Headers -->
  <text x="24" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#475569">AUTHORING SURFACE: WHAT YOU WRITE (JSX)</text>
  <text x="408" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0E7490">RUNTIME REALITY: WHAT JAVASCRIPT EXECUTES</text>

  <!-- 1A: Left Card (Adjacent Roots Anti-Pattern) -->
  <g transform="translate(24, 68)" filter="url(#shadow-card)">
    <rect width="352" height="152" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
    <!-- Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 344 0 Q 352 0 352 8 L 352 26 L 0 26 Z" fill="#FFF5F5" stroke="#DC2626" stroke-width="1.5" />
    <text x="12" y="17.5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#DC2626">TRAP: ADJACENT SIBLINGS (TWO ROOTS)</text>

    <!-- Code Display -->
    <text x="12" y="45" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#0F172A">return (</text>
    
    <!-- Code Highlight Container Row 1 -->
    <g transform="translate(10, 52)">
      <rect width="332" height="22" rx="4" fill="#FEF9C3" stroke="#FDE047" stroke-width="1" />
      <text x="8" y="15.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#DC2626">  &lt;h3 className="title"&gt;Offshore Wind&lt;/h3&gt;</text>
    </g>

    <!-- Code Highlight Container Row 2 -->
    <g transform="translate(10, 76)">
      <rect width="332" height="22" rx="4" fill="#FEF9C3" stroke="#FDE047" stroke-width="1" />
      <text x="8" y="15.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#DC2626">  &lt;p className="desc"&gt;Clean power.&lt;/p&gt;</text>
    </g>

    <text x="12" y="112" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#0F172A">);</text>

    <!-- Crash Banner -->
    <rect x="10" y="120" width="332" height="24" rx="4" fill="#FEE2E2" />
    <text x="18" y="136" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#991B1B">❌ FATAL: Adjacent JSX elements must be wrapped in an enclosing tag</text>
  </g>

  <!-- 1A: Right Card (Compiled JS SyntaxError X-Ray) -->
  <g transform="translate(408, 68)" filter="url(#shadow-card)">
    <rect width="368" height="152" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
    <!-- Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 360 0 Q 368 0 368 8 L 368 26 L 0 26 Z" fill="#FFF5F5" stroke="#DC2626" stroke-width="1.5" />
    <text x="12" y="17.5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#DC2626">X-RAY: WHY IT CRASHES (INVALID JAVASCRIPT)</text>

    <!-- Code Display -->
    <text x="12" y="45" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#64748B">// A JS function cannot return two expressions:</text>
    <text x="12" y="63" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0F172A">return (</text>
    <text x="24" y="80" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#DC2626">  _jsx('h3', { children: 'Offshore Wind' })</text>
    <text x="24" y="97" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#DC2626">  _jsx('p',  { children: 'Clean power.' })</text>
    <text x="12" y="114" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0F172A">);</text>

    <!-- SyntaxError Explanation -->
    <rect x="10" y="120" width="348" height="24" rx="4" fill="#FEE2E2" />
    <text x="18" y="136" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" fill="#991B1B">SyntaxError: Unexpected token. Cannot return multiple values without container.</text>
  </g>

  <!-- 1B: Left Card (Fragment Solution) -->
  <g transform="translate(24, 230)" filter="url(#shadow-card)">
    <rect width="352" height="156" rx="8" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5" />
    <!-- Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 344 0 Q 352 0 352 8 L 352 26 L 0 26 Z" fill="#F0FDFA" stroke="#0E7490" stroke-width="1.5" />
    <text x="12" y="17.5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0E7490">SOLUTION: WRAP IN REACT FRAGMENT (&lt;&gt;...&lt;/&gt;)</text>

    <!-- Code Display -->
    <text x="12" y="45" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#0F172A">return (</text>
    
    <!-- Code Highlight Container for Fragment Open -->
    <g transform="translate(10, 50)">
      <rect width="332" height="20" rx="3" fill="#FEF9C3" stroke="#FDE047" stroke-width="1" />
      <text x="8" y="14.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" font-weight="800" fill="#0E7490">  &lt;&gt;</text>
    </g>

    <text x="24" y="85" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#0F172A">    &lt;h3 className="title"&gt;Offshore Wind&lt;/h3&gt;</text>
    <text x="24" y="103" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#0F172A">    &lt;p className="desc"&gt;Clean power.&lt;/p&gt;</text>

    <!-- Code Highlight Container for Fragment Close -->
    <g transform="translate(10, 110)">
      <rect width="332" height="20" rx="3" fill="#FEF9C3" stroke="#FDE047" stroke-width="1" />
      <text x="8" y="14.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" font-weight="800" fill="#0E7490">  &lt;/&gt;</text>
    </g>

    <text x="12" y="145" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#0F172A">);</text>
  </g>

  <!-- 1B: Right Card (Compiled JS Fragment X-Ray) -->
  <g transform="translate(408, 230)" filter="url(#shadow-card)">
    <rect width="368" height="156" rx="8" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5" />
    <!-- Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 360 0 Q 368 0 368 8 L 368 26 L 0 26 Z" fill="#F0FDFA" stroke="#0E7490" stroke-width="1.5" />
    <text x="12" y="17.5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0E7490">X-RAY: SINGLE OBJECT RETURN (VALID JAVASCRIPT)</text>

    <!-- Code Display -->
    <text x="12" y="45" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#64748B">// Compiles to ONE function call returning ONE object:</text>
    <text x="12" y="63" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0F172A">return _jsx(Fragment, {</text>
    <text x="24" y="80" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0E7490">  children: [</text>
    <text x="36" y="97" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#334155">    _jsx('h3', { className: 'title', ... }),</text>
    <text x="36" y="114" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#334155">    _jsx('p',  { className: 'desc', ... })</text>
    <text x="24" y="131" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0E7490">  ]</text>
    <text x="12" y="148" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0F172A">});</text>
  </g>

  <!-- ==================== SECTION 2: ATTRIBUTE CASING RULES ==================== -->

  <!-- Left Card: JSX Attributes -->
  <g transform="translate(24, 396)" filter="url(#shadow-card)">
    <rect width="352" height="116" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 344 0 Q 352 0 352 8 L 352 24 L 0 24 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="16.5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#475569">RULE 3: camelCase ATTRIBUTES (JSX PROPS)</text>

    <text x="14" y="44" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#0F172A">&lt;button</text>
    
    <g transform="translate(10, 48)">
      <rect width="332" height="20" rx="3" fill="#FEF9C3" stroke="#FDE047" stroke-width="1" />
      <text x="14" y="14" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0F172A">  <tspan font-weight="800" fill="#0E7490">className</tspan>="btn"  <tspan fill="#64748B">// NOT class (reserved)</tspan></text>
    </g>

    <text x="24" y="82" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0F172A">  <tspan font-weight="700" fill="#0E7490">tabIndex</tspan>={0}     <tspan fill="#64748B">// camelCase DOM property</tspan></text>
    <text x="24" y="98" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0F172A">  <tspan font-weight="700" fill="#059669">aria-label</tspan>="Submit" <tspan fill="#64748B">// Hyphen preserved!</tspan></text>
    <text x="14" y="112" font-family="'SF Mono', Menlo, monospace" font-size="11.5" fill="#0F172A">&gt;</text>
  </g>

  <!-- Right Card: Object Key Reality -->
  <g transform="translate(408, 396)" filter="url(#shadow-card)">
    <rect width="368" height="116" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 360 0 Q 368 0 368 8 L 368 24 L 0 24 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="16.5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#475569">X-RAY: COMPILED JAVASCRIPT OBJECT KEYS</text>

    <text x="12" y="44" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0F172A">_jsx('button', {</text>
    <text x="24" y="62" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0E7490">  className: 'btn',   <tspan fill="#64748B">// Matches DOM property</tspan></text>
    <text x="24" y="78" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0E7490">  tabIndex: 0,        <tspan fill="#64748B">// Valid identifier</tspan></text>
    <text x="24" y="94" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#059669">  'aria-label': 'Submit' <tspan fill="#64748B">// Quoted string key</tspan></text>
    <text x="12" y="110" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#0F172A">});</text>
  </g>

  <!-- ==================== SECTION 3: THREE ARCHITECTURAL TAKEAWAYS ==================== -->
  
  <!-- Card 1: Build-Time Transpilation -->
  <g transform="translate(24, 524)" filter="url(#shadow-card)">
    <rect width="240" height="186" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 232 0 Q 240 0 240 8 L 240 28 L 0 28 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0F172A">1. BUILD-TIME AST COMPILATION</text>
    
    <text x="12" y="48" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0E7490">JSX IS NOT HTML:</text>
    <text x="12" y="63" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Browsers never parse JSX syntax directly.</text>
    <text x="12" y="76" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Babel, SWC, or esbuild compile it first.</text>

    <text x="12" y="98" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0E7490">ZERO RUNTIME PARSING:</text>
    <text x="12" y="113" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Unlike template strings, JSX turns into</text>
    <text x="12" y="126" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">direct JavaScript function invocations.</text>

    <text x="12" y="148" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#059669">FAST DESCRIPTORS:</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Produces plain in-memory VDOM objects.</text>
  </g>

  <!-- Card 2: Why Fragments Matter -->
  <g transform="translate(280, 524)" filter="url(#shadow-card)">
    <rect width="240" height="186" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 232 0 Q 240 0 240 8 L 240 28 L 0 28 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0F172A">2. THE FRAGMENT ADVANTAGE</text>
    
    <text x="12" y="48" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0E7490">PREVENTS DIV SOUP:</text>
    <text x="12" y="63" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Avoids wrapping components in useless</text>
    <text x="12" y="76" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">nested &lt;div&gt; tags that clutter the DOM.</text>

    <text x="12" y="98" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0E7490">PRESERVES CSS LAYOUTS:</text>
    <text x="12" y="113" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Wrapper divs break CSS Flexbox &amp; Grid</text>
    <text x="12" y="126" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">direct parent-child styling relationships.</text>

    <text x="12" y="148" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#059669">SEMANTIC HTML:</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">Allows returning sibling &lt;td&gt; or &lt;li&gt; cleanly.</text>
  </g>

  <!-- Card 3: Keyword Collisions -->
  <g transform="translate(536, 524)" filter="url(#shadow-card)">
    <rect width="240" height="186" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 232 0 Q 240 0 240 8 L 240 28 L 0 28 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0F172A">3. KEYWORD COLLISIONS</text>
    
    <text x="12" y="48" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#DC2626">RESERVED WORDS:</text>
    <text x="12" y="63" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">`class` and `for` are reserved in JS.</text>
    <text x="12" y="76" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">JSX uses `className` and `htmlFor`.</text>

    <text x="12" y="98" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0E7490">HYPHENATED OPERATORS:</text>
    <text x="12" y="113" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">`stroke-width` would parse as subtraction.</text>
    <text x="12" y="126" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">JSX enforces camelCase `strokeWidth`.</text>

    <text x="12" y="148" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#059669">ARIA &amp; DATA EXCEPTION:</text>
    <text x="12" y="163" font-family="system-ui, sans-serif" font-size="9.5" fill="#334155">`aria-*` and `data-*` stay hyphenated.</text>
  </g>
</svg>
