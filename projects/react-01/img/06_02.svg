<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768">
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="shadow-error" x="-4%" y="-8%" width="108%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#DC2626" flood-opacity="0.18" />
    </filter>
    <filter id="shadow-ui" x="-4%" y="-8%" width="108%" height="124%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>

    <!-- Arrowheads -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0E7490" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect width="1376" height="768" fill="#FFFFFF" />

  <!-- Center Divider Line -->
  <line x1="690" y1="40" x2="690" y2="728" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- ==================== LEFT MARGIN: TIER LABELS ==================== -->
  <!-- Tier 1 Label -->
  <text x="45" y="145" class="font-sans" font-size="15" font-weight="700" fill="#0F172A">Tier 1 (Top)</text>
  <text x="45" y="165" class="font-sans" font-size="13" font-weight="500" fill="#64748B">Source Data</text>

  <!-- Tier 2 Label -->
  <text x="45" y="325" class="font-sans" font-size="15" font-weight="700" fill="#0F172A">Tier 2 (Middle)</text>
  <text x="45" y="345" class="font-sans" font-size="13" font-weight="500" fill="#64748B">Consumer JSX</text>

  <!-- Tier 3 Label -->
  <text x="45" y="565" class="font-sans" font-size="15" font-weight="700" fill="#0F172A">Tier 3 (Bottom)</text>
  <text x="45" y="585" class="font-sans" font-size="13" font-weight="500" fill="#64748B">Browser Screen</text>

  <!-- ==================== COLUMN 1 (LEFT): WRONG ==================== -->
  <!-- Header -->
  <text x="440" y="65" text-anchor="middle" class="font-mono" font-size="22" font-weight="800" fill="#DC2626">WRONG: { reporter }</text>

  <!-- Tier 1 Card: ArticleHeader.jsx -->
  <g transform="translate(210, 105)" filter="url(#shadow-card)">
    <rect width="460" height="82" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 452 0 Q 460 0 460 8 L 460 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="14" y="19" class="font-sans" font-size="12.5" font-weight="700" fill="#0F172A">ArticleHeader.jsx</text>
    <text x="16" y="58" class="font-mono" font-size="14" fill="#0F172A">const reporter = { name: "Elena", role: "Science" };</text>
  </g>

  <!-- Connector 1 -> 2 (Red Dashed) -->
  <path d="M 440 187 L 440 288" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)" fill="none" />
  
  <!-- Connector Label Pill (Left) -->
  <g transform="translate(440, 238)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="1" />
    <text x="-82" y="5" class="font-mono" font-size="12" font-weight="600" fill="#DC2626">reporter = </text>
    <rect x="-6" y="-9" width="48" height="18" rx="3" fill="#FDE047" opacity="0.95" />
    <text x="-2" y="5" class="font-mono" font-size="12" font-weight="800" fill="#0F172A">Object</text>
    <text x="46" y="5" class="font-sans" font-size="10.5" font-weight="700" fill="#DC2626">⚠️</text>
  </g>

  <!-- Tier 2 Card: AuthorProfile.jsx -->
  <g transform="translate(210, 290)" filter="url(#shadow-card)">
    <rect width="460" height="82" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 452 0 Q 460 0 460 8 L 460 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="14" y="19" class="font-sans" font-size="12.5" font-weight="700" fill="#0F172A">AuthorProfile.jsx</text>
    
    <!-- Code Line with Yellow Highlighter -->
    <text x="16" y="58" class="font-mono" font-size="15" fill="#0F172A">
      return &lt;h4&gt;<tspan font-weight="700">{reporter}</tspan>&lt;/h4&gt;;
    </text>
    <!-- Yellow Marker behind {reporter} -->
    <rect x="126" y="41" width="94" height="24" rx="4" fill="#FDE047" opacity="0.85" style="mix-blend-mode: multiply;" />
  </g>

  <!-- Connector 2 -> 3 (Red Dashed) -->
  <path d="M 440 372 L 440 468" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)" fill="none" />

  <!-- Tier 3: Browser Window (Crash) -->
  <g transform="translate(210, 470)" filter="url(#shadow-card)">
    <!-- Browser Frame -->
    <rect width="460" height="235" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
    <!-- Browser Chrome -->
    <path d="M 0 8 Q 0 0 8 0 L 452 0 Q 460 0 460 8 L 460 30 L 0 30 Z" fill="#FFF5F5" stroke="#DC2626" stroke-width="1.5" />
    <circle cx="16" cy="15" r="4.5" fill="#EF4444" />
    <circle cx="30" cy="15" r="4.5" fill="#F59E0B" />
    <circle cx="44" cy="15" r="4.5" fill="#10B981" />
    <rect x="70" y="7" width="220" height="16" rx="4" fill="#FFFFFF" stroke="#FECACA" stroke-width="1" />
    <text x="80" y="19" class="font-mono" font-size="10" fill="#991B1B">localhost:3000/article</text>

    <!-- Red Error Box (Pristine - Zero Yellow Highlighter) -->
    <g transform="translate(24, 52)" filter="url(#shadow-error)">
      <rect width="412" height="145" rx="8" fill="#DC2626" />
      
      <!-- Error Icon & Title -->
      <g transform="translate(18, 22)">
        <circle cx="10" cy="10" r="10" fill="#FFFFFF" />
        <text x="10" y="15" text-anchor="middle" class="font-sans" font-size="14" font-weight="900" fill="#DC2626">✕</text>
        <text x="30" y="15" class="font-sans" font-size="13.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.01em">Uncaught Error: Objects are not valid as a React child</text>
      </g>

      <!-- Details in Terminal Card inside -->
      <g transform="translate(18, 52)">
        <rect width="376" height="74" rx="5" fill="#991B1B" />
        <text x="12" y="24" class="font-mono" font-size="11.5" fill="#FEE2E2">(found: object with keys {name, role})</text>
        <text x="12" y="44" class="font-sans" font-size="11.5" fill="#FECACA">If you meant to render a collection of children,</text>
        <text x="12" y="60" class="font-sans" font-size="11.5" fill="#FECACA">use an array instead.</text>
      </g>
    </g>
  </g>

  <!-- ==================== COLUMN 2 (RIGHT): CORRECT ==================== -->
  <!-- Header -->
  <text x="940" y="65" text-anchor="middle" class="font-mono" font-size="22" font-weight="800" fill="#0E7490">CORRECT: { reporter.name }</text>

  <!-- Tier 1 Card: ArticleHeader.jsx -->
  <g transform="translate(710, 105)" filter="url(#shadow-card)">
    <rect width="460" height="82" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 452 0 Q 460 0 460 8 L 460 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="14" y="19" class="font-sans" font-size="12.5" font-weight="700" fill="#0F172A">ArticleHeader.jsx</text>
    <text x="16" y="58" class="font-mono" font-size="14" fill="#0F172A">const reporter = { name: "Elena", role: "Science" };</text>
  </g>

  <!-- Connector 1 -> 2 (Teal Solid) -->
  <path d="M 940 187 L 940 288" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-teal)" fill="none" />

  <!-- Connector Label Pill (Right) -->
  <g transform="translate(940, 238)">
    <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#FFFFFF" stroke="#0E7490" stroke-width="1" />
    <text x="-92" y="5" class="font-mono" font-size="12" font-weight="600" fill="#0E7490">reporter.name = </text>
    <rect x="22" y="-9" width="48" height="18" rx="3" fill="#FDE047" opacity="0.95" />
    <text x="26" y="5" class="font-mono" font-size="12" font-weight="800" fill="#0F172A">String</text>
    <text x="74" y="5" class="font-sans" font-size="10.5" font-weight="700" fill="#0E7490">✓</text>
  </g>

  <!-- Tier 2 Card: AuthorProfile.jsx -->
  <g transform="translate(710, 290)" filter="url(#shadow-card)">
    <rect width="460" height="82" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <path d="M 0 8 Q 0 0 8 0 L 452 0 Q 460 0 460 8 L 460 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="14" y="19" class="font-sans" font-size="12.5" font-weight="700" fill="#0F172A">AuthorProfile.jsx</text>
    
    <!-- Code Line with Yellow Highlighter -->
    <text x="16" y="58" class="font-mono" font-size="15" fill="#0F172A">
      return &lt;h4&gt;<tspan font-weight="700">{reporter.name}</tspan>&lt;/h4&gt;;
    </text>
    <!-- Yellow Marker behind {reporter.name} -->
    <rect x="126" y="41" width="138" height="24" rx="4" fill="#FDE047" opacity="0.85" style="mix-blend-mode: multiply;" />
  </g>

  <!-- Connector 2 -> 3 (Teal Solid) -->
  <path d="M 940 372 L 940 468" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-teal)" fill="none" />

  <!-- Tier 3: Browser Window (Live UI) -->
  <g transform="translate(710, 470)" filter="url(#shadow-card)">
    <!-- Browser Frame -->
    <rect width="460" height="235" rx="8" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5" />
    <!-- Browser Chrome -->
    <path d="M 0 8 Q 0 0 8 0 L 452 0 Q 460 0 460 8 L 460 30 L 0 30 Z" fill="#F0FDFA" stroke="#0E7490" stroke-width="1.5" />
    <circle cx="16" cy="15" r="4.5" fill="#EF4444" />
    <circle cx="30" cy="15" r="4.5" fill="#F59E0B" />
    <circle cx="44" cy="15" r="4.5" fill="#10B981" />
    <rect x="70" y="7" width="220" height="16" rx="4" fill="#FFFFFF" stroke="#CCFBF1" stroke-width="1" />
    <text x="80" y="19" class="font-mono" font-size="10" fill="#0E7490">localhost:3000/article</text>

    <!-- Rendered Author Profile UI Card (Pristine - Zero Yellow Highlighter) -->
    <g transform="translate(24, 52)" filter="url(#shadow-ui)">
      <rect width="412" height="145" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <path d="M 0 8 Q 0 0 8 0 L 6 0 L 6 145 L 0 145 Z" fill="#0E7490" />
      
      <!-- Article Header Bar -->
      <text x="24" y="28" class="font-sans" font-size="11" font-weight="700" fill="#0E7490" letter-spacing="0.05em">THE NATIONAL TIMES • SCIENCE &amp; CLIMATE</text>
      <line x1="24" y1="36" x2="388" y2="36" stroke="#F1F5F9" stroke-width="1" />

      <!-- Avatar Circle -->
      <g transform="translate(24, 52)">
        <circle cx="28" cy="28" r="28" fill="#0E7490" />
        <text x="28" y="35" text-anchor="middle" class="font-sans" font-size="17" font-weight="800" fill="#FFFFFF">ER</text>
      </g>

      <!-- Author Details -->
      <g transform="translate(94, 58)">
        <text x="0" y="18" class="font-sans" font-size="19" font-weight="800" fill="#0F172A">Elena Rostova</text>
        <text x="0" y="38" class="font-sans" font-size="13" font-weight="500" fill="#64748B">Senior Science Correspondent</text>
        
        <!-- Live Tag Badge -->
        <g transform="translate(0, 48)">
          <rect width="135" height="20" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
          <circle cx="8" cy="10" r="3.5" fill="#10B981" />
          <text x="17" y="14" class="font-sans" font-size="10.5" font-weight="700" fill="#065F46">VERIFIED BYLINE</text>
        </g>
      </g>
    </g>
  </g>

</svg>
