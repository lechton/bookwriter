<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 730" width="800" height="730">
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="shadow-error" x="-4%" y="-8%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#DC2626" flood-opacity="0.16" />
    </filter>
    <filter id="shadow-ui" x="-4%" y="-8%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>

    <!-- Arrowheads -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0E7490" />
    </marker>
  </defs>

  <style>
    text { text-rendering: geometricPrecision; }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="730" fill="#FFFFFF" />

  <!-- Center Divider Line -->
  <line x1="400" y1="20" x2="400" y2="710" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5" />

  <!-- ==================== COLUMN 1 (LEFT): WRONG ==================== -->
  <!-- Top Title Area -->
  <g transform="translate(24, 20)">
    <rect width="70" height="24" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" />
    <text x="35" y="16.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#DC2626">WRONG</text>
    <text x="82" y="18.5" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="16.5" font-weight="800" fill="#DC2626">createRoot(document.body)</text>
  </g>

  <!-- Tier 1: Source Document Card (index.html) -->
  <g transform="translate(24, 58)" filter="url(#shadow-card)">
    <rect width="364" height="116" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Top-left Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">HOST DOCUMENT: index.html</text>
    <!-- Code Content (Clean Source - Zero Highlighter) -->
    <text x="14" y="50" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">&lt;body&gt;</text>
    <text x="14" y="70" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">  &lt;div id="root"&gt;&lt;/div&gt;</text>
    <text x="14" y="90" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">  &lt;script type="module" src="/src/main.jsx"&gt;&lt;/script&gt;</text>
    <text x="14" y="108" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">&lt;/body&gt;</text>
  </g>

  <!-- Connector Tier 1 -> Tier 2 (Red Dashed) -->
  <path d="M 206 174 L 206 242" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)" fill="none" />
  
  <!-- Connector Pill Tag (Left) -->
  <g transform="translate(206, 208)">
    <rect x="-105" y="-13" width="210" height="26" rx="13" fill="#FEF9C3" stroke="#DC2626" stroke-width="1.2" />
    <text x="-92" y="4.5" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#DC2626">Target ➔</text>
    <text x="-32" y="4.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" font-weight="800" fill="#991B1B">document.body</text>
    <g transform="translate(84, 0)">
      <circle cx="0" cy="0" r="6.5" fill="#DC2626" />
      <text x="0" y="3.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="900" fill="#FFFFFF">!</text>
    </g>
  </g>

  <!-- Tier 2: Consumer Entry File Card (src/main.jsx) -->
  <g transform="translate(24, 244)" filter="url(#shadow-card)">
    <rect width="364" height="130" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Top-left Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">ENTRY BRIDGE: src/main.jsx</text>
    
    <!-- Code Content -->
    <text x="14" y="48" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#64748B">import { createRoot } from 'react-dom/client';</text>
    <text x="14" y="66" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#64748B">import App from './App.jsx';</text>
    
    <!-- Yellow Background Code Line Row (Zero side borders) -->
    <g transform="translate(10, 74)">
      <rect width="344" height="24" rx="4" fill="#FEF9C3" stroke="#FDE047" stroke-width="1" />
      <text x="10" y="16.5" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="12" fill="#0F172A">const root = createRoot(<tspan font-weight="800" fill="#DC2626">document.body</tspan>);</text>
    </g>
    
    <text x="14" y="118" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="12" fill="#0F172A">root.render(&lt;App /&gt;);</text>
  </g>

  <!-- Connector Tier 2 -> Tier 3 (Red Dashed) -->
  <path d="M 206 374 L 206 424" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)" fill="none" />

  <!-- Tier 3: Browser Screen (Reconciliation Collision Crash) -->
  <g transform="translate(24, 426)" filter="url(#shadow-card)">
    <!-- Browser Frame -->
    <rect width="364" height="280" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
    <!-- Top Chrome Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#FFF5F5" stroke="#DC2626" stroke-width="1.5" />
    <circle cx="16" cy="14" r="4" fill="#EF4444" />
    <circle cx="28" cy="14" r="4" fill="#F59E0B" />
    <circle cx="40" cy="14" r="4" fill="#10B981" />
    <text x="56" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#991B1B">BROWSER DOM (COLLISION CRASH)</text>

    <!-- Red Error Box (Pristine - Zero Yellow Marker) -->
    <g transform="translate(16, 42)" filter="url(#shadow-error)">
      <rect width="332" height="126" rx="8" fill="#DC2626" />
      <g transform="translate(14, 16)">
        <circle cx="8" cy="8" r="8" fill="#FFFFFF" />
        <text x="8" y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#DC2626">✕</text>
        <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">NotFoundError: Failed to execute</text>
      </g>
      <text x="14" y="54" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#FEE2E2">'removeChild' on 'Node'</text>
      <text x="14" y="72" font-family="system-ui, sans-serif" font-size="10.5" fill="#FFFFFF">The node to be removed is not a child of this node.</text>
      <rect x="14" y="84" width="304" height="28" rx="4" fill="#991B1B" />
      <text x="22" y="102" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FECACA">DOM desynced: extension injected tag into body</text>
    </g>

    <!-- Inspection Diagnostic Panel -->
    <g transform="translate(16, 180)">
      <rect width="332" height="86" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#475569">WHY ATTACHING TO BODY FAILS:</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B">• Initial mount wipes browser extensions &amp; analytics.</text>
      <text x="12" y="54" font-family="system-ui, sans-serif" font-size="9.5" fill="#64748B">• External scripts append tags directly into &lt;body&gt;.</text>
      <text x="12" y="70" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#DC2626">• React reconciliation tree desyncs and throws fatal error.</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2 (RIGHT): CORRECT ==================== -->
  <!-- Top Title Area -->
  <g transform="translate(424, 20)">
    <rect width="78" height="24" rx="4" fill="#E0F2FE" stroke="#0E7490" stroke-width="1" />
    <text x="463" y="16.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#0E7490">CORRECT</text>
    <text x="510" y="18.5" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="16.5" font-weight="800" fill="#0E7490">createRoot(domNode)</text>
  </g>

  <!-- Tier 1: Source Document Card (index.html) -->
  <g transform="translate(424, 58)" filter="url(#shadow-card)">
    <rect width="364" height="116" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Top-left Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">HOST DOCUMENT: index.html</text>
    <!-- Code Content (Clean Source - Zero Highlighter) -->
    <text x="14" y="50" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">&lt;body&gt;</text>
    <text x="14" y="70" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">  &lt;div id="root"&gt;&lt;/div&gt;</text>
    <text x="14" y="90" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">  &lt;script type="module" src="/src/main.jsx"&gt;&lt;/script&gt;</text>
    <text x="14" y="108" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">&lt;/body&gt;</text>
  </g>

  <!-- Connector Tier 1 -> Tier 2 (Teal Solid) -->
  <path d="M 606 174 L 606 242" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-teal)" fill="none" />
  
  <!-- Connector Pill Tag (Right) -->
  <g transform="translate(606, 208)">
    <rect x="-105" y="-13" width="210" height="26" rx="13" fill="#FEF9C3" stroke="#0E7490" stroke-width="1.2" />
    <text x="-92" y="4.5" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0E7490">Target ➔</text>
    <text x="-32" y="4.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" font-weight="800" fill="#0E7490">&lt;div id="root"&gt;</text>
    <g transform="translate(84, 0)">
      <circle cx="0" cy="0" r="6.5" fill="#0E7490" />
      <text x="0" y="3.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900" fill="#FFFFFF">✓</text>
    </g>
  </g>

  <!-- Tier 2: Consumer Entry File Card (src/main.jsx) -->
  <g transform="translate(424, 244)" filter="url(#shadow-card)">
    <rect width="364" height="130" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Top-left Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">ENTRY BRIDGE: src/main.jsx</text>
    
    <!-- Code Content -->
    <text x="14" y="46" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#64748B">import { createRoot } from 'react-dom/client';</text>
    <text x="14" y="62" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#64748B">import App from './App.jsx';</text>
    
    <!-- Yellow Background Code Line Row (Zero side borders) -->
    <g transform="translate(10, 68)">
      <rect width="344" height="24" rx="4" fill="#FEF9C3" stroke="#FDE047" stroke-width="1" />
      <text x="10" y="16.5" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#0F172A">const domNode = document.getElementById('<tspan font-weight="800" fill="#0E7490">root</tspan>');</text>
    </g>
    
    <text x="14" y="108" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#0F172A">const root = createRoot(<tspan font-weight="800" fill="#0E7490">domNode</tspan>);</text>
    <text x="14" y="124" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#0F172A">root.render(&lt;App /&gt;);</text>
  </g>

  <!-- Connector Tier 2 -> Tier 3 (Teal Solid) -->
  <path d="M 606 374 L 606 424" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-teal)" fill="none" />

  <!-- Tier 3: Browser Screen (Isolated Sandbox Success) -->
  <g transform="translate(424, 426)" filter="url(#shadow-card)">
    <!-- Browser Frame -->
    <rect width="364" height="280" rx="8" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5" />
    <!-- Top Chrome Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F0FDFA" stroke="#0E7490" stroke-width="1.5" />
    <circle cx="16" cy="14" r="4" fill="#EF4444" />
    <circle cx="28" cy="14" r="4" fill="#F59E0B" />
    <circle cx="40" cy="14" r="4" fill="#10B981" />
    <text x="56" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0E7490">BROWSER OUTPUT (ISOLATED SANDBOX)</text>

    <!-- Rendered UI Container -->
    <g transform="translate(16, 42)" filter="url(#shadow-ui)">
      <!-- Surrounding Host Header -->
      <rect width="332" height="28" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="12" y="18" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#475569">The National Times (Host CMS Header Untouched)</text>

      <!-- Mounted React Widget Container (<div id="root">) -->
      <g transform="translate(0, 36)">
        <rect width="332" height="98" rx="6" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5" />
        <rect x="10" y="10" width="76" height="16" rx="3" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8" />
        <text x="15" y="22" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#DC2626">BREAKING NEWS</text>
        <text x="94" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#0F172A">Storm Warning</text>
        <text x="10" y="44" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">Coastal districts under high wind alert</text>
        
        <line x1="10" y1="56" x2="322" y2="56" stroke="#E2E8F0" stroke-width="1" />
        <text x="10" y="74" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#0F172A">Affected districts: 3</text>
        <text x="10" y="88" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#059669">● Response status: Active</text>
        <text x="210" y="82" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="700" fill="#0E7490">&lt;div id="root"&gt;</text>
      </g>
    </g>

    <!-- Inspection Diagnostic Panel -->
    <g transform="translate(16, 186)">
      <rect width="332" height="80" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1" />
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#065F46">THE SANDBOX ADVANTAGE:</text>
      <text x="12" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#047857">• React exclusively controls nodes inside &lt;div id="root"&gt;.</text>
      <text x="12" y="54" font-family="system-ui, sans-serif" font-size="9.5" fill="#047857">• Host CMS, analytics, and browser extensions are safe.</text>
      <text x="12" y="70" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#059669">• Call root.unmount() anytime to clean up without leaks.</text>
    </g>
  </g>
</svg>
