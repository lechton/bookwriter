<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 730" width="800" height="730">
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="shadow-error" x="-4%" y="-8%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#DC2626" flood-opacity="0.16" />
    </filter>
    <filter id="shadow-ui" x="-4%" y="-8%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>

    <!-- Arrowheads -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0E7490" />
    </marker>
  </defs>

  <style>
    text { text-rendering: geometricPrecision; }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="730" fill="#FFFFFF" />

  <!-- Center Divider Line -->
  <line x1="400" y1="20" x2="400" y2="710" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5" />

  <!-- ==================== COLUMN 1 (LEFT): WRONG ==================== -->
  <!-- Top Title Area -->
  <g transform="translate(24, 20)">
    <rect width="70" height="24" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" />
    <text x="35" y="16.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#DC2626">WRONG</text>
    <text x="82" y="18.5" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="800" fill="#DC2626">Adjacent Roots</text>
  </g>

  <!-- Tier 1: Prototype HTML Card (story-summary.html) -->
  <g transform="translate(24, 60)" filter="url(#shadow-card)">
    <rect width="364" height="108" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Top-left Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">HTML PROTOTYPE: story-summary.html</text>
    <!-- Code Content (Zero Highlighter) -->
    <text x="14" y="50" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="12" fill="#64748B">&lt;!-- Sibling tags: valid in HTML --&gt;</text>
    <text x="14" y="72" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">&lt;h3 class="story-title"&gt;...&lt;/h3&gt;</text>
    <text x="14" y="94" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">&lt;p class="story-snippet"&gt;...&lt;/p&gt;</text>
  </g>

  <!-- Connector Tier 1 -> Tier 2 (Red Dashed) -->
  <path d="M 206 168 L 206 236" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)" fill="none" />
  
  <!-- Connector Pill Tag (Left) -->
  <g transform="translate(206, 203)">
    <rect x="-105" y="-13" width="210" height="26" rx="13" fill="#FFFFFF" stroke="#DC2626" stroke-width="1" />
    <text x="-96" y="4.5" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#DC2626">Return = </text>
    <!-- Precise Yellow Marker bounding Adjacent Roots -->
    <rect x="-37" y="-9" width="88" height="18" rx="3" fill="#FDE047" opacity="0.95" />
    <text x="-34" y="4.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" font-weight="800" fill="#0F172A">Adjacent Roots</text>
    <g transform="translate(82, 0)">
      <circle cx="0" cy="0" r="6.5" fill="#DC2626" />
      <text x="0" y="3.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="900" fill="#FFFFFF">!</text>
    </g>
  </g>

  <!-- Tier 2: Component Return Card (StorySummary.jsx) -->
  <g transform="translate(24, 238)" filter="url(#shadow-card)">
    <rect width="364" height="148" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Top-left Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">COMPONENT JSX: StorySummary.jsx</text>
    
    <!-- Code Content with Yellow Highlighter -->
    <text x="14" y="48" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">return (</text>
    <text x="32" y="74" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">&lt;h3 className="story-title"&gt;...&lt;/h3&gt;</text>
    <!-- Yellow Marker precisely bounding adjacent unparented root element -->
    <rect x="28" y="88" width="225" height="19" rx="3" fill="#FDE047" opacity="0.9" />
    <text x="32" y="102" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="800" fill="#0F172A">&lt;p className="story-snippet"&gt;...&lt;/p&gt;</text>
    <text x="14" y="130" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">);</text>
  </g>

  <!-- Connector Tier 2 -> Tier 3 (Red Dashed) -->
  <path d="M 206 386 L 206 432" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)" fill="none" />

  <!-- Tier 3: Browser Screen (Crash State) -->
  <g transform="translate(24, 434)" filter="url(#shadow-card)">
    <!-- Browser Frame -->
    <rect width="364" height="280" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
    <!-- Top Chrome Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#FFF5F5" stroke="#DC2626" stroke-width="1.5" />
    <circle cx="16" cy="14" r="4" fill="#EF4444" />
    <circle cx="28" cy="14" r="4" fill="#F59E0B" />
    <circle cx="40" cy="14" r="4" fill="#10B981" />
    <text x="56" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#991B1B">BROWSER OUTPUT (BUILD CRASH)</text>

    <!-- Red Error Box (Pristine - Zero Yellow Marker) -->
    <g transform="translate(16, 44)" filter="url(#shadow-error)">
      <rect width="332" height="216" rx="8" fill="#DC2626" />
      
      <!-- Error Title -->
      <circle cx="24" cy="24" r="9" fill="#FFFFFF" />
      <text x="24" y="28.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#DC2626">✕</text>
      <text x="40" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF">SyntaxError: Adjacent elements</text>
      <text x="40" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#FEE2E2">Must be wrapped in an enclosing tag</text>

      <!-- Error Code Box -->
      <g transform="translate(14, 52)">
        <rect width="304" height="146" rx="5" fill="#991B1B" />
        <text x="12" y="22" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#FEF08A">Adjacent JSX elements must be</text>
        <text x="12" y="38" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#FEF08A">wrapped in an enclosing tag.</text>
        <text x="12" y="54" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#FEE2E2">Did you want a JSX fragment &lt;&gt;...&lt;/&gt;?</text>
        <line x1="12" y1="64" x2="292" y2="64" stroke="#B91C1C" stroke-width="1" />
        <text x="12" y="82" font-family="'SF Mono', Menlo, monospace" font-size="10.5" fill="#FECACA">  7 | return (</text>
        <text x="12" y="98" font-family="'SF Mono', Menlo, monospace" font-size="10.5" fill="#FECACA">&gt; 8 |   &lt;h3 className="story-title"&gt;...&lt;/h3&gt;</text>
        <text x="12" y="116" font-family="'SF Mono', Menlo, monospace" font-size="10.5" fill="#FEF08A">&gt; 9 |   &lt;p className="story-snippet"&gt;...&lt;/p&gt;</text>
        <text x="12" y="134" font-family="'SF Mono', Menlo, monospace" font-size="10.5" fill="#F87171">at StorySummary (StorySummary.jsx:8:5)</text>
      </g>
    </g>
  </g>

  <!-- ==================== COLUMN 2 (RIGHT): CORRECT ==================== -->
  <!-- Top Title Area -->
  <g transform="translate(412, 20)">
    <rect width="82" height="24" rx="4" fill="#CCFBF1" stroke="#0E7490" stroke-width="1" />
    <text x="41" y="16.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#0E7490">CORRECT</text>
    <text x="94" y="18.5" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="800" fill="#0E7490">&lt;&gt; Fragment &lt;/&gt;</text>
  </g>

  <!-- Tier 1: Prototype HTML Card (story-summary.html) -->
  <g transform="translate(412, 60)" filter="url(#shadow-card)">
    <rect width="364" height="108" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Top-left Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">HTML PROTOTYPE: story-summary.html</text>
    <!-- Code Content (Zero Highlighter) -->
    <text x="14" y="50" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="12" fill="#64748B">&lt;!-- Sibling tags: valid in HTML --&gt;</text>
    <text x="14" y="72" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">&lt;h3 class="story-title"&gt;...&lt;/h3&gt;</text>
    <text x="14" y="94" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">&lt;p class="story-snippet"&gt;...&lt;/p&gt;</text>
  </g>

  <!-- Connector Tier 1 -> Tier 2 (Teal Solid) -->
  <path d="M 594 168 L 594 236" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-teal)" fill="none" />

  <!-- Connector Pill Tag (Right) -->
  <g transform="translate(594, 203)">
    <rect x="-105" y="-13" width="210" height="26" rx="13" fill="#FFFFFF" stroke="#0E7490" stroke-width="1" />
    <text x="-96" y="4.5" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#0E7490">Return = </text>
    <!-- Precise Yellow Marker bounding Single Root <> -->
    <rect x="-37" y="-9" width="88" height="18" rx="3" fill="#FDE047" opacity="0.95" />
    <text x="-34" y="4.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" font-weight="800" fill="#0F172A">Single Root &lt;&gt;</text>
    <g transform="translate(82, 0)">
      <circle cx="0" cy="0" r="6.5" fill="#0E7490" />
      <path d="M -3 0.2 L -0.8 2.5 L 3.5 -2.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- Tier 2: Component Return Card (StorySummary.jsx) -->
  <g transform="translate(412, 238)" filter="url(#shadow-card)">
    <rect width="364" height="148" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Top-left Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">COMPONENT JSX: StorySummary.jsx</text>
    
    <!-- Code Content with Yellow Highlighter -->
    <text x="14" y="48" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">return (</text>
    <!-- Yellow Marker precisely bounding opening fragment tag <> -->
    <rect x="28" y="53" width="24" height="19" rx="3" fill="#FDE047" opacity="0.9" />
    <text x="32" y="67" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="800" fill="#0F172A">&lt;&gt;</text>
    <text x="50" y="86" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">&lt;h3 className="story-title"&gt;...&lt;/h3&gt;</text>
    <text x="50" y="105" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">&lt;p className="story-snippet"&gt;...&lt;/p&gt;</text>
    <!-- Yellow Marker precisely bounding closing fragment tag </> -->
    <rect x="28" y="110" width="26" height="19" rx="3" fill="#FDE047" opacity="0.9" />
    <text x="32" y="124" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="800" fill="#0F172A">&lt;/&gt;</text>
    <text x="14" y="142" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0F172A">);</text>
  </g>

  <!-- Connector Tier 2 -> Tier 3 (Teal Solid) -->
  <path d="M 594 386 L 594 432" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-teal)" fill="none" />

  <!-- Tier 3: Browser Screen (Rendered UI) -->
  <g transform="translate(412, 434)" filter="url(#shadow-card)">
    <!-- Browser Frame -->
    <rect width="364" height="280" rx="8" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5" />
    <!-- Top Chrome Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F0FDFA" stroke="#0E7490" stroke-width="1.5" />
    <circle cx="16" cy="14" r="4" fill="#EF4444" />
    <circle cx="28" cy="14" r="4" fill="#F59E0B" />
    <circle cx="40" cy="14" r="4" fill="#10B981" />
    <text x="56" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0E7490">BROWSER OUTPUT (RENDERED UI)</text>

    <!-- Rendered Story Card (Pristine - Zero Yellow Marker) -->
    <g transform="translate(16, 44)" filter="url(#shadow-ui)">
      <rect width="332" height="216" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <path d="M 0 8 Q 0 0 8 0 L 5 0 L 5 216 L 0 216 Z" fill="#0E7490" />
      
      <!-- Eyebrow Bar -->
      <text x="18" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#0E7490" letter-spacing="0.05em">THE NATIONAL TIMES • INVESTIGATION</text>
      <line x1="18" y1="34" x2="314" y2="34" stroke="#F1F5F9" stroke-width="1" />

      <!-- Story Headline -->
      <g transform="translate(18, 52)">
        <text x="0" y="18" font-family="Georgia, serif" font-size="16.5" font-weight="900" fill="#0F172A">Offshore Wind Project</text>
        <text x="0" y="38" font-family="Georgia, serif" font-size="16.5" font-weight="900" fill="#0F172A">Approved for South Coast</text>
      </g>

      <!-- Snippet -->
      <text x="18" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">Clean renewable power will supply 50,000</text>
      <text x="18" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">regional homes starting next spring.</text>

      <!-- DOM Architecture Badge (Direct children, zero wrapper div) -->
      <g transform="translate(18, 152)">
        <rect width="296" height="48" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="12" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#475569">DOM TREE INSPECTION (ZERO DIV SOUP):</text>
        <text x="12" y="34" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="700" fill="#0E7490">&lt;article&gt; ➔ &lt;h3&gt; + &lt;p&gt; (Clean Siblings)</text>
      </g>
    </g>
  </g>

</svg>
