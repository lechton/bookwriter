
<!DOCTYPE html>
<html>
<head>
<style>
.box {
  width: 250px;
  border: 1px solid red;
  margin: 10px;
  font-family: monospace;
  font-size: 14px;
}
.test1 { word-break: break-word; }
.test2 { word-break: break-all; }
.test3 { overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="box test1">1. break-word: document.getElementById('counter').innerText = ++count;</div>
<div class="box test2">2. break-all: document.getElementById('counter').innerText = ++count;</div>
<div class="box test3">3. anywhere: document.getElementById('counter').innerText = ++count;</div>
</body>
</html>
