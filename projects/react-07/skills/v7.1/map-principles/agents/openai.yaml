interface:
  display_name: "Map Principles"
  short_description: "Discover, route, and select lesson principles"
  default_prompt: "Use $map-principles to build or audit the principle map for lesson {nn}. First confirm that bank row {nn} in questions/questions.md and card 01-01-map/{nn}.md carry the same tag and question. Run Discovery over the card, the react.dev pages for its topic, and senior engineering knowledge, without opening any principle map. Run Selection: route ownership through every card, apply the importance and atomicity tests, fill the ledger and the Terms table, verify behaviors in React 19, and number the principles last. Then run the Archive Check against the older maps of the same tag, and finish with node src/diagnose-map.mjs {nn}."
