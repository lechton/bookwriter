<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Template 08: Navigation Header</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f8fafc;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .component-explorer {
    width: 100%;
    max-width: 640px;
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.04);
  }
  .explorer-bar {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    background: linear-gradient(to bottom, #ffffff, #f1f5f9);
    border-bottom: 1.5px solid #cbd5e1;
  }
  .explorer-dots { display: flex; gap: 6px; }
  .explorer-dots i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .explorer-dots i:nth-child(1) { background: #ef4444; }
  .explorer-dots i:nth-child(2) { background: #f59e0b; }
  .explorer-dots i:nth-child(3) { background: #10b981; }
  .explorer-title {
    flex: 1;
    text-align: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    font-weight: 700;
    color: #475569;
    padding-right: 36px;
  }
  .explorer-stage {
    padding: 24px;
    background: #f8fafc;
  }

  /* Component Node Container */
  .component-node {
    position: relative;
    padding: 28px 18px 18px;
    border: 2px dashed #7c3aed;
    border-radius: 9px;
    background: #ffffff;
    box-shadow: 0 4px 10px rgba(15, 23, 42, 0.05);
  }
  .component-label {
    position: absolute;
    top: -2px;
    left: -2px;
    display: flex;
    align-items: baseline;
    padding: 4px 10px;
    background: #7c3aed;
    color: #ffffff;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.76rem;
    font-weight: 700;
    border-top-left-radius: 7px;
    border-bottom-right-radius: 7px;
    line-height: 1;
  }
  .component-props {
    margin-left: 6px;
    font-weight: 400;
    font-style: italic;
    opacity: 0.9;
    font-size: 0.72rem;
  }

  /* Inspector Element Wrappers */
  .ui-elem {
    position: relative;
    margin: 12px 0 6px;
    padding: 10px 12px;
    background: #ffffff;
    border: 1.5px solid #cbd5e1;
    border-radius: 7px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
  }
  .ui-elem:first-child { margin-top: 4px; }
  .ui-elem::before {
    content: attr(data-elem);
    position: absolute;
    top: -10px;
    right: 12px;
    display: inline-flex;
    align-items: center;
    padding: 1px 7px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.65rem;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: 0.02em;
    color: #ffffff;
    background: #5b21b6;
    border: 1px solid #4c1d95;
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    z-index: 2;
  }

  /* Masthead Elements */
  .masthead-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .masthead-date {
    font-size: 0.72rem;
    font-weight: 600;
    color: #64748b;
  }
  .masthead-logo {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    color: #0f172a;
    text-align: center;
    text-transform: uppercase;
  }
  .masthead-weather {
    font-size: 0.72rem;
    font-weight: 600;
    color: #64748b;
  }

  /* Nav Links */
  .nav-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .nav-links {
    display: flex;
    gap: 12px;
    list-style: none;
  }
  .nav-link {
    font-size: 0.78rem;
    font-weight: 600;
    color: #475569;
    text-decoration: none;
    padding: 2px 0;
  }
  .nav-link.active {
    color: #7c3aed;
    border-bottom: 2px solid #7c3aed;
  }
  .btn-subscribe {
    padding: 4px 10px;
    background: #7c3aed;
    color: #ffffff;
    font-size: 0.74rem;
    font-weight: 700;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="component-explorer">
  <div class="explorer-bar">
    <div class="explorer-dots"><i></i><i></i><i></i></div>
    <div class="explorer-title">SiteHeader.jsx — Component Explorer</div>
  </div>
  <div class="explorer-stage">
    <div class="component-node">
      <div class="component-label">
        &lt;SiteHeader&gt;
        <span class="component-props">currentDesk="investigative"</span>
      </div>

      <!-- 1. Masthead Brand Bar -->
      <div class="ui-elem" data-elem="[header.masthead]">
        <div class="masthead-bar">
          <span class="masthead-date">Tuesday, Sep 22, 2026</span>
          <h1 class="masthead-logo">The National Times</h1>
          <span class="masthead-weather">68°F • Clear</span>
        </div>
      </div>

      <!-- 2. Navigation Bar with Links & Action -->
      <div class="ui-elem" data-elem="[nav.navbar]">
        <div class="nav-strip">
          <ul class="nav-links">
            <li><a class="nav-link" href="#">Home</a></li>
            <li><a class="nav-link active" href="#">Investigative</a></li>
            <li><a class="nav-link" href="#">Politics</a></li>
            <li><a class="nav-link" href="#">Opinion</a></li>
            <li><a class="nav-link" href="#">Tech</a></li>
          </ul>
          <button class="btn-subscribe" type="button">Subscribe $1/mo</button>
        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
