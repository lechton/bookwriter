<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Front Cover — Web Accessibility &amp; Web Performance</title>
  <style>
    @page {
      size: letter;
      margin: 0;
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 0;
      width: 8.5in;
      height: 11in;
      background: #0f172a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      position: relative;
      overflow: hidden;
      -webkit-print-color-adjust: exact;
    }
    
    /* Radial gradient backgrounds */
    .cover-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(circle at top right, rgba(14, 116, 144, 0.35), transparent 50%),
        radial-gradient(circle at bottom left, rgba(14, 116, 144, 0.25), transparent 50%),
        #0f172a;
      z-index: 1;
    }
    
    /* Architectural DOM grid overlay */
    .cover-grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      z-index: 2;
    }
    
    /* Spine highlight on the left edge */
    .book-spine {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 12px;
      background: linear-gradient(to right, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.0) 100%);
      border-right: 1px solid rgba(255,255,255,0.08);
      z-index: 20;
    }
    
    /* Layout Container */
    .cover-content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 70px 65px 65px 75px;
    }
    
    /* Top Section: Kicker */
    .kicker {
      font-size: 11pt;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #06b6d4;
      margin: 0 0 14px 0;
    }
    
    .kicker-bar {
      width: 55px;
      height: 4px;
      background: #06b6d4;
      border-radius: 99px;
    }
    
    /* Title area: robust standard text glyphs that survive PDF editing/resaving */
    .title-area {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-top: -20px;
    }
    
    .main-title {
      font-size: 58pt;
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin: 0;
    }
    
    .main-title .white {
      color: #ffffff;
    }
    
    .main-title .slate {
      color: #cbd5e1;
    }
    
    .main-title .cyan {
      color: #06b6d4;
    }
    
    /* Bottom Section */
    .bottom-section {
      background: linear-gradient(to top, rgba(2, 6, 23, 0.85), transparent);
      padding-top: 25px;
    }
    
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      row-gap: 22px;
      column-gap: 30px;
      border-top: 1px solid rgba(148, 163, 184, 0.25);
      padding-top: 24px;
      margin-bottom: 28px;
    }
    
    .metric-label {
      font-size: 8pt;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #94a3b8;
      margin: 0 0 4px 0;
    }
    
    .metric-value {
      font-size: 24pt;
      font-weight: 900;
      color: #ffffff;
      margin: 0;
      line-height: 1;
    }
    
    .metric-value.accent {
      color: #06b6d4;
    }
    
    .metric-value.tiers {
      font-size: 14pt;
      font-weight: 800;
      color: #e2e8f0;
      letter-spacing: 0.05em;
      padding-top: 4px;
    }
    
    /* Branding */
    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      padding-top: 20px;
    }
    
    .brand-kicker {
      font-size: 8pt;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #64748b;
    }
    
    .brand-name {
      font-size: 11pt;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    
    /* Corner watermark geometry */
    .watermark {
      position: absolute;
      right: -50px;
      bottom: -50px;
      width: 320px;
      height: 320px;
      opacity: 0.04;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div class="cover-bg"></div>
  <div class="cover-grid"></div>
  <div class="book-spine"></div>

  <svg class="watermark" viewBox="0 0 100 100" fill="currentColor" style="color: #ffffff;">
    <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="4" fill="none" />
    <circle cx="50" cy="50" r="25" stroke="currentColor" stroke-width="2" fill="none" />
    <path d="M 50 10 L 50 90 M 10 50 L 90 50" stroke="currentColor" stroke-width="1" />
  </svg>

  <div class="cover-content">
    
    <div>
      <p class="kicker">Official Syllabus &amp; Course Architecture</p>
      <div class="kicker-bar"></div>
    </div>

    <div class="title-area">
      <h1 class="main-title">
        <span class="white">Web</span><br>
        <span class="slate">Accessibility</span><br>
        <span class="white">&amp; Web</span><br>
        <span class="cyan">Performance</span>
      </h1>
    </div>

    <div class="bottom-section">
      <div class="metrics-grid">
        <div>
          <p class="metric-label">Lectures</p>
          <p class="metric-value">54</p>
        </div>
        <div>
          <p class="metric-label">Core Tracks</p>
          <p class="metric-value">02</p>
        </div>
        <div>
          <p class="metric-label">Depth Tiers</p>
          <p class="metric-value tiers">CORE / MORE / ADV</p>
        </div>
        <div>
          <p class="metric-label">Visual Canvases</p>
          <p class="metric-value accent">108</p>
        </div>
      </div>

      <div class="brand-row">
        <span class="brand-kicker">Curriculum by</span>
        <span class="brand-name">JobScanner</span>
      </div>
    </div>

  </div>

</body>
</html>
