<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <title>plain-newsletter</title>
  </head>
  <body>
<form id="signup">
  <h2>Join our newsletter</h2>
  <input id="email" />
  <button>Join</button>
</form>
<p id="error" style="display: none; color: red">Please enter a full email address.</p>
<p id="welcome" style="display: none">Welcome to the list!</p>

<script>
  const form = document.getElementById('signup');
  const email = document.getElementById('email');
  const error = document.getElementById('error');
  const welcome = document.getElementById('welcome');

  form.addEventListener('submit', e => {
    e.preventDefault();
    if (email.value.includes('@')) {
      form.style.display = 'none';
      welcome.style.display = '';
    } else {
      error.style.display = '';
    }
  });
</script>
  </body>
</html>
