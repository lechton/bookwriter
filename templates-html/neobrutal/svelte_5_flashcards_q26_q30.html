<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svelte Flashcards (Q26-Q30)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f0f0f0;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .brutal-shadow {
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
            transition: all 0.2s ease-in-out;
        }

        .torn-paper {
            position: relative;
            background-color: white;
            border: 4px solid #000;
            border-bottom: none;
            margin-bottom: 24px;
        }

        .torn-paper::before {
            content: "";
            position: absolute;
            display: block;
            bottom: -16px;
            left: -4px;
            right: -4px;
            height: 16px;
            background: 
                linear-gradient(-45deg, transparent 11px, #000 0), 
                linear-gradient(45deg, transparent 11px, #000 0);
            background-size: 22px 16px;
            background-repeat: repeat-x;
            z-index: 1;
        }

        .torn-paper::after {
            content: "";
            position: absolute;
            display: block;
            bottom: -12px;
            left: 0px;
            right: 0px;
            height: 16px;
            background: 
                linear-gradient(-45deg, transparent 11px, #fff 0), 
                linear-gradient(45deg, transparent 11px, #fff 0);
            background-size: 22px 16px;
            background-repeat: repeat-x;
            z-index: 2;
        }

        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }

        .slide {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        .slide.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media print {
            body { background: white; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            .brutal-shadow { box-shadow: none !important; }
            .slide {
                display: block !important;
                opacity: 1 !important;
                transform: none !important;
                page-break-inside: avoid;
                break-inside: avoid;
                margin-bottom: 40px !important;
            }
            #deck-container { margin-top: 2cm; }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-3xl mb-8 no-print flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-3xl font-bold tracking-tight">The Ultimate Svelte Deck</h1>
            <p class="text-gray-600 font-semibold mt-1">Questions 26 - 30 (Design Only)</p>
        </div>
        
        <div class="flex items-center gap-4 bg-white border-4 border-black brutal-shadow px-4 py-2">
            <button id="btn-prev" class="font-bold text-xl hover:-translate-y-1 hover:text-blue-600 transition-transform disabled:opacity-30 disabled:hover:translate-y-0 cursor-pointer disabled:cursor-not-allowed">&larr;</button>
            <span id="counter" class="font-bold text-xl code-font w-20 text-center">1 / 5</span>
            <button id="btn-next" class="font-bold text-xl hover:-translate-y-1 hover:text-blue-600 transition-transform disabled:opacity-30 disabled:hover:translate-y-0 cursor-pointer disabled:cursor-not-allowed">&rarr;</button>
        </div>
    </div>

    <main id="deck-container" class="w-full max-w-3xl pb-16">
        <!-- Cards injected via JS -->
    </main>

    <script>
        const deck = [
            {
                id: 26,
                topic: "Reactivity",
                title: "The Loop Danger",
                question: "How does reactivity work traditionally, and what is the danger when an effect modifies a state it depends on?",
                diagram: `
                    <div class="mt-8 border-8 border-black p-6 md:p-12 flex flex-col items-center gap-6 relative bg-[radial-gradient(#d1d1d1_2px,transparent_2px)] [background-size:20px_20px]">
                        <span class="absolute -top-4 left-4 bg-black text-white px-3 py-1 text-[10px] font-bold uppercase tracking-widest border-2 border-white shadow-[2px_2px_0_0_#000]">Legacy Mechanism (Svelte 3/4)</span>
                        
                        <div class="w-full md:w-2/3 border-4 border-black bg-white p-6 text-center shadow-[6px_6px_0_0_#000] z-10 hover:-translate-y-1 transition-transform cursor-crosshair">
                            <div class="font-mono font-black text-3xl text-red-600">count = 1</div>
                            <div class="text-[10px] font-bold text-gray-500 uppercase mt-2">Explicit Assignment</div>
                        </div>

                        <div class="text-5xl font-black text-black z-0 -my-2">↓</div>

                        <div class="w-full md:w-2/3 border-4 border-black bg-yellow-300 p-6 text-center shadow-[6px_6px_0_0_#000] z-10 hover:-translate-y-1 transition-transform cursor-crosshair">
                            <div class="font-black text-2xl uppercase tracking-[0.2em]">Compiler</div>
                            <div class="text-[10px] font-bold text-black uppercase mt-1">Build-time Static Analysis</div>
                        </div>

                        <div class="text-5xl font-black text-black z-0 -my-2">↓</div>

                        <div class="w-full md:w-2/3 border-4 border-black bg-green-100 p-6 text-center brutal-shadow z-10 hover:-translate-y-1 transition-transform cursor-crosshair">
                            <div class="font-mono font-bold text-lg text-green-800">$$invalidate('count', ...)</div>
                            <div class="inline-block mt-3 bg-green-700 text-white font-black text-sm uppercase px-4 py-2 border-2 border-black">
                                DOM Updates Directly
                            </div>
                        </div>
                    </div>
                `
            },
            {
                id: 27,
                topic: "State (Legacy)",
                title: "The Assignment Operator",
                question: "What is the operational significance of the assignment operator (=) in Svelte 3/4 reactivity?",
                diagram: `
                    <div class="mt-8 border-4 border-black p-8 md:p-12 relative bg-white flex flex-col gap-12 md:gap-16">
                        
                        <!-- Top Red Block -->
                        <div class="w-full border-4 border-red-500 bg-red-50 p-6 relative flex flex-col items-center text-center group">
                            <span class="absolute -top-4 bg-red-500 text-white font-black text-[10px] px-3 py-1 uppercase tracking-[0.1em] border-2 border-black">Mutation Only</span>
                            <div class="font-mono font-black text-2xl md:text-3xl text-red-700 mb-4 bg-white border-2 border-red-200 px-4 py-2">items.push(4)</div>
                            <div class="text-6xl font-black text-red-500 leading-none group-hover:scale-110 transition-transform duration-300">X</div>
                            <div class="text-xs font-black text-red-700 uppercase mt-4 tracking-widest bg-red-100 px-2 py-1">Bypasses Compiler</div>
                        </div>
                        
                        <!-- Center Floating Equal Sign -->
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 md:w-20 md:h-20 bg-white border-4 border-black rounded-full flex items-center justify-center z-20 shadow-[0_0_0_8px_#fff]">
                            <span class="font-black text-4xl md:text-5xl -mt-1">=</span>
                        </div>

                        <!-- Bottom Green Block -->
                        <div class="w-full border-4 border-green-500 bg-green-50 p-6 relative flex flex-col items-center text-center brutal-shadow group">
                            <span class="absolute -top-4 bg-green-500 text-white font-black text-[10px] px-3 py-1 uppercase tracking-[0.1em] border-2 border-black">Explicit Assignment</span>
                            <div class="font-mono font-black text-2xl md:text-3xl text-green-800 mb-4 bg-white border-2 border-green-200 px-4 py-2">items = items</div>
                            <div class="text-6xl font-black text-green-500 leading-none group-hover:scale-110 transition-transform duration-300">✓</div>
                            <div class="text-xs font-black text-green-800 uppercase mt-4 tracking-widest bg-green-200 px-2 py-1 border border-green-400">Triggers $$invalidate</div>
                        </div>

                    </div>
                `
            },
            {
                id: 28,
                topic: "State (Legacy)",
                title: "Array Mutations",
                question: "Why does mutating an array using methods like `.push()` fail to trigger a reactive update by default in legacy Svelte?",
                diagram: `
                    <div class="mt-8 border-4 border-black bg-blue-50 p-8 flex flex-col items-center relative">
                        <div class="flex flex-col md:flex-row w-full justify-between items-center gap-10 md:gap-4 relative z-10">
                            
                            <!-- Variable Pointer -->
                            <div class="w-full md:w-1/3 flex flex-col items-center relative">
                                <span class="bg-black text-white px-2 py-1 text-[10px] font-bold uppercase absolute -top-3">Variable Reference</span>
                                <div class="border-4 border-black bg-white p-6 font-mono font-bold text-2xl shadow-[4px_4px_0_0_#000] w-full text-center">
                                    items
                                </div>
                            </div>

                            <!-- Arrows Area -->
                            <div class="flex flex-col gap-6 w-full md:w-1/3 items-center relative">
                                <!-- Push Method Bypass -->
                                <div class="relative w-full flex flex-col items-center group">
                                    <div class="absolute -top-8 bg-red-100 border-2 border-red-500 px-2 py-1 text-xs font-bold text-red-700 font-mono z-10 group-hover:-translate-y-1 transition-transform">.push('Cherry')</div>
                                    <svg class="w-full h-8 text-red-500" preserveAspectRatio="none" viewBox="0 0 100 20">
                                        <path d="M 0,10 Q 50,0 100,10" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4,4" />
                                        <polygon points="95,5 100,10 95,15" fill="currentColor" />
                                    </svg>
                                    <div class="text-[8px] font-black uppercase text-red-600 tracking-widest bg-white px-1 absolute -bottom-3">Bypasses reference check</div>
                                </div>

                                <!-- Assignment Trigger -->
                                <div class="relative w-full flex flex-col items-center mt-4 group">
                                    <div class="absolute -top-8 bg-green-100 border-2 border-green-600 px-2 py-1 text-xs font-bold text-green-800 font-mono z-10 shadow-[2px_2px_0_0_#000] group-hover:-translate-y-1 transition-transform">= items</div>
                                    <svg class="w-full h-8 text-green-600" preserveAspectRatio="none" viewBox="0 0 100 20">
                                        <path d="M 0,10 L 100,10" fill="none" stroke="currentColor" stroke-width="3" />
                                        <polygon points="95,5 100,10 95,15" fill="currentColor" />
                                    </svg>
                                    <div class="text-[8px] font-black uppercase text-green-700 tracking-widest bg-white px-1 absolute -bottom-3 border-x border-green-600">Triggers compiler update</div>
                                </div>
                            </div>

                            <!-- Memory Block -->
                            <div class="w-full md:w-1/3 flex flex-col items-center relative">
                                <span class="bg-gray-600 text-white px-2 py-1 text-[10px] font-bold uppercase absolute -top-3 border-2 border-black z-20">Memory</span>
                                <div class="border-4 border-black bg-yellow-100 p-4 brutal-shadow w-full">
                                    <div class="flex flex-col gap-2 font-mono text-sm font-bold bg-white border-2 border-black p-2">
                                        <div class="border-b border-gray-300 pb-1">0: 'Apple'</div>
                                        <div class="border-b border-gray-300 pb-1">1: 'Banana'</div>
                                        <div class="text-red-600 bg-red-50 p-1">+ 2: 'Cherry'</div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                `
            },
            {
                id: 29,
                topic: "State (Legacy)",
                title: "Object Property Mutations",
                question: "How do you force a reactive update after modifying an object property in Svelte 3/4?",
                diagram: `
                    <div class="mt-8 border-4 border-black bg-white p-8 relative flex flex-col md:flex-row items-center gap-12">
                        
                        <!-- Compiler Eye Component -->
                        <div class="w-full md:w-1/3 flex flex-col items-center">
                            <div class="relative flex items-center justify-center w-24 h-24 bg-yellow-300 border-4 border-black rounded-full shadow-[6px_6px_0_0_#000] mb-4 overflow-hidden">
                                <div class="w-12 h-12 bg-white rounded-full border-4 border-black flex items-center justify-center">
                                    <div class="w-4 h-4 bg-black rounded-full animate-ping"></div>
                                </div>
                            </div>
                            <span class="font-black uppercase tracking-widest text-sm border-b-4 border-black pb-1">Compiler Vision</span>
                            <span class="text-xs text-gray-500 font-bold mt-2 text-center">Only watches the outer boundary layer.</span>
                        </div>

                        <!-- Object Data Structure -->
                        <div class="w-full md:w-2/3 border-8 border-black bg-[#f0fdf4] relative p-6 brutal-shadow group">
                            
                            <!-- The Boundary -->
                            <div class="absolute -top-5 left-1/2 -translate-x-1/2 bg-black text-white px-4 py-2 font-mono font-bold text-lg border-2 border-white shadow-[0_0_0_2px_#000]">
                                let user
                            </div>

                            <div class="absolute top-2 right-2 flex items-center gap-2">
                                <span class="bg-red-500 w-3 h-3 border-2 border-black rounded-full inline-block group-hover:bg-green-500 transition-colors duration-500"></span>
                            </div>

                            <!-- Internal Properties -->
                            <div class="border-4 border-dashed border-gray-400 bg-white p-6 mt-4 flex flex-col gap-4 relative">
                                <span class="absolute -top-3 left-4 bg-gray-200 text-gray-600 px-2 py-1 text-[10px] font-bold uppercase tracking-widest border border-gray-400">Blind Spot (Nested)</span>
                                
                                <div class="flex justify-between items-center bg-gray-50 border-2 border-black p-3">
                                    <span class="font-mono font-bold">name:</span>
                                    <span class="font-mono text-gray-700 bg-white border border-gray-300 px-2">'Alice'</span>
                                </div>
                                
                                <div class="flex justify-between items-center bg-red-50 border-2 border-red-500 p-3 relative">
                                    <span class="font-mono font-bold text-red-700">age:</span>
                                    <div class="flex items-center gap-2">
                                        <span class="font-mono text-gray-400 line-through text-xs">30</span>
                                        <span class="font-mono text-red-700 font-bold bg-white border-2 border-red-300 px-2 text-lg">31</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Assignment actions -->
                            <div class="mt-6 flex flex-col md:flex-row gap-4">
                                <div class="flex-1 bg-red-100 border-2 border-red-500 p-3 text-center opacity-70">
                                    <span class="block font-mono text-xs font-bold text-red-700 mb-1">user.age = 31</span>
                                    <span class="text-[10px] uppercase font-black">Outer shell ignores</span>
                                </div>
                                <div class="flex-1 bg-green-300 border-2 border-black p-3 text-center shadow-[4px_4px_0_0_#000]">
                                    <span class="block font-mono text-sm font-bold text-black mb-1">user = user</span>
                                    <span class="text-[10px] uppercase font-black text-green-900">Shakes outer shell!</span>
                                </div>
                            </div>
                        </div>

                    </div>
                `
            },
            {
                id: 30,
                topic: "State (Legacy)",
                title: "Reactive Statements",
                question: "What is the purpose and syntactic structure of the `$:` labeled statement in Svelte 3/4?",
                diagram: `
                    <div class="mt-8 border-4 border-black bg-purple-50 p-6 md:p-10 relative flex flex-col items-center">
                        <span class="absolute -top-3 left-4 bg-purple-600 text-white px-2 py-1 text-[10px] font-bold uppercase tracking-widest border-2 border-black shadow-[2px_2px_0_0_#000]">Auto-tracking Mechanism</span>
                        
                        <div class="flex items-center justify-center gap-4 md:gap-8 w-full mt-4">
                            
                            <!-- The Label -->
                            <div class="text-7xl md:text-8xl font-black font-mono text-purple-700 drop-shadow-[4px_4px_0_rgba(0,0,0,1)] hover:scale-110 transition-transform cursor-pointer">
                                $:
                            </div>

                            <!-- The Block / Factory -->
                            <div class="flex-1 border-4 border-black bg-white brutal-shadow p-6 relative">
                                <div class="absolute -left-5 top-1/2 -translate-y-1/2 w-10 h-10 bg-yellow-300 border-4 border-black rounded-full flex items-center justify-center animate-[spin_4s_linear_infinite]">
                                    <div class="w-4 h-4 border-2 border-black bg-white"></div>
                                </div>

                                <span class="font-mono font-bold text-xl md:text-2xl block bg-gray-100 border-2 border-black p-3">
                                    double = <span class="text-blue-600 bg-blue-100 px-1 border border-blue-400 relative inline-block group">count<span class="absolute -top-6 left-1/2 -translate-x-1/2 bg-black text-white text-[10px] font-sans font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Auto-detected Dependency</span></span> * 2;
                                </span>

                                <div class="mt-4 flex items-start gap-3">
                                    <svg class="w-6 h-6 text-purple-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                    <p class="text-xs font-bold text-gray-700 uppercase leading-relaxed tracking-wider">
                                        Compiler scans code following the label, detects <span class="text-blue-600 font-black">count</span>, and re-executes automatically on change.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                `
            }
        ];

        let currentIndex = 0;
        const container = document.getElementById('deck-container');
        const counterText = document.getElementById('counter');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function initDeck() {
            deck.forEach((card, index) => {
                const article = document.createElement('article');
                article.className = `slide torn-paper brutal-shadow ${index === 0 ? 'active' : ''}`;
                article.dataset.index = index;
                
                // Note: Snippets and text explanations have been explicitly removed from rendering
                // per the user's constraints (only title, question, and visual design diagram).

                article.innerHTML = `
                    <div class="relative p-6 sm:p-10 pb-8 z-10 bg-white">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="uppercase tracking-widest text-xs font-bold text-gray-500 mb-1 block">${card.topic}</span>
                                <h2 class="text-3xl sm:text-4xl font-bold border-b-4 border-black pb-2 inline-block">Q${card.id} &mdash; ${card.title}</h2>
                            </div>
                        </div>
                        
                        <div class="mt-6 mb-2 bg-black text-white p-4 sm:p-5 brutal-shadow relative">
                            <span class="absolute -top-3 left-4 bg-yellow-300 text-black px-2 py-1 text-[10px] font-bold uppercase tracking-widest border-2 border-black">Interview Question</span>
                            <p class="text-xl sm:text-2xl font-bold leading-snug"><span class="text-yellow-300 mr-2 text-2xl">Q:</span>${card.question}</p>
                        </div>
                        
                        <!-- Visual Pedagogy Diagram Only -->
                        ${card.diagram ? card.diagram : ''}
                    </div>
                `;
                container.appendChild(article);
            });
            updateControls();
        }

        function updateView() {
            const slides = document.querySelectorAll('.slide');
            slides.forEach((slide, index) => {
                if (index === currentIndex) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });
            updateControls();
            
            document.getElementById('deck-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function updateControls() {
            counterText.textContent = `${currentIndex + 1} / ${deck.length}`;
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === deck.length - 1;
        }

        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) { currentIndex--; updateView(); }
        });

        btnNext.addEventListener('click', () => {
            if (currentIndex < deck.length - 1) { currentIndex++; updateView(); }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentIndex < deck.length - 1) { currentIndex++; updateView(); }
            else if (e.key === 'ArrowLeft' && currentIndex > 0) { currentIndex--; updateView(); }
        });

        window.addEventListener('DOMContentLoaded', initDeck);
    </script>
</body>
</html>
