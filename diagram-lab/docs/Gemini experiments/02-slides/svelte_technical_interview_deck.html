<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svelte Technical Interview Deck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brutal-bg: #e5e7eb;
            --brutal-yellow: #fde047;
            --brutal-cyan: #22d3ee;
            --brutal-pink: #f472b6;
            --brutal-purple: #c084fc;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--brutal-bg);
            /* Geometric grid background typical of neobrutalism */
            background-image: 
                linear-gradient(to right, #9ca3af 1px, transparent 1px),
                linear-gradient(to bottom, #9ca3af 1px, transparent 1px);
            background-size: 40px 40px;
            color: #111827;
        }

        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Neobrutalist UI elements */
        .brutal-border {
            border: 4px solid #000;
        }

        .brutal-shadow {
            box-shadow: 8px 8px 0px 0px #000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .brutal-shadow-sm {
            box-shadow: 4px 4px 0px 0px #000;
        }

        button.brutal-shadow:active {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0px 0px #000;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 8px 8px 0px 0px #000 !important;
        }

        /* Slide Transition Animations */
        .slide-container {
            perspective: 1000px;
        }

        .slide {
            display: none;
            opacity: 0;
            transform: translateY(20px) rotateX(5deg);
        }

        .slide.active {
            display: block;
            animation: snapIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards;
        }

        @keyframes snapIn {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95) rotateX(5deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0deg);
            }
        }

        .counter-intuitive-badge {
            position: absolute;
            top: -12px;
            right: -12px;
            background-color: var(--brutal-yellow);
            padding: 4px 12px;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 3px solid #000;
            box-shadow: 3px 3px 0px 0px #000;
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Header & Navigation -->
    <header class="w-full max-w-5xl flex flex-col md:flex-row justify-between items-center gap-6 mb-8 z-10">
        <div class="bg-white brutal-border brutal-shadow px-6 py-3 bg-cyan-100 transform -rotate-1">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tighter uppercase code-font">
                Svelte<span class="text-pink-500">_</span>Internals
            </h1>
            <p class="text-xs font-bold mt-1 text-gray-700">Interview Module: Q1 - Q3</p>
        </div>

        <nav class="flex items-center gap-4 bg-white brutal-border brutal-shadow p-2">
            <button id="btn-prev" class="brutal-border bg-white hover:bg-gray-200 p-2 font-bold code-font w-12 h-12 flex items-center justify-center transition-colors" aria-label="Previous Slide">
                &larr;
            </button>
            <div id="counter" class="code-font font-bold text-xl px-4 w-24 text-center tracking-widest">
                1/10
            </div>
            <button id="btn-next" class="brutal-border bg-yellow-300 hover:bg-yellow-400 p-2 font-bold code-font w-12 h-12 flex items-center justify-center transition-colors" aria-label="Next Slide">
                &rarr;
            </button>
        </nav>
    </header>

    <!-- Slide Deck Container -->
    <main id="deck" class="w-full max-w-5xl slide-container pb-16 relative">
        <!-- Slides will be injected here by JavaScript -->
    </main>

    <script>
        const slidesData = [
            {
                id: 1,
                topic: "Q1: Architectural Approach",
                title: "Runtime Library vs. Build-Time Compiler",
                content: "Virtual DOM (VDOM) frameworks like React or Vue operate as runtime libraries. They require shipping a framework engine to the browser to parse components, construct an in-memory DOM representation, and calculate updates. Svelte alters this architecture fundamentally by operating entirely during the build step.",
                diagram: `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6 code-font text-sm">
                        <div class="bg-white brutal-border brutal-shadow-sm p-4 flex flex-col">
                            <div class="bg-black text-white px-2 py-1 uppercase tracking-widest w-max mb-4">React / Vue</div>
                            <div class="border-l-4 border-black pl-4 flex-grow space-y-2">
                                <p>1. Download JS Bundle (App + Framework)</p>
                                <p>2. Initialize Framework Engine</p>
                                <p>3. Parse Declarative Components</p>
                                <p class="font-bold text-blue-600">4. Render UI</p>
                            </div>
                        </div>
                        <div class="bg-cyan-50 brutal-border brutal-shadow-sm p-4 flex flex-col relative">
                            <div class="counter-intuitive-badge bg-pink-300">Counter-Intuitive</div>
                            <div class="bg-black text-white px-2 py-1 uppercase tracking-widest w-max mb-4">Svelte</div>
                            <div class="border-l-4 border-black pl-4 flex-grow space-y-2">
                                <p>1. Download JS Bundle (App Only)</p>
                                <p class="line-through text-gray-400">2. Initialize Framework Engine</p>
                                <p class="line-through text-gray-400">3. Parse Declarative Components</p>
                                <p class="font-bold text-blue-600">4. Render UI</p>
                            </div>
                            <div class="mt-4 pt-2 border-t-2 border-black font-sans font-bold text-xs">
                                The declarative paradigm is enforced strictly on the developer's machine, not the client's.
                            </div>
                        </div>
                    </div>
                `
            },
            {
                id: 2,
                topic: "Q1: Architectural Approach",
                title: "Bypassing the Virtual DOM",
                content: "The Virtual DOM is a mitigation technique for making declarative UI performant; it is not an optimization over direct DOM manipulation. By shifting processing to compile-time, Svelte generates code that updates the DOM directly.",
                diagram: `
                    <div class="bg-white brutal-border brutal-shadow p-6 mt-6 relative">
                        <div class="counter-intuitive-badge">Crucial Distinction</div>
                        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                            <div class="w-full md:w-1/3 text-center border-2 border-black bg-gray-100 p-3 font-bold">
                                State Mutation
                            </div>
                            <div class="code-font font-bold text-xl md:rotate-0 rotate-90">&rarr;</div>
                            <div class="w-full md:w-1/3 text-center border-2 border-black bg-yellow-200 p-3 font-bold brutal-shadow-sm">
                                Pre-calculated execution path
                            </div>
                            <div class="code-font font-bold text-xl md:rotate-0 rotate-90">&rarr;</div>
                            <div class="w-full md:w-1/3 text-center border-2 border-black bg-gray-100 p-3 font-bold">
                                Specific DOM Node updated
                            </div>
                        </div>
                        <p class="font-mono text-xs mt-6 text-center text-gray-600 border-t border-black pt-4">
                            No reconciliation loop. No diffing algorithm. Pure imperative assignments triggered by state changes.
                        </p>
                    </div>
                `
            },
            {
                id: 3,
                topic: "Q2: The Compiler",
                title: "Abstract Syntax Tree (AST) Parsing",
                content: "When Svelte is described as a compiler, it refers to its parsing of `.svelte` files into an Abstract Syntax Tree. This allows the compiler to statically analyze dependencies between state variables and HTML template segments.",
                diagram: `
                    <div class="bg-white brutal-border brutal-shadow p-6 mt-6 code-font">
                        <div class="flex flex-col md:flex-row gap-6">
                            <div class="flex-1 border-r-0 md:border-r-4 border-black pr-0 md:pr-4">
                                <div class="bg-black text-white text-xs px-2 py-1 mb-2 inline-block">Input: .svelte</div>
                                <pre class="text-sm border-2 border-gray-300 p-2 bg-gray-50"><span class="text-pink-600">let</span> count = 0;
<span class="text-blue-600">&lt;h1&gt;</span>{count}<span class="text-blue-600">&lt;/h1&gt;</span></pre>
                            </div>
                            <div class="flex-1 relative">
                                <div class="counter-intuitive-badge bg-cyan-300">Static Analysis</div>
                                <div class="bg-black text-white text-xs px-2 py-1 mb-2 inline-block">AST Detection</div>
                                <ul class="text-sm space-y-2 mt-2">
                                    <li class="flex items-center gap-2"><div class="w-2 h-2 bg-black"></div> Identify variable <strong>count</strong></li>
                                    <li class="flex items-center gap-2"><div class="w-2 h-2 bg-black"></div> Map <strong>count</strong> to <strong>H1</strong> text node</li>
                                    <li class="flex items-center gap-2"><div class="w-2 h-2 bg-black"></div> Generate imperative update function</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                `
            },
            {
                id: 4,
                topic: "Q2: The Compiler",
                title: "The Zero-Dependency Output",
                content: "The final output of the Svelte compilation step is highly optimized, standalone JavaScript. The Svelte framework itself is completely stripped from the final bundle.",
                diagram: `
                    <div class="bg-purple-100 brutal-border brutal-shadow p-6 mt-6 relative">
                        <div class="counter-intuitive-badge bg-white text-black">The Disappearing Framework</div>
                        <p class="font-bold text-lg mb-4 font-sans">
                            Svelte is a dependency in your <code class="bg-white border border-black px-1">package.json</code>'s <code class="bg-white border border-black px-1 text-pink-600">devDependencies</code>, not your <code class="bg-white border border-black px-1 text-blue-600">dependencies</code>.
                        </p>
                        <div class="bg-white brutal-border p-4 code-font text-sm flex justify-between items-center">
                            <div>
                                <span class="block font-bold mb-2">Build Output:</span>
                                <span>bundle.js (Vanilla DOM APIs)</span><br>
                                <span>bundle.css (Raw CSS)</span>
                            </div>
                            <div class="text-4xl">📦</div>
                        </div>
                    </div>
                `
            },
            {
                id: 5,
                topic: "Q2: The Compiler",
                title: "Reactivity via Invalidation Functions",
                content: "Instead of observing state at runtime or using getter/setters (in legacy Svelte), the compiler injects specific tracking functions into your code wherever state is mutated.",
                diagram: `
                    <div class="bg-white brutal-border brutal-shadow p-6 mt-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="border-2 border-black p-4">
                                <div class="text-xs uppercase font-bold text-gray-500 mb-2">Developer writes:</div>
                                <code class="code-font font-bold text-lg">count += 1;</code>
                            </div>
                            <div class="border-2 border-black p-4 bg-yellow-50 relative">
                                <div class="counter-intuitive-badge">Code Injection</div>
                                <div class="text-xs uppercase font-bold text-gray-500 mb-2">Compiler outputs:</div>
                                <code class="code-font font-bold text-sm">$$invalidate('count', count += 1);</code>
                            </div>
                        </div>
                        <p class="mt-4 text-sm font-bold bg-black text-white p-2 text-center code-font">
                            The mutation explicitly triggers the DOM update synchronously.
                        </p>
                    </div>
                `
            },
            {
                id: 6,
                topic: "Q2: The Compiler",
                title: "CSS Extraction and Automatic Scoping",
                content: "During the build step, Svelte extracts all `<style>` blocks. It automatically generates unique hashed classes and applies them to both the CSS selectors and the corresponding HTML elements.",
                diagram: `
                    <div class="bg-white brutal-border brutal-shadow p-6 mt-6">
                        <div class="flex flex-col space-y-4">
                            <div class="flex items-center gap-4">
                                <div class="w-1/2 bg-gray-100 p-2 border-2 border-black code-font text-sm">&lt;p&gt;Text&lt;/p&gt;</div>
                                <span class="font-bold">&rarr;</span>
                                <div class="w-1/2 bg-cyan-100 p-2 border-2 border-black code-font text-sm">&lt;p class="svelte-xyz123"&gt;Text&lt;/p&gt;</div>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="w-1/2 bg-gray-100 p-2 border-2 border-black code-font text-sm">p { color: red; }</div>
                                <span class="font-bold">&rarr;</span>
                                <div class="w-1/2 bg-cyan-100 p-2 border-2 border-black code-font text-sm">p.svelte-xyz123 { color: red; }</div>
                            </div>
                        </div>
                        <div class="mt-6 bg-pink-100 border-l-4 border-black p-3 text-sm font-bold relative">
                            <div class="counter-intuitive-badge bg-white">No Shadow DOM</div>
                            Scoping is achieved via string manipulation during compilation, avoiding the performance overhead and styling complications of web component Shadow DOMs.
                        </div>
                    </div>
                `
            },
            {
                id: 7,
                topic: "Q3: Performance Benefits",
                title: "Time To Interactive (TTI)",
                content: "The foremost performance benefit is the reduction of the initial payload. Without a framework runtime to download, parse, and execute, the browser can parse the vanilla JS faster, resulting in a faster Time To Interactive.",
                diagram: `
                    <div class="bg-white brutal-border brutal-shadow p-6 mt-6 code-font">
                        <div class="space-y-4">
                            <div class="relative pt-4">
                                <div class="text-xs mb-1 font-bold">Standard Framework Load Time</div>
                                <div class="flex w-full h-8 border-2 border-black">
                                    <div class="bg-red-400 w-2/5 flex items-center justify-center text-xs font-bold border-r-2 border-black">DL Engine</div>
                                    <div class="bg-yellow-400 w-2/5 flex items-center justify-center text-xs font-bold border-r-2 border-black">Parse Engine</div>
                                    <div class="bg-green-400 w-1/5 flex items-center justify-center text-xs font-bold">Interactive</div>
                                </div>
                            </div>
                            <div class="relative pt-4">
                                <div class="text-xs mb-1 font-bold">Svelte Load Time</div>
                                <div class="flex w-full h-8 border-2 border-black">
                                    <div class="bg-gray-300 w-1/5 flex items-center justify-center text-xs font-bold border-r-2 border-black">DL Vanilla JS</div>
                                    <div class="bg-green-400 w-4/5 flex items-center pl-2 text-xs font-bold">Interactive Much Sooner</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `
            },
            {
                id: 8,
                topic: "Q3: Performance Benefits",
                title: "Shifting the Computational Burden",
                content: "Compile-time architectures intentionally slow down the Continuous Integration (CI) or local build process in exchange for speeding up the client-side execution.",
                diagram: `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                        <div class="bg-gray-800 text-white brutal-border brutal-shadow-sm p-4 relative">
                            <div class="font-bold uppercase border-b border-gray-600 pb-2 mb-2">Build Server (CI/CD)</div>
                            <p class="text-sm">Executes complex AST generation, static analysis, and code generation.</p>
                            <div class="mt-4 text-xs font-mono bg-black p-2 border border-gray-600 text-red-400">
                                CPU Utilization: HIGH
                            </div>
                        </div>
                        <div class="bg-white text-black brutal-border brutal-shadow-sm p-4 relative">
                            <div class="counter-intuitive-badge bg-yellow-300">The Trade-off</div>
                            <div class="font-bold uppercase border-b border-black pb-2 mb-2">Client Device (Mobile)</div>
                            <p class="text-sm">Executes lightweight, hardcoded imperative DOM updates.</p>
                            <div class="mt-4 text-xs font-mono bg-gray-100 p-2 border border-black text-green-600">
                                CPU Utilization: LOW
                            </div>
                        </div>
                    </div>
                `
            },
            {
                id: 9,
                topic: "Q3: Performance Benefits",
                title: "Memory Overhead and Garbage Collection",
                content: "Virtual DOM frameworks allocate memory for object representations of the UI. During complex animations or rapid state changes, this creates immense memory pressure, forcing the browser to pause execution for Garbage Collection (GC).",
                diagram: `
                    <div class="bg-white brutal-border brutal-shadow p-6 mt-6">
                        <div class="flex items-center justify-between border-b-4 border-black pb-4 mb-4">
                            <div class="font-bold text-lg">Memory Pressure</div>
                            <div class="code-font bg-black text-white px-3 py-1">Profile</div>
                        </div>
                        <ul class="space-y-4">
                            <li class="flex items-start gap-4">
                                <div class="bg-red-200 border-2 border-black w-12 h-12 flex-shrink-0 flex items-center justify-center font-bold text-xl">X</div>
                                <div>
                                    <strong class="block">VDOM Frameworks</strong>
                                    <span class="text-sm text-gray-700">Creates large VNode objects. Frequent memory allocations cause GC stutter.</span>
                                </div>
                            </li>
                            <li class="flex items-start gap-4">
                                <div class="bg-green-200 border-2 border-black w-12 h-12 flex-shrink-0 flex items-center justify-center font-bold text-xl">&check;</div>
                                <div>
                                    <strong class="block">Svelte</strong>
                                    <span class="text-sm text-gray-700">Zero structural objects allocated for UI representation. Memory remains flat; GC pauses are minimized.</span>
                                </div>
                            </li>
                        </ul>
                    </div>
                `
            },
            {
                id: 10,
                topic: "Synthesis: The Limitation",
                title: "The Enterprise Scale Intersection",
                content: "While compile-time offers massive baseline benefits, it carries a unique scale limitation. Because Svelte embeds the update logic into every component, a massive enterprise application with thousands of components can eventually exceed the bundle size of a framework with a shared runtime engine.",
                diagram: `
                    <div class="bg-white brutal-border brutal-shadow p-6 mt-6 relative overflow-hidden">
                        <div class="counter-intuitive-badge bg-pink-300">The Scaling Caveat</div>
                        <div class="h-48 w-full border-l-4 border-b-4 border-black relative mt-4">
                            <!-- Graph Labels -->
                            <div class="absolute -bottom-6 left-1/2 transform -translate-x-1/2 text-xs font-bold">Application Size (Components)</div>
                            <div class="absolute -left-10 top-1/2 transform -translate-y-1/2 -rotate-90 text-xs font-bold whitespace-nowrap">JS Bundle Size</div>
                            
                            <!-- React Line (Fixed base cost, slow linear growth) -->
                            <div class="absolute bottom-6 left-0 w-full h-1 bg-blue-500 transform origin-bottom-left -rotate-6"></div>
                            <div class="absolute top-12 right-2 text-blue-500 font-bold text-xs code-font">React (Shared Runtime)</div>

                            <!-- Svelte Line (Zero base cost, faster linear/exponential growth) -->
                            <div class="absolute bottom-0 left-0 w-full h-1 bg-yellow-500 transform origin-bottom-left -rotate-12"></div>
                            <div class="absolute top-4 right-2 text-yellow-600 font-bold text-xs code-font">Svelte (Compiled Code)</div>

                            <!-- Intersection Point -->
                            <div class="absolute top-[4.5rem] right-[30%] w-4 h-4 rounded-full bg-red-500 border-2 border-black animate-pulse"></div>
                            <div class="absolute top-[3rem] right-[25%] text-[10px] font-bold bg-white border border-black px-1">Intersection Point</div>
                        </div>
                    </div>
                `
            }
        ];

        let currentIndex = 0;
        const deckContainer = document.getElementById('deck');
        const counterElement = document.getElementById('counter');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function initializeDeck() {
            slidesData.forEach((data, index) => {
                const slide = document.createElement('article');
                slide.className = `slide bg-white brutal-border brutal-shadow w-full min-h-[400px] p-6 md:p-10 ${index === 0 ? 'active' : ''}`;
                slide.dataset.index = index;

                slide.innerHTML = `
                    <div class="mb-6 border-b-4 border-black pb-4 flex justify-between items-end">
                        <div>
                            <span class="text-xs font-bold bg-black text-white px-2 py-1 uppercase tracking-widest code-font inline-block mb-3">${data.topic}</span>
                            <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-tight">${data.title}</h2>
                        </div>
                    </div>
                    
                    <div class="font-sans text-lg leading-relaxed font-medium text-gray-800">
                        ${data.content}
                    </div>

                    ${data.diagram}
                `;
                
                deckContainer.appendChild(slide);
            });
            updateUI();
        }

        function updateUI() {
            // Update Slides Visibility
            const slides = document.querySelectorAll('.slide');
            slides.forEach((slide, index) => {
                if (index === currentIndex) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });

            // Update Counter
            counterElement.textContent = `${currentIndex + 1}/${slidesData.length}`;

            // Update Buttons
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === slidesData.length - 1;
        }

        // Event Listeners
        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateUI();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentIndex < slidesData.length - 1) {
                currentIndex++;
                updateUI();
            }
        });

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentIndex < slidesData.length - 1) {
                currentIndex++;
                updateUI();
            } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                currentIndex--;
                updateUI();
            }
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initializeDeck);

    </script>
</body>
</html>
