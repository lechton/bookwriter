<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svelte Interview Flashcards - Q26 & Q27</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f0f0f0;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .brutal-shadow {
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
            transition: all 0.2s ease-in-out;
        }

        .torn-paper {
            position: relative;
            background-color: white;
            border: 4px solid #000;
            border-bottom: none;
            margin-bottom: 24px;
        }

        .torn-paper::before {
            content: "";
            position: absolute;
            display: block;
            bottom: -16px;
            left: -4px;
            right: -4px;
            height: 16px;
            background: 
                linear-gradient(-45deg, transparent 11px, #000 0), 
                linear-gradient(45deg, transparent 11px, #000 0);
            background-size: 22px 16px;
            background-repeat: repeat-x;
            z-index: 1;
        }

        .torn-paper::after {
            content: "";
            position: absolute;
            display: block;
            bottom: -12px;
            left: 0px;
            right: 0px;
            height: 16px;
            background: 
                linear-gradient(-45deg, transparent 11px, #fff 0), 
                linear-gradient(45deg, transparent 11px, #fff 0);
            background-size: 22px 16px;
            background-repeat: repeat-x;
            z-index: 2;
        }

        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }

        .slide {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        .slide.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media print {
            body { background: white; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            .brutal-shadow { box-shadow: none !important; }
            .slide {
                display: block !important;
                opacity: 1 !important;
                transform: none !important;
                page-break-inside: avoid;
                break-inside: avoid;
                margin-bottom: 40px !important;
            }
            #deck-container { margin-top: 2cm; }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="w-full max-w-3xl mb-8 no-print flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-3xl font-bold tracking-tight">The Ultimate Svelte Deck</h1>
            <p class="text-gray-600 font-semibold mt-1">Questions 26 & 27</p>
        </div>
        
        <div class="flex items-center gap-4 bg-white border-4 border-black brutal-shadow px-4 py-2">
            <button id="btn-prev" class="font-bold text-xl hover:-translate-y-1 hover:text-blue-600 transition-transform disabled:opacity-30 disabled:hover:translate-y-0 cursor-pointer disabled:cursor-not-allowed">&larr;</button>
            <span id="counter" class="font-bold text-xl code-font w-20 text-center">1 / 2</span>
            <button id="btn-next" class="font-bold text-xl hover:-translate-y-1 hover:text-blue-600 transition-transform disabled:opacity-30 disabled:hover:translate-y-0 cursor-pointer disabled:cursor-not-allowed">&rarr;</button>
        </div>
    </div>

    <main id="deck-container" class="w-full max-w-3xl pb-16">
        <!-- Cards injected via JS -->
    </main>

    <script>
        const deck = [
            {
                id: 26,
                topic: "State (Legacy)",
                title: "Reactivity in Svelte 3 & 4",
                question: "How does reactivity work traditionally in Svelte 3 and 4?",
                snippets: [{
                    name: "App.svelte",
                    code: "<scr" + "ipt>\n  // Svelte 3/4 Reactivity\n  let count = 0;\n\n  function increment() {\n    count += 1; // Assignment triggers UI update\n  }\n<\/script>"
                }],
                note: "Traditionally in Svelte 3 and 4, reactivity is driven by top-level variable declarations using the <code>let</code> keyword. The compiler analyzes assignments to these variables at build time and automatically injects invalidation functions to update the specific DOM nodes tied to them.",
                diagram: `
                    <div class="mt-8 border-4 border-black p-6 bg-[#fffbeb] flex flex-col items-center">
                        <div class="flex items-center gap-4 w-full justify-center flex-wrap">
                            <div class="border-4 border-black bg-white p-3 font-mono text-sm shadow-[4px_4px_0_0_#000]">let count = 0;</div>
                            <div class="font-bold text-2xl">&rarr;</div>
                            <div class="border-4 border-black bg-blue-200 p-3 font-mono text-sm shadow-[4px_4px_0_0_#000]">count += 1;</div>
                        </div>
                        <div class="bg-white border-4 border-black mt-6 p-3 w-full text-center">
                            <span class="text-xs font-bold uppercase tracking-widest text-gray-500 mb-1 inline-block">Compiler Auto-Instrumentation</span><br>
                            <span class="font-mono font-bold text-red-600 text-sm md:text-base">$$invalidate('count', count += 1)</span>
                        </div>
                    </div>
                `
            },
            {
                id: 27,
                topic: "State (Legacy)",
                title: "The Assignment Operator (=)",
                question: "What is the operational significance of the assignment operator (=) in Svelte 3/4 reactivity?",
                snippets: [{
                    name: "App.svelte",
                    code: "<scr" + "ipt>\n  let numbers = [1, 2, 3];\n  \n  function addNumber() {\n    numbers.push(4); // DOES NOT trigger reactivity\n    numbers = numbers; // The assignment (=) triggers it!\n  }\n<\/script>"
                }],
                note: "The assignment operator (<code>=</code>) is fundamentally required because it acts as the explicit trigger for the Svelte compiler to schedule a DOM update. Mutating a reference array or object in place (e.g., using <code>array.push()</code>) will bypass the reactivity engine entirely unless an assignment follows it.",
                diagram: `
                    <div class="mt-8 flex flex-col gap-4">
                        <div class="border-4 border-black p-4 bg-red-50 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div class="font-mono bg-white border-2 border-black p-2 text-sm text-gray-400 w-full sm:w-auto text-center">numbers.push(4)</div>
                            <div class="font-bold text-red-600 uppercase text-xs tracking-widest text-center sm:text-right">Mutates, No Assignment<br>NO UPDATE</div>
                        </div>
                        <div class="border-4 border-black p-4 bg-green-50 flex flex-col sm:flex-row items-center justify-between gap-4 brutal-shadow">
                            <div class="font-mono bg-white border-2 border-black p-2 font-bold shadow-[2px_2px_0_0_#000] text-sm text-black w-full sm:w-auto text-center">numbers = numbers</div>
                            <div class="font-bold text-green-700 uppercase text-xs tracking-widest text-center sm:text-right">Self Assignment<br>TRIGGERS UPDATE</div>
                        </div>
                    </div>
                `
            }
        ];

        let currentIndex = 0;
        const container = document.getElementById('deck-container');
        const counterText = document.getElementById('counter');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function initDeck() {
            deck.forEach((card, index) => {
                const article = document.createElement('article');
                article.className = `slide torn-paper brutal-shadow ${index === 0 ? 'active' : ''}`;
                article.dataset.index = index;
                
                let snippetsHTML = '';
                if (card.snippets.length > 0) {
                    snippetsHTML = `<div class="grid grid-cols-1 ${card.snippets.length > 1 ? 'lg:grid-cols-2' : ''} gap-4 mb-8">`;
                    card.snippets.forEach(snippet => {
                        snippetsHTML += `
                            <div class="bg-[#f8f9fa] border-l-8 border-black p-4 sm:p-6 relative h-full flex flex-col">
                                <span class="absolute top-0 right-0 bg-black text-white text-xs font-bold px-2 py-1 code-font">${snippet.name}</span>
                                <pre class="overflow-x-auto flex-grow pt-2"><code class="code-font text-sm sm:text-base leading-relaxed text-gray-800">${escapeHTML(snippet.code)}</code></pre>
                            </div>
                        `;
                    });
                    snippetsHTML += `</div>`;
                }

                article.innerHTML = `
                    <div class="relative p-6 sm:p-10 pb-8 z-10 bg-white">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="uppercase tracking-widest text-xs font-bold text-gray-500 mb-1 block">${card.topic}</span>
                                <h2 class="text-3xl sm:text-4xl font-bold border-b-4 border-black pb-2 inline-block">${card.title}</h2>
                            </div>
                            <div class="hidden sm:flex h-12 w-12 border-4 border-black rounded-full items-center justify-center font-bold text-xl flex-shrink-0 bg-yellow-300 shadow-[2px_2px_0_0_#000]">
                                ${card.id}
                            </div>
                        </div>
                        
                        <div class="mt-6 mb-10 bg-black text-white p-4 sm:p-5 brutal-shadow relative">
                            <span class="absolute -top-3 left-4 bg-yellow-300 text-black px-2 py-1 text-[10px] font-bold uppercase tracking-widest border-2 border-black">Interview Question</span>
                            <p class="text-xl sm:text-2xl font-bold leading-snug"><span class="text-yellow-300 mr-2 text-2xl">Q:</span>${card.question}</p>
                        </div>
                        
                        ${snippetsHTML}
                        
                        <div class="flex items-start gap-4 bg-yellow-100 p-4 border-2 border-black mt-8 ${card.diagram ? 'mb-8' : ''}">
                            <svg class="w-6 h-6 flex-shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <p class="text-lg font-medium leading-snug">${card.note}</p>
                        </div>

                        ${card.diagram ? card.diagram : ''}
                    </div>
                `;
                container.appendChild(article);
            });
            updateControls();
        }

        function updateView() {
            const slides = document.querySelectorAll('.slide');
            slides.forEach((slide, index) => {
                if (index === currentIndex) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });
            updateControls();
            
            // Scroll back to top of the deck when switching cards on mobile
            document.getElementById('deck-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function updateControls() {
            counterText.textContent = `${currentIndex + 1} / ${deck.length}`;
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === deck.length - 1;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
            );
        }

        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) { currentIndex--; updateView(); }
        });

        btnNext.addEventListener('click', () => {
            if (currentIndex < deck.length - 1) { currentIndex++; updateView(); }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentIndex < deck.length - 1) { currentIndex++; updateView(); }
            else if (e.key === 'ArrowLeft' && currentIndex > 0) { currentIndex--; updateView(); }
        });

        window.addEventListener('DOMContentLoaded', initDeck);
    </script>
</body>
</html>
