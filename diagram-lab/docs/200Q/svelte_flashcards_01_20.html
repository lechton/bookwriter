<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svelte Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f0f0f0;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .brutal-shadow {
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
            transition: all 0.2s ease-in-out;
        }

        .torn-paper {
            position: relative;
            background-color: white;
            border: 4px solid #000;
            border-bottom: none; 
            margin-bottom: 24px;
        }

        .torn-paper::before {
            content: "";
            position: absolute;
            display: block;
            bottom: -16px;
            left: -4px;
            right: -4px;
            height: 16px;
            background: 
                linear-gradient(-45deg, transparent 11px, #000 0), 
                linear-gradient(45deg, transparent 11px, #000 0);
            background-size: 22px 16px;
            background-repeat: repeat-x;
            z-index: 1;
        }

        .torn-paper::after {
            content: "";
            position: absolute;
            display: block;
            bottom: -12px;
            left: 0px;
            right: 0px;
            height: 16px;
            background: 
                linear-gradient(-45deg, transparent 11px, #fff 0), 
                linear-gradient(45deg, transparent 11px, #fff 0);
            background-size: 22px 16px;
            background-repeat: repeat-x;
            z-index: 2;
        }

        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }

        .slide {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        .slide.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media print {
            body {
                background: white;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .brutal-shadow {
                box-shadow: none !important;
            }
            .slide {
                display: block !important;
                opacity: 1 !important;
                transform: none !important;
                page-break-inside: avoid;
                break-inside: avoid;
                margin-bottom: 40px !important;
            }
            #deck-container {
                margin-top: 2cm;
            }
        }
    </style>
</head>

        let currentIndex = 0;
        const container = document.getElementById('deck-container');
        const counterText = document.getElementById('counter');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function initDeck() {
            deck.forEach((card, index) => {
                const article = document.createElement('article');
                article.className = `slide torn-paper brutal-shadow ${index === 0 ? 'active' : ''}`;
                article.dataset.index = index;
                
                let snippetsHTML = "";
                if (card.snippets && card.snippets.length > 0) {
                    snippetsHTML = `<div class="grid grid-cols-1 ${card.snippets.length > 1 ? 'lg:grid-cols-2' : ''} gap-4 my-6">`;
                    card.snippets.forEach(snippet => {
                        snippetsHTML += `
                            <div class="bg-[#f8f9fa] border-l-8 border-black p-4 sm:p-6 relative h-full flex flex-col border-2 border-y-black border-r-black">

                                <pre class="overflow-x-auto flex-grow mt-2"><code class="code-font text-sm sm:text-base leading-relaxed text-gray-800">${escapeHTML(snippet.code)}</code></pre>
                            </div>
                        `;
                    });
                    snippetsHTML += `</div>`;
                }

                article.innerHTML = `
                    <div class="relative p-6 sm:p-10 pb-8 z-10 bg-white">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="uppercase tracking-widest text-xs font-bold text-gray-500 mb-1 block">${card.topic}</span>
                                <h2 class="text-3xl sm:text-4xl font-bold border-b-4 border-black pb-2 inline-block">${card.title}</h2>
                            </div>
                            <div class="hidden sm:flex h-12 w-12 border-4 border-black rounded-full items-center justify-center font-bold text-xl flex-shrink-0 shadow-[4px_4px_0_0_#000]">
                                ${index + 1}
                            </div>
                        </div>
                        
                        ${snippetsHTML}
                        
                        <div class="flex items-start gap-4 bg-yellow-100 p-4 border-2 border-black shadow-[4px_4px_0_0_#000] ${card.diagram ? 'mb-6 mt-6' : 'mt-6'}">
                            <svg class="w-6 h-6 flex-shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <p class="text-lg font-medium leading-snug">${card.note}</p>
                        </div>

                        ${card.diagram ? card.diagram : ''}
                    </div>
                `;
                container.appendChild(article);
            });
            updateControls();
        }

        function updateView() {
            const slides = document.querySelectorAll('.slide');
            slides.forEach((slide, index) => {
                if (index === currentIndex) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });
            updateControls();
            
            if(window.innerWidth < 768) {
               document.getElementById('deck-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function updateControls() {
            counterText.textContent = `${currentIndex + 1} / ${deck.length}`;
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === deck.length - 1;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateView();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentIndex < deck.length - 1) {
                currentIndex++;
                updateView();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentIndex < deck.length - 1) {
                currentIndex++;
                updateView();
            } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                currentIndex--;
                updateView();
            }
        });

        window.addEventListener('DOMContentLoaded', initDeck);
    </script>
