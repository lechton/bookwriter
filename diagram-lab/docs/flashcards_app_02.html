<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svelte 5 Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #f0f0f0;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* The Neo-Brutalist shadow for the screen view */
        .brutal-shadow {
            box-shadow: 8px 8px 0px 0px rgba(0,0,0,1);
            transition: all 0.2s ease-in-out;
        }

        /* Torn Paper Effect */
        .torn-paper {
            position: relative;
            background-color: white;
            border: 4px solid #000;
            border-bottom: none; /* Removed so the custom edge can take over */
            margin-bottom: 24px;
        }

        /* The black jagged outline */
        .torn-paper::before {
            content: "";
            position: absolute;
            display: block;
            bottom: -16px;
            left: -4px;
            right: -4px;
            height: 16px;
            background: 
                linear-gradient(-45deg, transparent 11px, #000 0), 
                linear-gradient(45deg, transparent 11px, #000 0);
            background-size: 22px 16px;
            background-repeat: repeat-x;
            z-index: 1;
        }

        /* The white jagged fill (layered slightly higher to create a border illusion) */
        .torn-paper::after {
            content: "";
            position: absolute;
            display: block;
            bottom: -12px;
            left: 0px;
            right: 0px;
            height: 16px;
            background: 
                linear-gradient(-45deg, transparent 11px, #fff 0), 
                linear-gradient(45deg, transparent 11px, #fff 0);
            background-size: 22px 16px;
            background-repeat: repeat-x;
            z-index: 2;
        }

        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Screen-only slide logic */
        .slide {
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        .slide.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
            animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media print {
            body {
                background: white;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .brutal-shadow {
                box-shadow: none !important;
            }
            .slide {
                display: block !important;
                opacity: 1 !important;
                transform: none !important;
                /* Crucial: Prevents a single card from splitting across two pages */
                page-break-inside: avoid;
                break-inside: avoid;
                margin-bottom: 40px !important;
            }
            /* Add margin to top of the page so it isn't flush with the paper edge */
            #deck-container {
                margin-top: 2cm;
            }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- App Header & Controls -->

                }],
                note: "The <strong>$state</strong> rune replaces standard variable declarations for data that the interface needs to track. It acts as the <strong>source of truth</strong> for your component. When the data updates, Svelte automatically detects the change and <strong>refreshes the screen</strong> to match."

                note: "Think of <strong>$derived</strong> like a calculated column in a spreadsheet. Instead of manually updating a 'total' every time a 'price' changes, you provide a <strong>formula</strong>. It <strong>only recalculates</strong> when the specific data it depends on changes, saving processing power."

                }],
                note: "While <strong>$state</strong> holds data, <strong>$effect</strong> is your component's personal assistant for the outside world. Use it when you need to <strong>interact with the browser</strong> (like drawing on a canvas or fetching data). It <strong>watches the variables</strong> inside it and runs automatically when they change."

            {

                topic: "JavaScript Mechanics",
                title: "Understanding Closures",
                snippets: [

                    }
                ],
                note: "A <strong>closure</strong> occurs when an inner function retains access to the <strong>variables</strong> of its outer function, even after the outer function has finished running. This securely traps the data in a private <strong>persistent state</strong>. It is the foundational JavaScript mechanic that modern framework systems use to encapsulate data and reliably track reactive changes over time.",
                diagram: `

        let currentIndex = 0;
        const container = document.getElementById('deck-container');
        const counterText = document.getElementById('counter');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        function initDeck() {
            deck.forEach((card, index) => {
                const article = document.createElement('article');
                article.className = `slide torn-paper brutal-shadow ${index === 0 ? 'active' : ''}`;
                article.dataset.index = index;
                
                // Build the HTML for multiple side-by-side code blocks
                let snippetsHTML = `<div class="grid grid-cols-1 ${card.snippets.length > 1 ? 'lg:grid-cols-2' : ''} gap-4 my-6">`;
                card.snippets.forEach(snippet => {
                    snippetsHTML += `
                        <div class="bg-[#f8f9fa] border-l-8 border-black p-4 sm:p-6 relative h-full flex flex-col">
                            <span class="absolute top-0 right-0 bg-black text-white text-xs font-bold px-2 py-1 code-font">${snippet.name}</span>
                            <pre class="overflow-x-auto flex-grow"><code class="code-font text-sm sm:text-base leading-relaxed text-gray-800">${escapeHTML(snippet.code)}</code></pre>
                        </div>
                    `;
                });
                snippetsHTML += `</div>`;

                // HTML structure for a single card including the new diagram support
                article.innerHTML = `
                    <div class="relative p-6 sm:p-10 pb-8 z-10 bg-white">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="uppercase tracking-widest text-xs font-bold text-gray-500 mb-1 block">${card.topic}</span>
                                <h2 class="text-3xl sm:text-4xl font-bold border-b-4 border-black pb-2 inline-block">${card.title}</h2>
                            </div>
                            <div class="hidden sm:flex h-12 w-12 border-4 border-black rounded-full items-center justify-center font-bold text-xl flex-shrink-0">
                                ${index + 1}
                            </div>
                        </div>
                        
                        ${snippetsHTML}
                        
                        <div class="flex items-start gap-4 bg-yellow-100 p-4 border-2 border-black ${card.diagram ? 'mb-6' : ''}">
                            <svg class="w-6 h-6 flex-shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <p class="text-lg font-medium leading-snug">${card.note}</p>
                        </div>

                        ${card.diagram ? card.diagram : ''}
                    </div>
                `;
                container.appendChild(article);
            });
            updateControls();
        }

        function updateView() {
            const slides = document.querySelectorAll('.slide');
            slides.forEach((slide, index) => {
                if (index === currentIndex) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });
            updateControls();
        }

        function updateControls() {
            counterText.textContent = `${currentIndex + 1} / ${deck.length}`;
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === deck.length - 1;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        // Event Listeners
        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateView();
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentIndex < deck.length - 1) {
                currentIndex++;
                updateView();
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && currentIndex < deck.length - 1) {
                currentIndex++;
                updateView();
            } else if (e.key === 'ArrowLeft' && currentIndex > 0) {
                currentIndex--;
                updateView();
            }
        });

        // Initialize the app on load
        window.addEventListener('DOMContentLoaded', initDeck);
    </script>
