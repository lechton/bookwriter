<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 730" width="800" height="730">
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-4%" y="-6%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="shadow-error" x="-4%" y="-8%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#DC2626" flood-opacity="0.16" />
    </filter>
    <filter id="shadow-ui" x="-4%" y="-8%" width="108%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05" />
    </filter>

    <!-- Arrowheads -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0E7490" />
    </marker>
  </defs>

  <style>
    text { text-rendering: geometricPrecision; }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="730" fill="#FFFFFF" />

  <!-- Center Divider Line -->
  <line x1="400" y1="20" x2="400" y2="710" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="5 5" />

  <!-- ==================== COLUMN 1 (LEFT): WRONG ==================== -->
  <!-- Top Title Area -->
  <g transform="translate(24, 20)">
    <rect width="70" height="24" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" />
    <text x="35" y="16.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#DC2626">WRONG</text>
    <text x="82" y="18.5" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="800" fill="#DC2626">{ SiteHeader }</text>
  </g>

  <!-- Tier 1: Source Module Card (SiteHeader.jsx) -->
  <g transform="translate(24, 62)" filter="url(#shadow-card)">
    <rect width="364" height="116" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Top-left Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">SOURCE MODULE: SiteHeader.jsx</text>
    <!-- Code Content (Zero Highlighter) -->
    <text x="14" y="50" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">export default function</text>
    <text x="14" y="70" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">SiteHeader({ edition }) {</text>
    <text x="14" y="90" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">  return &lt;header&gt;...&lt;/header&gt;;</text>
    <text x="14" y="108" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">}</text>
  </g>

  <!-- Connector Tier 1 -> Tier 2 (Red Dashed) -->
  <path d="M 206 178 L 206 248" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)" fill="none" />
  
  <!-- Connector Pill Tag (Left) -->
  <g transform="translate(206, 213)">
    <rect x="-95" y="-13" width="190" height="26" rx="13" fill="#FFFFFF" stroke="#DC2626" stroke-width="1" />
    <text x="-82" y="4.5" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#DC2626">SiteHeader = </text>
    <rect x="2" y="-9" width="68" height="17" rx="3" fill="#FDE047" opacity="0.95" />
    <text x="5" y="4.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" font-weight="800" fill="#0F172A">undefined</text>
    <g transform="translate(80, 0)">
      <circle cx="0" cy="0" r="6.5" fill="#DC2626" />
      <text x="0" y="3.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" font-weight="900" fill="#FFFFFF">!</text>
    </g>
  </g>

  <!-- Tier 2: Consumer File Card (App.jsx) -->
  <g transform="translate(24, 250)" filter="url(#shadow-card)">
    <rect width="364" height="106" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Top-left Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">CONSUMER FILE: App.jsx</text>
    
    <!-- Code Content with Yellow Highlighter -->
    <!-- Yellow Marker bounding { SiteHeader } precisely -->
    <rect x="67" y="40" width="118" height="21" rx="3" fill="#FDE047" opacity="0.9" />
    <text x="14" y="55" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">import <tspan font-weight="800">{ SiteHeader }</tspan></text>
    <text x="14" y="74" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">  from './SiteHeader.jsx';</text>
    <text x="14" y="94" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">return &lt;SiteHeader /&gt;;</text>
  </g>

  <!-- Connector Tier 2 -> Tier 3 (Red Dashed) -->
  <path d="M 206 356 L 206 422" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)" fill="none" />

  <!-- Tier 3: Browser Screen (Crash State) -->
  <g transform="translate(24, 424)" filter="url(#shadow-card)">
    <!-- Browser Frame -->
    <rect width="364" height="280" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
    <!-- Top Chrome Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#FFF5F5" stroke="#DC2626" stroke-width="1.5" />
    <circle cx="16" cy="14" r="4" fill="#EF4444" />
    <circle cx="28" cy="14" r="4" fill="#F59E0B" />
    <circle cx="40" cy="14" r="4" fill="#10B981" />
    <text x="56" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#991B1B">BROWSER OUTPUT (CRASH)</text>

    <!-- Red Error Box (Pristine - Zero Yellow Marker) -->
    <g transform="translate(16, 44)" filter="url(#shadow-error)">
      <rect width="332" height="216" rx="8" fill="#DC2626" />
      
      <!-- Error Title -->
      <circle cx="24" cy="24" r="9" fill="#FFFFFF" />
      <text x="24" y="28.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#DC2626">✕</text>
      <text x="40" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF">Element type is invalid</text>
      <text x="40" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#FEE2E2">Expected string or component, got: undefined</text>

      <!-- Error Code Box -->
      <g transform="translate(14, 52)">
        <rect width="304" height="146" rx="5" fill="#991B1B" />
        <text x="12" y="22" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#FEF08A">The requested module</text>
        <text x="12" y="38" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#FEF08A">does not provide an export</text>
        <text x="12" y="54" font-family="'SF Mono', Menlo, monospace" font-size="10.5" font-weight="700" fill="#FEE2E2">named 'SiteHeader'.</text>
        <line x1="12" y1="64" x2="292" y2="64" stroke="#B91C1C" stroke-width="1" />
        <text x="12" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FECACA">Did you mean to import without</text>
        <text x="12" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FECACA">curly braces?</text>
        <text x="12" y="118" font-family="'SF Mono', Menlo, monospace" font-size="10.5" fill="#FEF08A">import SiteHeader from ...</text>
        <text x="12" y="136" font-family="'SF Mono', Menlo, monospace" font-size="10.5" fill="#F87171">at App (App.jsx:12)</text>
      </g>
    </g>
  </g>

  <!-- ==================== COLUMN 2 (RIGHT): CORRECT ==================== -->
  <!-- Top Title Area -->
  <g transform="translate(412, 20)">
    <rect width="82" height="24" rx="4" fill="#CCFBF1" stroke="#0E7490" stroke-width="1" />
    <text x="41" y="16.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#0E7490">CORRECT</text>
    <text x="94" y="18.5" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="800" fill="#0E7490">SiteHeader</text>
  </g>

  <!-- Tier 1: Source Module Card (SiteHeader.jsx) -->
  <g transform="translate(412, 62)" filter="url(#shadow-card)">
    <rect width="364" height="116" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Top-left Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">SOURCE MODULE: SiteHeader.jsx</text>
    <!-- Code Content (Zero Highlighter) -->
    <text x="14" y="50" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">export default function</text>
    <text x="14" y="70" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">SiteHeader({ edition }) {</text>
    <text x="14" y="90" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">  return &lt;header&gt;...&lt;/header&gt;;</text>
    <text x="14" y="108" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">}</text>
  </g>

  <!-- Connector Tier 1 -> Tier 2 (Teal Solid) -->
  <path d="M 594 178 L 594 248" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-teal)" fill="none" />

  <!-- Connector Pill Tag (Right) -->
  <g transform="translate(594, 213)">
    <rect x="-95" y="-13" width="190" height="26" rx="13" fill="#FFFFFF" stroke="#0E7490" stroke-width="1" />
    <text x="-82" y="4.5" font-family="'SF Mono', Menlo, monospace" font-size="11" font-weight="600" fill="#0E7490">SiteHeader = </text>
    <rect x="2" y="-9" width="68" height="17" rx="3" fill="#FDE047" opacity="0.95" />
    <text x="5" y="4.5" font-family="'SF Mono', Menlo, monospace" font-size="11.5" font-weight="800" fill="#0F172A">Component</text>
    <g transform="translate(80, 0)">
      <circle cx="0" cy="0" r="6.5" fill="#0E7490" />
      <path d="M -3 0.2 L -0.8 2.5 L 3.5 -2.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- Tier 2: Consumer File Card (App.jsx) -->
  <g transform="translate(412, 250)" filter="url(#shadow-card)">
    <rect width="364" height="106" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
    <!-- Top-left Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
    <text x="12" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">CONSUMER FILE: App.jsx</text>
    
    <!-- Code Content with Yellow Highlighter -->
    <!-- Yellow Marker bounding SiteHeader precisely -->
    <rect x="67" y="40" width="86" height="21" rx="3" fill="#FDE047" opacity="0.9" />
    <text x="14" y="55" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">import <tspan font-weight="800">SiteHeader</tspan></text>
    <text x="14" y="74" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">  from './SiteHeader.jsx';</text>
    <text x="14" y="94" font-family="'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="13.5" fill="#0F172A">return &lt;SiteHeader /&gt;;</text>
  </g>

  <!-- Connector Tier 2 -> Tier 3 (Teal Solid) -->
  <path d="M 594 356 L 594 422" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-teal)" fill="none" />

  <!-- Tier 3: Browser Screen (Rendered UI) -->
  <g transform="translate(412, 424)" filter="url(#shadow-card)">
    <!-- Browser Frame -->
    <rect width="364" height="280" rx="8" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5" />
    <!-- Top Chrome Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 356 0 Q 364 0 364 8 L 364 28 L 0 28 Z" fill="#F0FDFA" stroke="#0E7490" stroke-width="1.5" />
    <circle cx="16" cy="14" r="4" fill="#EF4444" />
    <circle cx="28" cy="14" r="4" fill="#F59E0B" />
    <circle cx="40" cy="14" r="4" fill="#10B981" />
    <text x="56" y="18.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0E7490">BROWSER OUTPUT (RENDERED UI)</text>

    <!-- Rendered Masthead Component Card (Pristine - Zero Yellow Marker) -->
    <g transform="translate(16, 44)" filter="url(#shadow-ui)">
      <rect width="332" height="216" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <path d="M 0 8 Q 0 0 8 0 L 5 0 L 5 216 L 0 216 Z" fill="#0E7490" />
      
      <!-- Publication Eyebrow Bar -->
      <text x="18" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#0E7490" letter-spacing="0.05em">THE NATIONAL TIMES • DIGITAL ARCHIVE</text>
      <line x1="18" y1="34" x2="314" y2="34" stroke="#F1F5F9" stroke-width="1" />

      <!-- Masthead Branding Block -->
      <g transform="translate(18, 52)">
        <text x="0" y="22" font-family="Georgia, serif" font-size="24" font-weight="900" fill="#0F172A" letter-spacing="-0.02em">The National Times</text>
        <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748B">Morning Edition • Est. 1887</text>
      </g>

      <!-- Edition Tag Badge -->
      <g transform="translate(18, 118)">
        <rect width="136" height="22" rx="11" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" />
        <circle cx="9" cy="11" r="3.5" fill="#10B981" />
        <text x="18" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#065F46">LIVE MORNING EDITION</text>
      </g>

      <!-- Sub-headline in Header -->
      <text x="18" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Global Summit Agrees on Clean Energy Accord</text>
      <text x="18" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Leaders pledge renewable grid investments by 2030</text>
    </g>
  </g>

</svg>
