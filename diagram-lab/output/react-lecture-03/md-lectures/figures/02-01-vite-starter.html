<div class="component-explorer rce-theme">
  <style>
    .component-explorer.rce-theme {
      margin: 1.5rem auto;
      max-width: 680px;
      background: #ffffff;
      border: 1px solid #aeb8c5;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.07), 0 1px 2px rgba(15, 23, 42, 0.04);

      break-inside: avoid;
      page-break-inside: avoid;

    .rce-theme .rce-bar {

      padding: 10px 14px;
      background: linear-gradient(to bottom, #ffffff, #edf1f5);
      border-bottom: 1px solid #aeb8c5;
    }
    .rce-theme .rce-dots {
      display: flex;
      gap: 7px;
    }
    .rce-theme .rce-dots i {
      width: 11px;
      height: 11px;
      border-radius: 50%;

    .rce-theme .rce-dots i:nth-child(1) { background: #ef6259; border: 1px solid #d94d46; }
    .rce-theme .rce-dots i:nth-child(2) { background: #f3b62f; border: 1px solid #d79c1f; }
    .rce-theme .rce-dots i:nth-child(3) { background: #55bd55; border: 1px solid #3da543; }
    .rce-theme .rce-title {

      text-align: center;
      color: #475569;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;

    .rce-theme .rce-window {

      background: #ffffff;

      white-space: nowrap;
      user-select: none;
      font-size: 0.8rem;

      color: #0369a1;
      font-weight: 700;
    }
    .rce-theme .rce-icon {

      height: 1.05rem;

    .rce-theme .rce-stage {

      flex: 1;
      min-width: 0;
      align-items: center;

      padding: 1.6rem;
      background: #f1f5f9;
      box-shadow: inset 1px 0 3px rgba(15, 23, 42, 0.025);
    }
    .rce-theme .rce-canvas {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }
    .rce-theme .rce-node {
      position: relative;
      padding: 1.85rem 1rem 1.1rem;
      border: 2px dashed #087ea4;
      border-radius: 9px;
      background: #f0f9ff;
      box-shadow: 0 4px 8px -4px rgba(15, 23, 42, 0.12);
    }
    .rce-theme .rce-node-label {
      position: absolute;
      top: -2px;
      left: -2px;
      display: flex;
      align-items: baseline;
      max-width: calc(100% + 4px);
      padding: 0.32rem 0.7rem;
      border-top-left-radius: 7px;
      border-bottom-right-radius: 6px;
      color: #fff;
      font-family: "JetBrains Mono", monospace;

      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.01em;
      background: #087ea4;
    }
    .rce-theme .rce-node-props {
      margin-left: 0.45rem;

      font-style: italic;
      white-space: nowrap;
    }
    .rce-theme .starter-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      padding: 1.2rem 1.4rem;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      text-align: center;
    }
    .rce-theme .starter-heading {

      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
    }
    .rce-theme .starter-btn {

      align-items: center;
      justify-content: center;
      padding: 0.55rem 1.1rem;

      border: 1px solid #0284c7;
      border-radius: 6px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.84rem;
      font-weight: 600;
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .rce-theme .starter-caption {
      margin: 0;
      font-size: 0.76rem;
      color: #64748b;
    }
  </style>

  <div class="rce-bar">
    <div class="rce-dots"><i></i><i></i><i></i></div>
