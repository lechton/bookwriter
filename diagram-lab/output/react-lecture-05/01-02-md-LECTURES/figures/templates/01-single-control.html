<div class="component-explorer rce-theme">
  <style>
    .component-explorer.rce-theme {
      margin: 1.5rem auto;
      max-width: 680px;
      background: #ffffff;
      border: 1px solid #aeb8c5;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.07), 0 1px 2px rgba(15, 23, 42, 0.04);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .rce-theme .rce-bar {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: linear-gradient(to bottom, #ffffff, #edf1f5);
      border-bottom: 1px solid #aeb8c5;
    }
    .rce-theme .rce-dots {
      display: flex;
      gap: 7px;
    }
    .rce-theme .rce-dots i {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }
    .rce-theme .rce-dots i:nth-child(1) { background: #ef6259; border: 1px solid #d94d46; }
    .rce-theme .rce-dots i:nth-child(2) { background: #f3b62f; border: 1px solid #d79c1f; }
    .rce-theme .rce-dots i:nth-child(3) { background: #55bd55; border: 1px solid #3da543; }
    .rce-theme .rce-title {
      flex: 1;
      text-align: center;
      color: #475569;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      user-select: none;
      padding-right: 48px;
    }
    .rce-theme .rce-window {
      display: flex;
      min-height: 290px;
      background: #ffffff;
    }
    /* Left Sidebar: File Tree */
    .rce-theme .rce-sidebar {
      flex: 0 0 31%;
      padding: 1.1rem 0.95rem;
      background: #fdfdfd;
      border-right: 1px solid #cbd5e1;
      color: #0f172a;
      font-size: 0.84rem;
    }
    .rce-theme .rce-sidebar-title {
      padding: 0 0 0.65rem 0.25rem;
      margin-bottom: 0.65rem;
      border-bottom: 1px solid #e2e8f0;
      color: #64748b;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }
    .rce-theme .rce-tree,
    .rce-theme .rce-tree ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .rce-theme .rce-tree ul {
      padding-left: 1.25rem;
    }
    .rce-theme .rce-tree li {
      position: relative;
      margin: 0;
      padding: 2px 0;
    }
    .rce-theme .rce-tree li::before,
    .rce-theme .rce-tree li::after {
      position: absolute;
      left: -0.62rem;
      content: "";
    }
    .rce-theme .rce-tree li::before {
      top: 0.95rem;
      width: 0.62rem;
      border-top: 1px solid #cbd5e1;
    }
    .rce-theme .rce-tree li::after {
      top: 0;
      width: 0;
      height: 100%;
      border-left: 1px solid #cbd5e1;
    }
    .rce-theme .rce-sidebar > .rce-tree > li::before,
    .rce-theme .rce-sidebar > .rce-tree > li::after {
      display: none;
    }
    .rce-theme .rce-tree li:last-child::after {
      height: 0.95rem;
    }
    .rce-theme .rce-tree-label {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.28rem 0.38rem;
      border-radius: 5px;
      color: #0f172a;
      font-weight: 500;
      white-space: nowrap;
      user-select: none;
      font-size: 0.8rem;
    }
    .rce-theme .rce-tree-label.active {
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 700;
    }
    .rce-theme .rce-icon {
      width: 1.05rem;
      height: 1.05rem;
      flex: none;
    }
    /* Right Stage: Component Canvas */
    .rce-theme .rce-stage {
      display: flex;
      flex: 1;
      min-width: 0;
      align-items: center;
      justify-content: center;
      padding: 1.6rem;
      background: #f1f5f9;
      box-shadow: inset 1px 0 3px rgba(15, 23, 42, 0.025);
    }
    .rce-theme .rce-canvas {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }
    .rce-theme .rce-node {
      position: relative;
      margin-top: 0.85rem;
      padding: 1.85rem 1rem 0.95rem;
      border: 2px dashed #94a3b8;
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 4px 8px -4px rgba(15, 23, 42, 0.12);
    }
    .rce-theme .rce-node:first-child { margin-top: 0; }
    .rce-theme .rce-node-label {
      position: absolute;
      top: -2px;
      left: -2px;
      display: flex;
      align-items: baseline;
      max-width: calc(100% + 4px);
      padding: 0.32rem 0.7rem;
      border-top-left-radius: 7px;
      border-bottom-right-radius: 6px;
      color: #fff;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.01em;
      background: #087ea4;
    }
    .rce-theme .rce-node-props {
      margin-left: 0.45rem;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 400;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Semantic Kinds */
    .rce-theme .kind-shell { border-color: #475569; background: #f8fafc; }
    .rce-theme .kind-shell > .rce-node-label { background: #475569; }
    .rce-theme .kind-counter { border-color: #087ea4; background: #f0f9ff; }
    .rce-theme .kind-counter > .rce-node-label { background: #087ea4; }
    .rce-theme .kind-badge { border-color: #d97706; background: #fffbeb; }
    .rce-theme .kind-badge > .rce-node-label { background: #d97706; }
    .rce-theme .kind-card { border-color: #2563eb; background: #eff6ff; }
    .rce-theme .kind-card > .rce-node-label { background: #2563eb; }
    .rce-theme .kind-button { border-color: #087ea4; background: #f0f9ff; }
    .rce-theme .kind-button > .rce-node-label { background: #087ea4; }
    .rce-theme .kind-wrong { border-color: #dc2626; background: #fef2f2; }
    .rce-theme .kind-wrong > .rce-node-label { background: #dc2626; }
    .rce-theme .kind-store { border-color: #7c3aed; background: #faf5ff; }
    .rce-theme .kind-store > .rce-node-label { background: #7c3aed; }
    .rce-theme .kind-form { border-color: #0891b2; background: #ecfeff; }
    .rce-theme .kind-form > .rce-node-label { background: #0891b2; }

    /* Counter Widget Styles */
    .rce-theme .counter-widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1.4rem;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    .rce-theme .counter-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }
    .rce-theme .counter-caption {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
    }
    .rce-theme .counter-value {
      font-size: 2.4rem;
      font-weight: 800;
      color: #087ea4;
      line-height: 1;
      font-feature-settings: "tnum";
    }
    .rce-theme .counter-controls {
      display: flex;
      gap: 0.6rem;
      width: 100%;
      justify-content: center;
    }
    .rce-theme .counter-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.45rem 0.95rem;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      color: #1e293b;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }
    .rce-theme .counter-btn.primary {
      background: #087ea4;
      border-color: #087ea4;
      color: #ffffff;
    }
  </style>

  <div class="rce-bar">
    <div class="rce-dots"><i></i><i></i><i></i></div>
    <div class="rce-title">CounterButton.jsx — Component Explorer</div>
  </div>

  <div class="rce-window">
    <aside class="rce-sidebar">
      <div class="rce-sidebar-title">Components</div>
      <ul class="rce-tree">
        <li>

            <svg class="rce-icon" viewBox="0 0 24 24" fill="none" stroke="#087ea4" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><text x="6" y="18" font-size="6" font-family="sans-serif" font-weight="900" fill="#087ea4">JSX</text></svg>

    <main class="rce-stage">

        <div class="rce-node kind-counter">
          <div class="rce-node-label">
            &lt;CounterButton.jsx&gt;

          <div class="counter-widget">
            <div class="counter-display">
              <span class="counter-caption">Items in Cart</span>
              <span class="counter-value">5</span>

            <div class="counter-controls">

  </div>
</div>
