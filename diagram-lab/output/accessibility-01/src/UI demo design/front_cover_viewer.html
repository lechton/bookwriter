<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Viewer - Web Accessibility & Web Performance</title>
    
    <!-- Load Inter font for clean, professional typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        book: {
                            dark: '#0f172a',    // Slate 900 (from 00_TOC.html)
                            cyan: '#0e7490',    // Cyan 700
                            light: '#f8fafc',   // Slate 50
                            accent: '#06b6d4',  // Cyan 500 for glows
                        }
                    },
                    aspectRatio: {
                        'book': '2 / 3',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #09090b; /* Very dark background for the app environment */
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
        }

        /* Abstract geometric pattern for the book background */
        .cover-bg {
            background: radial-gradient(circle at top right, rgba(14, 116, 144, 0.15), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(14, 116, 144, 0.1), transparent 50%),
                        #0f172a;
            position: relative;
            z-index: 1;
        }

        /* Subtle grid overlay to represent "Architecture" and "DOM" */
        .cover-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: -1;
            opacity: 0.6;
        }

        /* Premium physical book shadow */
        .book-shadow {
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.05),
                -20px 20px 40px -10px rgba(0, 0, 0, 0.8),
                -40px 40px 60px -15px rgba(0, 0, 0, 0.6);
        }

        /* Subtle spine highlight */
        .book-spine {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            background: linear-gradient(to right, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.0) 100%);
            border-left: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen antialiased selection:bg-cyan-900 selection:text-white">

    <!-- Minimal App Top Bar (Non-interactive presentation context) -->
    <header class="w-full flex items-center justify-between px-6 py-4 border-b border-white/5 bg-white/5 backdrop-blur-md fixed top-0 z-50">
        <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
            </svg>
            <span class="text-sm font-semibold tracking-wide text-slate-300">Curriculum Viewer</span>
        </div>
        <div class="text-xs font-medium text-slate-500 bg-white/5 px-3 py-1.5 rounded-full">
            Preview Mode
        </div>
    </header>

    <!-- Main App Content Area -->
    <main class="flex-grow flex items-center justify-center p-6 sm:p-12 pt-24 pb-12 w-full">
        
        <!-- The Book Cover Container -->
        <!-- Fixed max-width and aspect ratio maintains the physical book proportion on all screens -->
        <article class="relative w-full max-w-sm sm:max-w-md lg:max-w-[420px] aspect-book cover-bg rounded-r-lg rounded-l-[3px] book-shadow overflow-hidden flex flex-col justify-between transition-transform duration-700 hover:scale-[1.02]">
            
            <!-- Structural Grid and Spine overlay -->
            <div class="cover-grid"></div>
            <div class="book-spine"></div>
            
            <!-- Top Section: Kicker -->
            <div class="pt-10 px-8 relative z-10">
                <p class="text-book-accent text-[0.65rem] sm:text-xs font-black uppercase tracking-[0.2em] mb-2 drop-shadow-sm">
                    Official Syllabus & Course Architecture
                </p>
                <div class="w-12 h-1 bg-book-accent rounded-full mb-6"></div>
            </div>

            <!-- Middle Section: Main Title -->
            <div class="px-8 relative z-10 flex-grow flex flex-col justify-center mt-[-2rem]">
                <h1 class="text-[2.75rem] sm:text-[3.25rem] lg:text-[3.75rem] font-black text-white leading-[1.05] tracking-tight drop-shadow-lg">
                    Web<br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">Accessibility</span><br>
                    &amp; Web<br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-book-accent to-cyan-200">Performance</span>
                </h1>
            </div>

            <!-- Bottom Section: Metrics & Data Points -->
            <div class="p-8 pb-8 relative z-10 bg-gradient-to-t from-slate-950/80 to-transparent">
                <div class="grid grid-cols-2 gap-4 border-t border-slate-700/60 pt-5 mb-5">
                    <div>
                        <p class="text-[0.65rem] text-slate-400 uppercase tracking-wider font-semibold mb-1">Lectures</p>
                        <p class="text-lg font-black text-white">54</p>
                    </div>
                    <div>
                        <p class="text-[0.65rem] text-slate-400 uppercase tracking-wider font-semibold mb-1">Core Tracks</p>
                        <p class="text-lg font-black text-white">02</p>
                    </div>
                    <div>
                        <p class="text-[0.65rem] text-slate-400 uppercase tracking-wider font-semibold mb-1">Depth Tiers</p>
                        <p class="text-sm font-bold text-slate-200">CORE / MORE / ADV</p>
                    </div>
                    <div>
                        <p class="text-[0.65rem] text-slate-400 uppercase tracking-wider font-semibold mb-1">Visual Canvases</p>
                        <p class="text-lg font-black text-book-accent">108</p>
                    </div>
                </div>

                <!-- Subtle JobScanner Branding -->
                <div class="flex items-center justify-between border-t border-slate-800 pt-4">
                    <span class="text-[0.65rem] tracking-[0.2em] font-medium text-slate-500 uppercase">Curriculum by</span>
                    <span class="text-xs font-black tracking-widest text-slate-400 uppercase">JobScanner</span>
                </div>
            </div>
            
            <!-- Decorative geometric shapes for modern tech feel -->
            <svg class="absolute bottom-0 right-0 w-48 h-48 text-white opacity-[0.03] transform translate-x-1/4 translate-y-1/4 pointer-events-none" viewBox="0 0 100 100" fill="currentColor">
                <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="4" fill="none" />
                <circle cx="50" cy="50" r="25" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M 50 10 L 50 90 M 10 50 L 90 50" stroke="currentColor" stroke-width="1" />
            </svg>

        </article>

    </main>

    <!-- Minimal App Footer -->
    <footer class="w-full text-center py-6 text-xs text-slate-500/50 absolute bottom-0">
        Non-interactive cover presentation view
    </footer>

</body>
</html>
