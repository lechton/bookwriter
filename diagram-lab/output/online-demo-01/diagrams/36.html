<div class="dg" style="font-family:monospace; background:#faf7f0; border:4px solid #000; padding:24px; display:flex; gap:20px; align-items:stretch; position:relative;">

  <!-- LEFT CARD: $state — deep proxy on (default, neutral white) -->
  <div style="flex:1; border:4px solid #000; background:#fff; padding:18px 16px 14px; position:relative; display:flex; flex-direction:column;">
    <div style="font-size:11pt; font-weight:900; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:14px; border-bottom:3px solid #000; padding-bottom:6px;">$state(hugeArray)</div>

    <!-- Scattered proxy boxes -->
    <div style="flex:1; display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; align-content:center; padding:8px 0;">
      <div style="border:2px solid #000; background:#fff; padding:6px 0; text-align:center; font-size:10pt; font-weight:900;">P</div>
      <div style="border:2px solid #000; background:#fff; padding:6px 0; text-align:center; font-size:10pt; font-weight:900;">P</div>
      <div style="border:2px solid #000; background:#fff; padding:6px 0; text-align:center; font-size:10pt; font-weight:900;">P</div>
      <div style="border:2px solid #000; background:#fff; padding:6px 0; text-align:center; font-size:10pt; font-weight:900;">P</div>
      <div style="border:2px solid #000; background:#fff; padding:6px 0; text-align:center; font-size:10pt; font-weight:900;">P</div>
      <div style="border:2px solid #000; background:#fff; padding:6px 0; text-align:center; font-size:10pt; font-weight:900;">P</div>
      <div style="border:2px solid #000; background:#fff; padding:6px 0; text-align:center; font-size:10pt; font-weight:900;">P</div>
      <div style="border:2px solid #000; background:#fff; padding:6px 0; text-align:center; font-size:10pt; font-weight:900;">P</div>
    </div>

    <div style="font-size:9pt; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#475569; margin-top:10px; text-align:center;">proxy on every property</div>
  </div>

  <!-- RIGHT CARD: $state.raw — deep proxy off (prescriptive choice, mustard accent) -->
  <div style="flex:1; border:4px solid #000; background:#fff; padding:18px 16px 14px; position:relative; display:flex; flex-direction:column; box-shadow:6px 6px 0 0 #000;">
    <div style="font-size:11pt; font-weight:900; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:14px; border-bottom:3px solid #000; padding-bottom:6px;">$state.raw(hugeArray)</div>

    <!-- One flat block, no interior structure -->
    <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:8px 0;">
      <div style="background:#facc15; border:4px solid #000; padding:24px 18px; text-align:center; font-weight:900; font-size:12pt; width:80%; box-shadow:4px 4px 0 0 #000;">
        [ ...one value... ]
      </div>
    </div>

    <div style="font-size:9pt; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#475569; margin-top:10px; text-align:center;">tracked only at the binding</div>
  </div>

</div>
