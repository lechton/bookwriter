<div class="dg" style="font-family:monospace; background:#faf7f0; border:4px solid #000; padding:24px 22px 20px; display:flex; gap:18px; align-items:stretch; position:relative;">

  <!-- LEFT CARD: without tick() — scroll boundary one row short -->
  <div style="flex:1; border:4px solid #000; background:#fff; padding:14px 14px 12px; position:relative; display:flex; flex-direction:column; box-shadow:4px 4px 0 0 #000;">
    <div style="font-size:10pt; font-weight:900; letter-spacing:0.04em; margin-bottom:10px; border-bottom:3px solid #000; padding-bottom:5px;">without tick()</div>

    <!-- chat log mock: 3 message rows, scroll boundary cuts off row 3 -->
    <div style="position:relative; flex:1; border:2px solid #000; background:#f1f5f9; overflow:hidden; padding:6px;">
      <div style="border:1px solid #000; background:#fff; padding:4px 6px; font-size:9pt; margin-bottom:4px;">msg 1</div>
      <div style="border:1px solid #000; background:#fff; padding:4px 6px; font-size:9pt; margin-bottom:4px;">msg 2</div>
      <div style="border:1px solid #000; background:#fff; padding:4px 6px; font-size:9pt; opacity:0.55;">msg 3 (latest, cut off)</div>
      <!-- scroll boundary line positioned above row 3 -->
      <div style="position:absolute; left:0; right:0; bottom:22px; height:3px; background:#000;"></div>
      <div style="position:absolute; right:4px; bottom:24px; background:#000; color:#fff; padding:1px 5px; font-size:7pt; font-weight:900; letter-spacing:0.08em; text-transform:uppercase;">scroll boundary</div>
    </div>

    <!-- crossed-out token -->
    <div style="position:absolute; top:8px; right:8px; border:2px solid #000; background:#fff; padding:2px 6px; font-size:8pt; font-weight:900; text-decoration:line-through;">await tick()</div>

    <div style="font-size:9pt; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#475569; margin-top:10px; text-align:center;">scroll lands one short</div>
  </div>

  <!-- RIGHT CARD: with tick() — scroll boundary flush at bottom -->
  <div style="flex:1; border:4px solid #000; background:#fff; padding:14px 14px 12px; position:relative; display:flex; flex-direction:column; box-shadow:4px 4px 0 0 #000;">
    <div style="font-size:10pt; font-weight:900; letter-spacing:0.04em; margin-bottom:10px; border-bottom:3px solid #000; padding-bottom:5px;">with tick()</div>

    <!-- chat log mock: 3 message rows, scroll boundary at very bottom -->
    <div style="position:relative; flex:1; border:2px solid #000; background:#f1f5f9; overflow:hidden; padding:6px;">
      <div style="border:1px solid #000; background:#fff; padding:4px 6px; font-size:9pt; margin-bottom:4px;">msg 1</div>
      <div style="border:1px solid #000; background:#fff; padding:4px 6px; font-size:9pt; margin-bottom:4px;">msg 2</div>
      <div style="border:1px solid #000; background:#facc15; padding:4px 6px; font-size:9pt; font-weight:900;">msg 3 (latest, visible)</div>
      <!-- scroll boundary line at the very bottom -->
      <div style="position:absolute; left:0; right:0; bottom:0; height:3px; background:#000;"></div>
      <div style="position:absolute; right:4px; bottom:4px; background:#000; color:#fff; padding:1px 5px; font-size:7pt; font-weight:900; letter-spacing:0.08em; text-transform:uppercase;">scroll boundary</div>
    </div>

    <!-- mustard-yellow token (the only accent in the diagram) -->
    <div style="position:absolute; top:8px; right:8px; border:2px solid #000; background:#facc15; padding:2px 6px; font-size:8pt; font-weight:900; box-shadow:2px 2px 0 0 #000;">await tick()</div>

    <div style="font-size:9pt; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#475569; margin-top:10px; text-align:center;">scroll lands at the bottom</div>
  </div>

</div>
