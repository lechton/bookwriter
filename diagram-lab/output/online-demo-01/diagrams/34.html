<div class="dg" style="display:flex; justify-content:space-between; align-items:center; height:450px; padding:40px; background-color:#fff; border:6px solid #000; position:relative; font-family:sans-serif;">

  <!-- Left Side: Legacy Structure -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
    <div style="font-weight:900; font-size:16pt; margin-bottom:16px; letter-spacing:0.05em;">LEGACY: TOP-DOWN</div>
    <div style="width:250px; height:320px; border:6px dashed #9ca3af; position:relative; display:flex; flex-direction:column; align-items:center; padding:10px; background-color:#f9fafb;">
      <div style="background:#000; color:#fff; font-weight:bold; padding:4px 12px; margin-bottom:10px; font-family:monospace; font-size:10pt;">Component Tree</div>
      
      <!-- Nested Boxes -->
      <div style="width:200px; height:240px; border:4px solid #000; display:flex; justify-content:center; padding-top:20px; position:relative;">
        <div style="width:160px; height:180px; border:4px solid #000; display:flex; justify-content:center; padding-top:20px; position:relative;">
          <div style="width:120px; height:120px; border:4px solid #000; display:flex; justify-content:center; align-items:flex-end; padding-bottom:10px; position:relative;">
            <!-- Target Node -->
            <div style="border:4px solid #000; background:#fff; padding:6px 12px; font-family:monospace; font-weight:bold; font-size:12pt; box-shadow:4px 4px 0 0 rgba(0,0,0,1); z-index:2;">&lt;div&gt;</div>
          </div>
        </div>
      </div>

      <!-- Cascading Line -->
      <div style="position:absolute; top:40px; left:50%; width:8px; height:220px; background:#000; transform:translateX(-50%); z-index:1;">
        <!-- Arrowheads down the line -->
        <div style="position:absolute; top:40px; left:-6px; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:14px solid #000;"></div>
        <div style="position:absolute; top:100px; left:-6px; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:14px solid #000;"></div>
        <div style="position:absolute; bottom:-12px; left:-6px; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:14px solid #000;"></div>
      </div>

    </div>
  </div>

  <!-- Divider -->
  <div style="width:6px; height:350px; background:#e5e7eb; margin:0 20px;"></div>

  <!-- Right Side: $state Structure -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center;">
    <div style="font-weight:900; font-size:16pt; margin-bottom:16px; letter-spacing:0.05em;">RUNES: DIRECT UPDATE</div>
    <div style="width:100%; height:320px; position:relative; display:flex; align-items:center; justify-content:center;">
      
      <!-- Isolated state block -->
      <div style="background:#facc15; border:6px solid #000; padding:16px 24px; box-shadow:8px 8px 0 0 #000; z-index:2;">
        <div style="font-family:monospace; font-weight:900; font-size:16pt;">$state()</div>
      </div>

      <!-- Direct horizontal arrow -->
      <div style="width:80px; height:8px; background:#000; position:relative; z-index:1;">
        <!-- Arrowhead -->
        <div style="position:absolute; right:-14px; top:-14px; width:0; height:0; border-top:18px solid transparent; border-bottom:18px solid transparent; border-left:24px solid #000;"></div>
      </div>

      <!-- Isolated DOM node -->
      <div style="border:6px solid #000; background:#fff; padding:16px 24px; font-family:monospace; font-weight:900; font-size:16pt; box-shadow:8px 8px 0 0 #000; z-index:2; margin-left:14px;">
        &lt;h1&gt;
      </div>

    </div>
  </div>

</div>
