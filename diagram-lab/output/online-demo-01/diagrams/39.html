<div class="dg" style="display:flex; flex-direction:column; align-items:center; gap:24px; padding:32px; background-color:#f8f9fa; font-family:sans-serif; color:#000;">

    <!-- Top: Reactive Signal (Proxy) -->
    <div style="border:4px solid #000; background-color:#cffafe; padding:16px; box-shadow:6px 6px 0 0 #000; position:relative; text-align:center; width:280px;">
        <span style="position:absolute; top:-12px; left:16px; background-color:#000; color:#fff; padding:4px 8px; font-size:10px; font-weight:bold; text-transform:uppercase; letter-spacing:0.1em; border:2px solid #000;">Input</span>
        <div style="font-family:monospace; font-weight:bold; font-size:14px; background-color:#fff; border:2px solid #000; padding:12px; margin-top:16px; text-align:left;">
            Proxy({<br>
            &nbsp;&nbsp;val: Proxy(...)<br>
            })
        </div>
    </div>
    
    <!-- Arrow -->
    <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:8px; height:24px; background-color:#000;"></div>
        <div style="width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-top:16px solid #000;"></div>
    </div>
    
    <!-- Middle: $inspect Lens -->
    <div style="border:4px solid #000; background-color:#fde047; padding:16px; box-shadow:6px 6px 0 0 #000; position:relative; text-align:center; width:320px; z-index:10;">
        <span style="position:absolute; top:-12px; left:50%; transform:translateX(-50%); background-color:#000; color:#fff; padding:4px 8px; font-size:10px; font-weight:bold; text-transform:uppercase; letter-spacing:0.1em; border:2px solid #000;">Unwrap</span>
        <div style="font-family:monospace; font-weight:900; font-size:24px; display:flex; align-items:center; justify-content:center; gap:8px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            $inspect()
        </div>
    </div>
    
    <!-- Arrow -->
    <div style="display:flex; flex-direction:column; align-items:center;">
        <div style="width:8px; height:24px; background-color:#000;"></div>
        <div style="width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-top:16px solid #000;"></div>
    </div>
    
    <!-- Bottom: Clean Output -->
    <div style="border:4px solid #000; background-color:#fff; padding:16px; box-shadow:6px 6px 0 0 #000; position:relative; text-align:center; width:280px;">
        <span style="position:absolute; top:-12px; left:16px; background-color:#000; color:#fff; padding:4px 8px; font-size:10px; font-weight:bold; text-transform:uppercase; letter-spacing:0.1em; border:2px solid #000;">Console</span>
        <div style="font-family:monospace; font-weight:bold; font-size:14px; background-color:#f1f5f9; border:2px solid #000; padding:12px; margin-top:16px; text-align:left;">
            { val: 42 }
        </div>
    </div>
</div>
