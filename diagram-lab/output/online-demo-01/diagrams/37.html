<div class="mt-8 flex flex-col items-center justify-center font-sans gap-8">
    <!-- Top Row: State Dependencies -->
    <div class="flex gap-8">
        <!-- Element 1: State A -->
        <div class="border-4 border-black bg-cyan-100 px-6 py-4 shadow-[6px_6px_0_0_#000] relative text-center">
            <span class="absolute -top-3 left-4 bg-black text-white px-2 py-1 text-[10px] font-bold uppercase tracking-widest border-2 border-black">Input 1</span>
            <div class="font-mono font-bold text-lg">$state(A)</div>
        </div>
        <!-- Element 2: State B -->
        <div class="border-4 border-black bg-cyan-100 px-6 py-4 shadow-[6px_6px_0_0_#000] relative text-center">
            <span class="absolute -top-3 left-4 bg-black text-white px-2 py-1 text-[10px] font-bold uppercase tracking-widest border-2 border-black">Input 2</span>
            <div class="font-mono font-bold text-lg">$state(B)</div>
        </div>
    </div>
    
    <!-- Element 3: $derived -->
    <div class="border-4 border-black bg-yellow-300 px-12 py-6 shadow-[6px_6px_0_0_#000] relative text-center w-3/4">
        <span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-black text-white px-3 py-1 text-[12px] font-bold uppercase tracking-widest border-2 border-black">Computation</span>
        <div class="font-mono font-black text-2xl mb-2">$derived(A + B)</div>
        <div class="font-bold text-sm uppercase tracking-widest border-t-4 border-black pt-2 mt-2">Memoized Evaluation</div>
    </div>
    
    <!-- Element 4: Output -->
    <div class="border-4 border-black bg-white px-8 py-4 shadow-[6px_6px_0_0_#000] relative text-center">
        <span class="absolute -top-3 left-4 bg-black text-white px-2 py-1 text-[10px] font-bold uppercase tracking-widest border-2 border-black">Output</span>
        <div class="font-mono font-bold text-xl">Cached Result</div>
    </div>
</div>
