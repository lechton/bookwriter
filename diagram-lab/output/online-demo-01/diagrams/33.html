<div class="dg" style="display:flex; height:450px; padding:40px; background-color:#fff; border:6px solid #000; position:relative; z-index:1; font-family:sans-serif; overflow:hidden;">

  <!-- Left: The Cage -->
  <div style="flex:1; border:6px dashed #000; padding:32px; display:flex; flex-direction:column; justify-content:center; align-items:center; position:relative; background:#f9fafb;">
    <div style="position:absolute; top:-20px; background:#fff; padding:0 16px; font-weight:900; font-size:16pt; letter-spacing:0.1em; border:6px solid #000; box-shadow:4px 4px 0 0 #000;">
      .svelte BOUNDARY
    </div>
    
    <!-- Lock Icon -->
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" style="margin-bottom:16px;">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    
    <div style="font-family:monospace; font-size:20pt; font-weight:bold; background:#e5e7eb; padding:8px 16px; border:4px solid #000; margin-bottom:16px;">
      let x = 0;
    </div>
    <div style="font-weight:900; font-size:12pt; text-transform:uppercase; letter-spacing:0.1em; color:#000;">
      Trapped Reactivity
    </div>
  </div>

  <!-- Space between cage and outside -->
  <div style="width:80px; position:relative;">
    <!-- Connecting Wire breaking through -->
    <div style="position:absolute; top:50%; left:0; width:100%; height:6px; background:#000; transform:translateY(-50%);"></div>
    <!-- Arrow pointing left into the component from the Runes -->
    <div style="position:absolute; top:50%; left:0; width:0; height:0; border-top:12px solid transparent; border-bottom:12px solid transparent; border-right:16px solid #000; transform:translate(0%, -50%);"></div>
  </div>

  <!-- Right: The Open Space -->
  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; padding-left:32px; position:relative;">
    
    <!-- Unlock Icon -->
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" style="position:absolute; top:32px; right:32px;">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
    </svg>

    <div style="font-weight:900; font-size:24pt; margin-bottom:16px;">
      UNIVERSAL PRIMITIVES
    </div>

    <!-- The Rune Node -->
    <div style="background:#22d3ee; border:6px solid #000; padding:16px 32px; box-shadow:8px 8px 0 0 #000; display:flex; flex-direction:column; align-items:center; margin-bottom:24px; position:relative; z-index:2;">
      <div style="font-family:monospace; font-size:22pt; font-weight:900;">
        $state(0)
      </div>
      <div style="position:absolute; bottom:-16px; background:#fff; border:4px solid #000; padding:2px 8px; font-weight:bold; font-size:10pt;">
        EXPLICIT
      </div>
    </div>
    
    <!-- Branching to .js -->
    <div style="position:relative; width:100%; height:80px;">
      <div style="position:absolute; top:0; left:32px; width:6px; height:40px; background:#000;"></div>
      <div style="position:absolute; top:40px; left:32px; width:120px; height:6px; background:#000;"></div>
      <div style="position:absolute; top:40px; left:152px; width:0; height:0; border-top:12px solid transparent; border-bottom:12px solid transparent; border-left:16px solid #000; transform:translate(0%, -25%);"></div>
      
      <!-- .js file representation -->
      <div style="position:absolute; top:20px; left:180px; background:#fef08a; border:4px solid #000; padding:8px 16px; font-family:monospace; font-weight:bold; font-size:14pt; box-shadow:4px 4px 0 0 #000;">
        .svelte.js
      </div>
      <div style="position:absolute; top:70px; left:200px; font-weight:bold; font-size:10pt; text-transform:uppercase;">
        PORTABLE
      </div>
    </div>

  </div>

</div>
