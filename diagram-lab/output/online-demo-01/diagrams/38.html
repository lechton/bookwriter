<div class="dg" style="font-family:monospace; background:#faf7f0; border:4px solid #000; padding:32px 24px 24px; display:flex; flex-direction:column; align-items:stretch; gap:18px; position:relative;">

  <!-- BANNER: the one fact both forms share (only mustard-yellow accent) -->
  <div style="background:#facc15; border:4px solid #000; padding:10px 14px; text-align:center; box-shadow:5px 5px 0 0 #000;">
    <div style="font-size:10pt; font-weight:900; letter-spacing:0.1em; text-transform:uppercase;">same memoized signal underneath</div>
  </div>

  <!-- TWO CARDS SIDE BY SIDE -->
  <div style="display:flex; gap:20px; align-items:stretch;">

    <!-- LEFT: $derived(expr) — one expression slot -->
    <div style="flex:1; border:4px solid #000; background:#fff; padding:18px 16px 14px; display:flex; flex-direction:column; box-shadow:4px 4px 0 0 #000;">
      <div style="font-size:11pt; font-weight:900; letter-spacing:0.04em; margin-bottom:14px; border-bottom:3px solid #000; padding-bottom:6px;">$derived(expr)</div>

      <!-- Single thin slot for one expression -->
      <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:24px 0;">
        <div style="border:2px dashed #000; background:#faf7f0; padding:14px 18px; min-width:80%; text-align:center; font-size:11pt; font-weight:700; color:#475569;">one expression</div>
      </div>

      <div style="font-size:9pt; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#475569; margin-top:10px; text-align:center;">reach for this first</div>
    </div>

    <!-- RIGHT: $derived.by(() => { ... }) — stacked statements -->
    <div style="flex:1; border:4px solid #000; background:#fff; padding:18px 16px 14px; display:flex; flex-direction:column; box-shadow:4px 4px 0 0 #000;">
      <div style="font-size:11pt; font-weight:900; letter-spacing:0.04em; margin-bottom:14px; border-bottom:3px solid #000; padding-bottom:6px;">$derived.by(() =&gt; { ... })</div>

      <!-- Stacked block of three statement lines -->
      <div style="flex:1; display:flex; flex-direction:column; gap:6px; align-items:stretch; justify-content:center; padding:12px 0;">
        <div style="border:2px solid #000; background:#fff; padding:8px 10px; font-size:10pt; font-weight:700;">let subtotal = 0;</div>
        <div style="border:2px solid #000; background:#fff; padding:8px 10px; font-size:10pt; font-weight:700;">for (...) subtotal += ...;</div>
        <div style="border:2px solid #000; background:#fff; padding:8px 10px; font-size:10pt; font-weight:700;">return subtotal * (1 + tax);</div>
      </div>

      <div style="font-size:9pt; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#475569; margin-top:10px; text-align:center;">statements allowed</div>
    </div>

  </div>

</div>
