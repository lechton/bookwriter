<div class="dg" style="font-family:monospace; background:#faf7f0; border:4px solid #000; padding:28px 22px 22px; display:flex; flex-direction:column; align-items:center; gap:0; position:relative;">

  <!-- ELEMENT 1: state changed (neutral white) -->
  <div style="border:4px solid #000; background:#fff; padding:14px 22px; text-align:center; box-shadow:4px 4px 0 0 #000; min-width:240px;">
    <div style="font-size:9pt; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#475569; margin-bottom:6px;">state</div>
    <div style="font-size:12pt; font-weight:900;">items.push('c')</div>
    <div style="font-size:9pt; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#475569; margin-top:6px;">state changed, DOM stale</div>
  </div>

  <!-- ARROW 1 + "yields control" pill (ELEMENT 4) -->
  <div style="position:relative; height:50px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;">
    <div style="width:5px; height:24px; background:#000;"></div>
    <div style="width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent; border-top:13px solid #000;"></div>
    <div style="position:absolute; top:8px; left:calc(50% + 14px); background:#0e7490; color:#fff; border:2px solid #000; padding:3px 9px; font-size:8pt; font-weight:900; letter-spacing:0.1em; text-transform:uppercase; white-space:nowrap;">yields control</div>
  </div>

  <!-- ELEMENT 2: await tick() (mustard-yellow focal point) -->
  <div style="border:4px solid #000; background:#facc15; padding:16px 28px; text-align:center; box-shadow:6px 6px 0 0 #000; min-width:240px;">
    <div style="font-size:9pt; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#3f2d00; margin-bottom:6px;">yield point</div>
    <div style="font-size:13pt; font-weight:900;">await tick()</div>
    <div style="font-size:9pt; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#3f2d00; margin-top:6px;">handler pauses, microtask runs</div>
  </div>

  <!-- ARROW 2 (no pill) -->
  <div style="height:34px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;">
    <div style="width:5px; height:20px; background:#000;"></div>
    <div style="width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent; border-top:13px solid #000;"></div>
  </div>

  <!-- ELEMENT 3: flush runs + DOM ready (merged into one box) -->
  <div style="border:4px solid #000; background:#fff; padding:14px 22px; text-align:center; box-shadow:4px 4px 0 0 #000; min-width:240px;">
    <div style="font-size:9pt; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#475569; margin-bottom:6px;">flush + resume</div>
    <div style="font-size:12pt; font-weight:900;">DOM is current</div>
    <div style="font-size:9pt; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#475569; margin-top:6px;">execution resumes, measurements valid</div>
  </div>

</div>
