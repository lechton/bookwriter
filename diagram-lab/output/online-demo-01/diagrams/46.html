<div class="dg" style="font-family:monospace; background:#faf7f0; border:4px solid #000; padding:28px 24px 24px; display:flex; flex-direction:column; align-items:center; gap:0; position:relative;">

  <!-- ELEMENT 1: synchronous writes stack (grouped, counts as one element) -->
  <div style="position:relative; display:flex; flex-direction:column; align-items:stretch; gap:6px; padding-top:18px;">
    <div style="position:absolute; top:-2px; left:50%; transform:translateX(-50%); background:#000; color:#fff; padding:3px 10px; font-size:8pt; font-weight:900; letter-spacing:0.12em; text-transform:uppercase; border:2px solid #000; white-space:nowrap;">synchronous writes</div>
    <div style="border:2px solid #000; background:#fff; padding:8px 18px; font-size:11pt; font-weight:700; text-align:center;">count += 1</div>
    <div style="border:2px solid #000; background:#fff; padding:8px 18px; font-size:11pt; font-weight:700; text-align:center;">count += 1</div>
    <div style="border:2px solid #000; background:#fff; padding:8px 18px; font-size:11pt; font-weight:700; text-align:center;">count += 1</div>
  </div>

  <!-- ARROW 1 + "coalesced" pill (element 4) -->
  <div style="position:relative; height:54px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-top:8px;">
    <div style="width:5px; height:30px; background:#000;"></div>
    <div style="width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent; border-top:13px solid #000;"></div>
    <div style="position:absolute; top:14px; left:calc(50% + 14px); background:#0e7490; color:#fff; border:2px solid #000; padding:3px 9px; font-size:8pt; font-weight:900; letter-spacing:0.1em; text-transform:uppercase; white-space:nowrap;">coalesced</div>
  </div>

  <!-- ELEMENT 2: one microtask flush (mustard-yellow focal point) -->
  <div style="border:4px solid #000; background:#facc15; padding:16px 28px; text-align:center; box-shadow:6px 6px 0 0 #000; min-width:280px;">
    <div style="font-size:9pt; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#3f2d00; margin-bottom:6px;">flush</div>
    <div style="font-size:13pt; font-weight:900;">one microtask flush</div>
    <div style="font-size:9pt; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#3f2d00; margin-top:6px;">reads final state only</div>
  </div>

  <!-- ARROW 2 (no pill) -->
  <div style="height:40px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-top:8px;">
    <div style="width:5px; height:24px; background:#000;"></div>
    <div style="width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent; border-top:13px solid #000;"></div>
  </div>

  <!-- ELEMENT 3: one DOM update -->
  <div style="border:4px solid #000; background:#fff; padding:14px 24px; text-align:center; box-shadow:4px 4px 0 0 #000; min-width:240px;">
    <div style="font-size:9pt; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#475569; margin-bottom:6px;">render</div>
    <div style="font-size:13pt; font-weight:900;">one DOM update</div>
    <div style="font-size:10pt; font-weight:700; margin-top:6px; background:#f1f5f9; border:1px solid #000; padding:4px 10px; display:inline-block;">count = 3</div>
  </div>

</div>
