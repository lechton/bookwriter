<div class="dg" style="font-family:monospace; background:#faf7f0; border:4px solid #000; padding:26px 22px 20px; display:flex; gap:18px; align-items:stretch; position:relative;">

  <!-- LEFT CARD: $state(prop.value) — copied once, no later flow -->
  <div style="flex:1; border:4px solid #000; background:#fff; padding:14px 14px 12px; position:relative; display:flex; flex-direction:column; box-shadow:4px 4px 0 0 #000;">
    <div style="font-size:10pt; font-weight:900; letter-spacing:0.02em; margin-bottom:12px; border-bottom:3px solid #000; padding-bottom:5px;">$state(prop.value)</div>

    <!-- timeline: initial slot filled, later slot dashed empty -->
    <div style="flex:1; display:flex; flex-direction:column; gap:14px; padding:8px 0;">
      <div>
        <div style="font-size:8pt; font-weight:900; letter-spacing:0.1em; text-transform:uppercase; color:#475569; margin-bottom:4px;">initial</div>
        <div style="border:2px solid #000; background:#fff; padding:8px 12px; font-size:10pt; font-weight:700; text-align:center;">"hello"</div>
      </div>
      <div>
        <div style="font-size:8pt; font-weight:900; letter-spacing:0.1em; text-transform:uppercase; color:#94a3b8; margin-bottom:4px;">later</div>
        <div style="border:2px dashed #94a3b8; background:#faf7f0; padding:8px 12px; font-size:10pt; font-weight:700; text-align:center; color:#94a3b8;">(empty)</div>
      </div>
    </div>

    <div style="font-size:9pt; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#475569; margin-top:10px; text-align:center;">copied once, no later tracking</div>
  </div>

  <!-- RIGHT CARD: $derived(prop.value) — continuous flow -->
  <div style="flex:1; border:4px solid #000; background:#fff; padding:14px 14px 12px; position:relative; display:flex; flex-direction:column; box-shadow:4px 4px 0 0 #000;">
    <div style="font-size:10pt; font-weight:900; letter-spacing:0.02em; margin-bottom:12px; border-bottom:3px solid #000; padding-bottom:5px;">$derived(prop.value)</div>

    <!-- timeline: both slots filled, connected by mustard-yellow arrow (continuous flow) -->
    <div style="flex:1; display:flex; flex-direction:column; align-items:stretch; gap:0; padding:8px 0;">
      <div>
        <div style="font-size:8pt; font-weight:900; letter-spacing:0.1em; text-transform:uppercase; color:#475569; margin-bottom:4px;">initial</div>
        <div style="border:2px solid #000; background:#fff; padding:8px 12px; font-size:10pt; font-weight:700; text-align:center;">"hello"</div>
      </div>

      <!-- mustard-yellow connecting arrow (the only accent in the diagram) -->
      <div style="position:relative; height:28px; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <div style="width:4px; height:18px; background:#facc15; border-left:2px solid #000; border-right:2px solid #000;"></div>
        <div style="width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-top:10px solid #facc15;"></div>
      </div>

      <div>
        <div style="font-size:8pt; font-weight:900; letter-spacing:0.1em; text-transform:uppercase; color:#475569; margin-bottom:4px;">later</div>
        <div style="border:2px solid #000; background:#fff; padding:8px 12px; font-size:10pt; font-weight:700; text-align:center;">"world"</div>
      </div>
    </div>

    <div style="font-size:9pt; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:#475569; margin-top:10px; text-align:center;">recomputes whenever prop changes</div>
  </div>

</div>
